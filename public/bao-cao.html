<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doanh thu</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/apex.css?v=30" rel="stylesheet">
  <script src="assets/js/cau-hinh.js"></script>
  <!-- Cổng chặn: chưa đăng nhập là chuyển thẳng sang trang đăng nhập, chạy trước apex.js -->
  <script src="assets/js/canh-cong.js?v=1"></script>
    <script src="assets/js/apex.js?v=36"></script>
  <!-- echarts (~1 MB) tải SAU apex.js và defer: dữ liệu được gọi ngay, biểu đồ vẽ khi echarts xong -->
  <script defer src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <div class="apex-khung">
    <div id="apex-sidebar-cho"></div>
    <div class="apex-noi-dung">
      <div id="apex-topbar-cho"></div>
      <main class="apex-trang">

        <!-- KPI -->
        <div class="luoi-kpi" id="kpi"></div>

        <!-- Doanh thu theo tháng -->
        <div class="the">
          <div class="the-dau">
            <div>
              <h3>Doanh thu theo tháng (triệu đồng)</h3>
            </div>
          </div>
          <div class="the-than"><div class="khung-bieu-do" id="bd-doanh-thu"></div></div>
        </div>

        <!-- Số đơn theo tháng + tỉ trọng trạng thái -->
        <div class="luoi-2-deu">
          <div class="the">
            <div class="the-dau"><div><h3>Số đơn theo tháng</h3></div></div>
            <div class="the-than"><div class="khung-bieu-do-nho" id="bd-don"></div></div>
          </div>
          <div class="the">
            <div class="the-dau"><div><h3>Tỉ trọng doanh thu theo trạng thái</h3></div></div>
            <div class="the-than"><div class="khung-bieu-do-nho" id="bd-tron"></div></div>
          </div>
        </div>

        <!-- Chi tiết doanh thu theo đơn -->
        <div class="the">
          <div class="the-dau"><div><h3>Chi tiết doanh thu theo đơn</h3></div></div>
          <div class="the-than khong-dem bang-cuon">
            <table class="bang">
              <thead>
                <tr>
                  <th>Mã đơn</th>
                  <th>Khách hàng</th>
                  <th>Ngày</th>
                  <th class="giua">Trạng thái</th>
                  <th class="phai">Tổng tiền</th>
                </tr>
              </thead>
              <tbody id="bang-chi-tiet"></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script>
    Apex.shell('bao-cao', 'Báo cáo doanh thu');

    /* Mọi con số do backend tính sẵn trong khoá 'bao-cao' — trang chỉ vẽ.
       Doanh thu KHÔNG cộng đơn đã huỷ (cả thẻ KPI, biểu đồ lẫn tỉ trọng); số đơn thì đếm hết
       vì đó là đơn đã nhận. Trước đây thẻ KPI cộng cả đơn huỷ còn biểu đồ thì không. */
    function veLaiTrang() {
      var bc = Apex.tk('bao-cao');
      if (!bc) return;
      var kpi = bc.kpi || {};
      var thang = bc.theoThang || {};
      var tiLe = kpi.tiLeHoanThanh || 0;

      Apex.fill('#kpi', [
        { nhan: 'Doanh thu', so: Apex.money(kpi.doanhThu), icon: 'fa-wallet', mau: 'bt-xanh' },
        { nhan: 'Số đơn', so: Apex.number(kpi.soDon) + ' đơn', icon: 'fa-cart-shopping', mau: 'bt-vang' },
        { nhan: 'Giá trị đơn trung bình', so: Apex.money(kpi.giaTriTrungBinh), icon: 'fa-chart-simple', mau: 'bt-toi' },
        { nhan: 'Tỉ lệ hoàn thành', so: tiLe + '%', icon: 'fa-circle-check', mau: tiLe >= 50 ? 'bt-xanh' : 'bt-do' }
      ].map(function (k) {
        return '<div class="kpi"><div class="dong-dau"><span class="nhan">' + k.nhan + '</span>' +
          '<span class="bieu-tuong ' + k.mau + '"><i class="fa-solid ' + k.icon + '"></i></span></div>' +
          '<div class="so">' + k.so + '</div></div>';
      }).join(''));

      // Doanh thu + số đơn theo tháng (giờ Việt Nam)
      if (thang.coDuLieu) {
        Apex.bieuDoDuong('bd-doanh-thu', thang.nhan, [
          { ten: 'Năm ' + thang.nam, duLieu: thang.namNay },
          { ten: 'Năm ' + (thang.nam - 1), duLieu: thang.namTruoc }
        ], true);
        Apex.bieuDoCot('bd-don', thang.nhan, thang.soDon, 'Số đơn');
      } else {
        var chuaCo = '<div class="chua-co-so-lieu">Chưa có đơn hàng nào trong năm ' +
          Apex.esc(thang.nam) + ' để lập biểu đồ.</div>';
        Apex.fill('#bd-doanh-thu', chuaCo);
        Apex.fill('#bd-don', chuaCo);
      }

      // Tỉ trọng doanh thu theo trạng thái (đơn huỷ không phải doanh thu nên không có miếng nào)
      Apex.bieuDoTron('bd-tron', (bc.tiTrongDoanhThu || []).map(function (t) {
        return { name: t.trangThaiTen, value: t.doanhThu };
      }));

      // Bảng chi tiết — ngày đã đổi sẵn sang d/M/yyyy giờ Việt Nam
      Apex.fill('#bang-chi-tiet', (bc.don || []).map(function (o) {
        return '<tr><td><strong>' + Apex.esc(o.maDon) + '</strong></td>' +
          '<td>' + Apex.esc(o.tenKhach) + '</td>' +
          '<td>' + Apex.esc(o.ngay) + '</td>' +
          '<td class="giua">' + Apex.badgeTrangThai(o.trangThaiTen) + '</td>' +
          '<td class="phai"><strong>' + Apex.money(o.tongTien) + '</strong></td></tr>';
      }).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--chu-mo);padding:28px;">Chưa có đơn hàng nào để lập báo cáo.</td></tr>');
    }
    // Một request cho cả trang; Apex gọi veLaiTrang khi dữ liệu về
    Apex.trang({ bo: ['bao-cao'], ve: veLaiTrang });
  </script>
</body>
</html>
