<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khách hàng</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/apex.css?v=24" rel="stylesheet">
  <script src="assets/js/apex.js?v=23"></script>
  <style>
    .chu-cai {
      width: 36px; height: 36px; flex: 0 0 36px;
      border-radius: 50%;
      background: var(--accent-nhat);
      color: var(--accent-dam);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="apex-khung">
    <div id="apex-sidebar-cho"></div>
    <div class="apex-noi-dung">
      <div id="apex-topbar-cho"></div>
      <main class="apex-trang">

        <!-- KPI -->
        <div class="luoi-kpi" id="kpi"></div>

        <!-- Danh sách khách hàng -->
        <div class="the">
          <div class="the-dau">
            <div>
              <h3>Danh sách khách hàng</h3>
            </div>
          </div>
          <div class="the-than khong-dem bang-cuon">
            <table class="bang">
              <thead>
                <tr>
                  <th>Khách hàng</th>
                  <th>Email</th>
                  <th>Điện thoại</th>
                  <th>Nhóm</th>
                  <th class="giua">Số đơn</th>
                  <th class="phai">Tổng chi tiêu</th>
                </tr>
              </thead>
              <tbody id="bang-khach"></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script>
    Apex.shell('khach-hang', 'Khách hàng');

    function veLaiTrang() {
      var kh = Apex.customers || [];
      var daDangKy = kh.filter(function (c) { return c.group !== 'Khách lẻ'; }).length;
      var vangLai = kh.filter(function (c) { return c.group === 'Khách lẻ'; }).length;
      var tongChi = kh.reduce(function (s, c) { return s + (c.spent || 0); }, 0);

      Apex.fill('#kpi', [
        { nhan: 'Tổng khách hàng', so: Apex.number(kh.length) + ' khách', icon: 'fa-users', mau: 'bt-xanh' },
        { nhan: 'Tài khoản đã đăng ký', so: Apex.number(daDangKy), icon: 'fa-user-check', mau: 'bt-vang' },
        { nhan: 'Khách vãng lai', so: Apex.number(vangLai), icon: 'fa-user-clock', mau: 'bt-toi' },
        { nhan: 'Tổng chi tiêu', so: Apex.money(tongChi), icon: 'fa-wallet', mau: 'bt-do' }
      ].map(function (k) {
        return '<div class="kpi"><div class="dong-dau"><span class="nhan">' + k.nhan + '</span>' +
          '<span class="bieu-tuong ' + k.mau + '"><i class="fa-solid ' + k.icon + '"></i></span></div>' +
          '<div class="so">' + k.so + '</div></div>';
      }).join(''));

      function badgeNhom(nhom) {
        var lop = 'badge-xam';
        if (nhom === 'Quản trị') lop = 'badge-do';
        else if (nhom === 'Khách hàng') lop = 'badge-duong';
        return '<span class="badge ' + lop + '"><span class="cham"></span>' + Apex.esc(nhom || 'Khách lẻ') + '</span>';
      }

      function chuCai(ten) {
        var t = (ten || '?').trim();
        return Apex.esc(t ? t.charAt(0).toUpperCase() : '?');
      }

      Apex.fill('#bang-khach', kh.map(function (c) {
        return '<tr>' +
          '<td><div class="o-ten"><span class="chu-cai">' + chuCai(c.name) + '</span>' +
            '<span><span class="chinh">' + Apex.esc(c.name || 'Không rõ') + '</span>' +
            '<span class="phu">' + Apex.esc(c.id || '') + '</span></span></div></td>' +
          '<td>' + Apex.esc(c.email || '—') + '</td>' +
          '<td>' + Apex.esc(c.phone || '—') + '</td>' +
          '<td>' + badgeNhom(c.group) + '</td>' +
          '<td class="giua">' + Apex.number(c.orders || 0) + '</td>' +
          '<td class="phai"><strong>' + Apex.money(c.spent || 0) + '</strong></td>' +
          '</tr>';
      }).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--chu-mo);padding:28px;">Chưa có khách hàng nào.</td></tr>');
    }
    Apex.datVeLai(veLaiTrang);   // Apex gọi ngay khi dữ liệu về
  </script>
</body>
</html>
