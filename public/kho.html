<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kho &amp; vật tư</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/apex.css?v=30" rel="stylesheet">
  <script src="assets/js/apex.js?v=32"></script>
  <style>
    .dong-het { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--vien); }
    .dong-het:last-child { border-bottom: none; }
    .dong-het .ten-vt { font-weight: 600; font-size: 14px; }
    .dong-het .phu-vt { color: var(--chu-mo); font-size: 12.5px; margin-top: 2px; }

    /* ---- Bảng đợt nhập trong form vật tư: mỗi đợt một ngày, một giá, một nơi mua ---- */
    .dau-lo, .dong-lo {
      display: grid;
      grid-template-columns: 140px 90px 120px minmax(0, 1fr) 32px;
      gap: 8px; align-items: center;
    }
    .dau-lo {
      color: var(--chu-mo); font-size: 11.5px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .3px; padding: 0 2px 6px 2px;
    }
    .dong-lo { margin-bottom: 8px; }
    .dong-lo input, .dong-lo select { width: 100%; box-sizing: border-box; }
    .tong-lo { color: var(--chu-mo); font-size: 12.5px; margin-top: 4px; }
    .tong-lo strong { color: var(--chu); }
    @media (max-width: 700px) {
      /* Điện thoại: mỗi đợt xếp dọc, nút bỏ đợt nằm cuối */
      .dau-lo { display: none; }
      .dong-lo {
        grid-template-columns: 1fr 1fr;
        border: 1px solid var(--vien); border-radius: 10px; padding: 8px; margin-bottom: 10px;
      }
      .dong-lo > *:nth-child(4) { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="apex-khung">
    <div id="apex-sidebar-cho"></div>
    <div class="apex-noi-dung">
      <div id="apex-topbar-cho"></div>
      <main class="apex-trang">

        <!-- KPI -->
        <div class="luoi-kpi" id="kpi"></div>

        <!-- Bảng kho vật tư -->
        <div class="the">
          <div class="the-dau">
            <div>
              <h3>Kho vật tư</h3>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
              <select id="loc-trang-thai" class="nut nut-vien" style="padding:7px 10px;" onchange="veBang()">
                <option value="">Tất cả trạng thái</option>
              </select>
              <button class="nut nut-chinh" type="button" onclick="moFormVatTu(null)">
                <i class="fa-solid fa-plus"></i> Thêm
              </button>
            </div>
          </div>
          <div class="the-than khong-dem bang-cuon">
            <table class="bang">
              <thead>
                <tr>
                  <th>Vật tư</th>
                  <th class="giua">Trạng thái</th>
                  <th>Màu</th>
                  <th class="phai">Giá mua</th>
                  <th class="giua">SL</th>
                  <th class="phai">Tổng tiền</th>
                  <th class="giua">Đã dùng</th>
                  <th class="phai">Tiền đã dùng</th>
                  <th class="giua">Còn lại</th>
                </tr>
              </thead>
              <tbody id="bang-vat-tu"></tbody>
            </table>
          </div>
        </div>

        <!-- Nhựa sắp hết -->
        <div class="the">
          <div class="the-dau"><div><h3>Nhựa sắp hết</h3></div></div>
          <div class="the-than" id="nhua-sap-het"></div>
        </div>

      </main>
    </div>
  </div>

  <script>
    Apex.shell('kho', 'Kho & vật tư');

    var VT = Apex.vatTu;
    var NCC = Apex.nhaCungCap;

    /* Số liệu tổng hợp backend tính sẵn (khoá tk-kho): vốn, máy in, gram nhựa, số đếm theo
       trạng thái, danh sách nhựa sắp hết và % đã dùng từng dòng. Trước đây trang tự cộng
       trên cả danh sách vật tư và tự suy trạng thái bằng một bản sao quy tắc của Java. */
    var TK = {};
    var PT_DA_DUNG = {};   // id vật tư -> % đã dùng (0..100)

    function docThongKe() {
      TK = Apex.tk('tk-kho') || {};
      PT_DA_DUNG = {};
      (TK.theoVatTu || []).forEach(function (x) { PT_DA_DUNG[x.id] = x.phanTramDaDung || 0; });
    }

    /* ---------------- KPI ---------------- */

    function veKpi() {
      Apex.fill('#kpi',
        '<div class="kpi"><div class="dong-dau"><span class="nhan">Tổng vốn vật tư</span>' +
        '<span class="bieu-tuong bt-xanh"><i class="fa-solid fa-sack-dollar"></i></span></div>' +
        '<div class="so">' + Apex.money(TK.tongVon) + '</div>' +
        '<div class="thay-doi">Đã bỏ ra mua toàn bộ kho</div></div>' +

        '<div class="kpi"><div class="dong-dau"><span class="nhan">Máy in</span>' +
        '<span class="bieu-tuong bt-toi"><i class="fa-solid fa-print"></i></span></div>' +
        '<div class="so">' + Apex.number(TK.soMayIn) + ' máy</div>' +
        '<div class="thay-doi">' + Apex.money(TK.tienMayIn) + '</div></div>' +

        '<div class="kpi"><div class="dong-dau"><span class="nhan">Cuộn nhựa</span>' +
        '<span class="bieu-tuong bt-vang"><i class="fa-solid fa-record-vinyl"></i></span></div>' +
        '<div class="so">' + Apex.number(TK.soCuonNhua) + ' cuộn</div>' +
        '<div class="thay-doi">Tổng ' + Apex.number(TK.tongGramMua) + 'g nhựa đã mua</div></div>' +

        '<div class="kpi"><div class="dong-dau"><span class="nhan">Nhựa còn lại</span>' +
        '<span class="bieu-tuong ' + (TK.nhuaConItCanhBao ? 'bt-do' : 'bt-xanh') + '"><i class="fa-solid fa-weight-hanging"></i></span></div>' +
        '<div class="so">' + Apex.number(TK.gramConLai) + 'g</div>' +
        '<div class="thay-doi">đã dùng ' + Apex.number(TK.tongGramDaDung) + 'g</div></div>'
      );
    }

    /* ---------------- Bảng ---------------- */

    function veLocTrangThai() {
      var el = document.getElementById('loc-trang-thai');
      var dangChon = el.value;
      var dem = TK.theoTrangThai || {};
      el.innerHTML = '<option value="">Tất cả trạng thái</option>' +
        Object.keys(Apex.ttVatTu).map(function (k) {
          return '<option value="' + k + '">' + Apex.ttVatTu[k].ten + ' (' + (dem[k] || 0) + ')</option>';
        }).join('');
      el.value = dangChon;
    }

    function anhVatTu(v) { return Apex.anhDayDu(v.hinhAnh) || Apex.anhSanPham(v.ten); }

    /* Chuỗi JS an toàn khi nhét vào thuộc tính onclick="..." */
    function jsStr(s) { return JSON.stringify(String(s == null ? '' : s)).replace(/"/g, '&quot;'); }

    function veBang() {
      var loc = document.getElementById('loc-trang-thai').value;
      // Lọc theo trangThaiTinh backend suy sẵn — đúng trường mà huy hiệu và số đếm dùng
      var html = VT.map(function (v, i) { return { v: v, i: i }; })
        .filter(function (x) { return !loc || x.v.trangThaiTinh === loc; })
        .map(function (x) {
          var v = x.v;
          // Nhựa đếm bằng gram, máy in và dụng cụ đếm bằng cái — backend gửi sẵn donVi
          var dv = v.donVi || 'cái';
          var daDung = v.daDungGram || 0;
          var pt = PT_DA_DUNG[v.id] || 0;
          var mau = pt > 70 ? 'var(--vang)' : 'var(--accent)';

          return '<tr class="hang-bam" onclick="moFormVatTu(' + x.i + ')" title="Bấm để xem và sửa">' +
            '<td><div class="o-ten"><img class="anh-sp" src="' + anhVatTu(v) + '" alt="" ' +
            'onerror="this.src=\'' + Apex.anhSanPham(v.ten) + '\'" />' +
            '<div><div class="chinh">' + Apex.esc(v.ten) + '</div>' +
            '<div class="phu">' + Apex.esc(Apex.tenLoaiVatTu(v)) + '</div></div></div></td>' +
            '<td class="giua">' + Apex.badgeTtVatTu(v) + '</td>' +
            '<td>' + Apex.nhanMau(v, 15) + '</td>' +
            // Nhiều đợt nhập, mỗi đợt một giá: số hiện ở đây là giá BÌNH QUÂN
            '<td class="phai">' + Apex.money(v.gia) +
            ((v.soDotNhap || 0) > 1
              ? '<div style="color:var(--chu-mo);font-size:11.5px;margin-top:2px;" ' +
                'title="Giá bình quân của ' + v.soDotNhap + ' đợt nhập">TB ' + v.soDotNhap + ' đợt</div>'
              : '') + '</td>' +
            '<td class="giua"><strong>' + Apex.number(v.soLuong || 0) + '</strong></td>' +
            '<td class="phai">' + Apex.money(v.tongTienMua || 0) + '</td>' +
            '<td class="giua"><div><strong>' + Apex.number(daDung) + '</strong> ' + dv + '</div>' +
            '<div class="tien-trinh" style="margin-top:6px;"><div style="width:' + pt.toFixed(1) +
            '%;background:' + mau + '"></div></div></td>' +
            '<td class="phai">' + (daDung ? Apex.money(v.tienDaDung || 0) : '<span style="color:var(--chu-mo)">—</span>') + '</td>' +
            '<td class="giua"><strong>' + Apex.number(v.conLai || 0) + '</strong> ' + dv + '</td>' +
            '</tr>';
        }).join('');

      Apex.fill('#bang-vat-tu', html ||
        '<tr><td colspan="9" style="text-align:center;color:var(--chu-mo);padding:28px;">' +
        (loc ? 'Không có vật tư nào ở trạng thái này.' : 'Kho chưa có vật tư nào.') +
        '</td></tr>');
    }

    /* ---------------- Hộp thoại XEM + SỬA: bấm dòng nào mở dòng đó, sửa xong bấm Lưu ---------------- */

    var layAnh = null;

    function moFormVatTu(i) {
      var v = (i === null || i === undefined) ? null : VT[i];
      var moi = !v;
      var anhHienTai = v ? (v.hinhAnh || '') : '';

      // Loại lấy từ bảng danh mục (nhóm vật tư). Vật tư cũ chưa nối loại thì chọn
      // theo tính chất đang lưu; vật tư mới mặc định là nhựa (thứ nhập nhiều nhất).
      var dsLoai = Apex.danhMucVatTu();
      var loaiMacDinh = v ? v.danhMucId : null;
      if (!loaiMacDinh) {
        var tcMacDinh = v ? (v.loai || 'dung_cu') : 'nhua';
        var trung = dsLoai.filter(function (d) { return (d.tinhChat || 'dung_cu') === tcMacDinh; })[0] || dsLoai[0];
        if (trung) loaiMacDinh = trung.id;
      }
      var chonLoai = dsLoai.length
        ? dsLoai.map(function (d) {
            return '<option value="' + d.id + '" data-tinh-chat="' + Apex.esc(d.tinhChat || 'dung_cu') + '"' +
              (d.id === loaiMacDinh ? ' selected' : '') + '>' + Apex.esc(d.ten) + '</option>';
          }).join('')
        : '<option value="">— Chưa có loại vật tư —</option>';

      var chonTt = Object.keys(Apex.ttVatTu).map(function (k) {
        var macDinh = v ? (v.trangThai || 'con_hang') : 'con_hang';
        return '<option value="' + k + '"' + (k === macDinh ? ' selected' : '') + '>' + Apex.ttVatTu[k].ten + '</option>';
      }).join('');

      var chonMau = '<option value="">— Không chọn —</option>' + (Apex.mauSac || []).map(function (m) {
        var dangChon = v && (v.mauSacId === m.id || (!v.mauSacId && v.mau === m.ten));
        return '<option value="' + m.id + '"' + (dangChon ? ' selected' : '') + '>' + Apex.esc(m.ten) + '</option>';
      }).join('');

      var chonNcc = '<option value="">— Không chọn —</option>' + NCC.map(function (n) {
        return '<option value="' + n.id + '"' + (v && v.nhaCungCapId === n.id ? ' selected' : '') + '>' +
          Apex.esc(n.ten) + '</option>';
      }).join('');

      var html =
        '<div class="ht-dau">' +
        '<div><h3>' + (moi ? 'Thêm vật tư mới' : Apex.esc(v.ten)) + '</h3>' +
        (moi ? '' : '<div class="phu">' + Apex.esc(Apex.tenLoaiVatTu(v)) + '</div>') + '</div>' +
        '<button class="nut-dong" type="button" onclick="Apex.dongHopThoai()" aria-label="Đóng">' +
        '<i class="fa-solid fa-xmark"></i></button></div>' +

        '<div class="ht-than"><div class="ct-2cot">' +
        // Cột trái: ảnh to + chọn file / dán link ảnh
        '<div class="cot-anh">' + Apex.htmlOTaiAnh('vt-anh', anhHienTai, 'Chọn ảnh') + '</div>' +
        // Cột phải: toàn bộ thông tin, sửa thẳng tại chỗ
        '<div>' +
        '<div class="o-nhap"><label for="f-ten">Tên vật tư *</label>' +
        '<input type="text" id="f-ten" value="' +
        (v ? Apex.esc(v.ten) : '') + '" /></div>' +
        '<div class="luoi-nhap-2">' +
        '<div class="o-nhap"><label for="f-loai">Loại</label>' +
        '<select id="f-loai" onchange="doiDonViTheoLoai()"' + (dsLoai.length ? '' : ' disabled') + '>' +
        chonLoai + '</select></div>' +
        '<div class="o-nhap"><label for="f-mau">Màu</label>' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
        '<span id="f-mau-o" title="Màu đang chọn" style="width:26px;height:26px;border-radius:7px;' +
        'border:1px solid rgba(0,0,0,.18);flex-shrink:0;background:#e4e6e9;"></span>' +
        '<select id="f-mau" style="flex:1;min-width:0;" onchange="doiMauVatTu()">' + chonMau + '</select></div>' +
        '</div>' +
        // Ô khối lượng chỉ có nghĩa với nhựa; loại khác thì doiDonViTheoLoai() giấu đi
        '<div class="o-nhap" id="o-gram"><label for="f-gram">Khối lượng 1 đơn vị (gram)</label>' +
        '<input type="number" id="f-gram" min="0" step="50" value="' + (v ? (v.khoiLuongGram || 0) : 1000) + '" />' +
        '</div>' +
        '<div class="o-nhap"><label for="f-tt">Trạng thái</label><select id="f-tt">' + chonTt + '</select></div>' +
        '</div>' +
        (moi ? '' :
          '<div class="o-nhap"><label for="f-dung" id="nhan-da-dung">Đã dùng</label>' +
          '<input type="number" id="f-dung" min="0" step="1" value="' + (v.daDungGram || 0) + '" /></div>') +
        // Các đợt nhập: mua nhiều lần, mỗi lần một giá. Số lượng và giá của vật tư
        // cộng từ đây (giá là bình quân), không gõ rời nữa.
        '<div class="o-nhap"><label>Đợt nhập hàng</label>' +
        '<div class="dau-lo"><span>Ngày nhập</span><span>Số lượng</span><span>Đơn giá</span>' +
        '<span>Nơi mua</span><span></span></div>' +
        '<div id="ds-lo"></div>' +
        '<button type="button" class="nut nut-vien nut-nho" onclick="themDongLo()">' +
        '<i class="fa-solid fa-plus"></i> Thêm đợt nhập</button>' +
        '<div class="tong-lo" id="tong-lo"></div></div>' +
        '<div class="o-nhap"><label for="f-ncc">Nhà cung cấp chính</label><select id="f-ncc">' + chonNcc + '</select>' +
        '</div>' +
        '<div class="o-nhap"><label for="f-ghichu">Ghi chú</label>' +
        '<textarea id="f-ghichu" rows="2">' +
        (v ? Apex.esc(v.ghiChu || '') : '') + '</textarea></div>' +
        '<div class="tom-tat-sua" id="tom-tat-vt"></div>' +
        '<div class="bao-loi" id="loi-form"></div>' +
        '</div></div></div>' +

        '<div class="ht-chan">' +
        (moi ? '' : '<button class="nut nut-do" type="button" onclick="Apex.dangLuu(this, Apex.xoaVatTu(' + v.id + '))">' +
          '<i class="fa-solid fa-trash"></i> Xoá</button>') +
        '<div class="day-phai">' +
        '<button class="nut nut-vien" type="button" onclick="Apex.dongHopThoai()">Huỷ</button>' +
        '<button class="nut nut-chinh" type="button" onclick="luuForm(' + (v ? v.id : 'null') + ', this)">' +
        '<i class="fa-solid fa-floppy-disk"></i> Lưu</button>' +
        '</div></div>';

      Apex.moHopThoai(html, 'rong-lon');
      layAnh = Apex.ganOTaiAnh('vt-anh', anhHienTai);
      ['f-gram', 'f-dung'].forEach(function (id) {
        var e = document.getElementById(id);
        if (e) e.addEventListener('input', veTomTatVt);
      });
      // Vật tư cũ (backend chưa trả loNhap) coi như một đợt đúng bằng giá / số lượng đang lưu
      var dsLo = (v && v.loNhap && v.loNhap.length) ? v.loNhap
        : (v ? [{ ngayNhap: (v.createdAt || '').slice(0, 10), soLuong: v.soLuong || 1,
                  gia: v.gia || 0, nhaCungCapId: v.nhaCungCapId || null }]
             : [{ ngayNhap: '', soLuong: 1, gia: 0, nhaCungCapId: null }]);
      dsLo.forEach(themDongLo);
      doiMauVatTu();
      doiDonViTheoLoai();
    }

    /* ---------------- Đợt nhập hàng ---------------- */

    /** Hôm nay dạng 2026-09-24 (ô <input type="date"> chỉ nhận dạng này). */
    function homNay() {
      var d = new Date();
      var hai = function (n) { return (n < 10 ? '0' : '') + n; };
      return d.getFullYear() + '-' + hai(d.getMonth() + 1) + '-' + hai(d.getDate());
    }

    /** Thêm một dòng đợt nhập vào form; lo = đợt đang lưu, không có thì dòng trống của hôm nay. */
    function themDongLo(lo) {
      var ds = document.getElementById('ds-lo');
      if (!ds) return;
      var l = lo || {};
      var chonNcc = '<option value="">— Không ghi —</option>' + NCC.map(function (n) {
        return '<option value="' + n.id + '"' + (l.nhaCungCapId === n.id ? ' selected' : '') + '>' +
          Apex.esc(n.ten) + '</option>';
      }).join('');
      var o = document.createElement('div');
      o.className = 'dong-lo';
      o.innerHTML =
        '<input type="date" class="lo-ngay" aria-label="Ngày nhập" value="' +
        Apex.esc(l.ngayNhap || homNay()) + '" oninput="veTomTatVt()" />' +
        '<input type="number" class="lo-sl" min="1" step="1" aria-label="Số lượng nhập" value="' +
        (l.soLuong == null ? 1 : l.soLuong) + '" oninput="veTomTatVt()" />' +
        '<input type="number" class="lo-gia" min="0" step="1000" aria-label="Đơn giá đợt này" value="' +
        (l.gia == null ? 0 : l.gia) + '" oninput="veTomTatVt()" />' +
        '<select class="lo-ncc" aria-label="Nơi mua đợt này">' + chonNcc + '</select>' +
        '<button type="button" class="nut-bo-dong" title="Bỏ đợt nhập này" onclick="xoaDongLo(this)">' +
        '<i class="fa-solid fa-xmark"></i></button>';
      ds.appendChild(o);
      veTomTatVt();
    }

    /** Bỏ một đợt; đợt cuối cùng thì không cho bỏ (vật tư phải có ít nhất một đợt nhập). */
    function xoaDongLo(nut) {
      var ds = document.getElementById('ds-lo');
      var loi = document.getElementById('loi-form');
      if (ds.querySelectorAll('.dong-lo').length <= 1) {
        if (loi) loi.textContent = 'Vật tư phải có ít nhất một đợt nhập.';
        return;
      }
      if (loi) loi.textContent = '';
      var dong = nut.closest('.dong-lo');
      if (dong) dong.parentNode.removeChild(dong);
      veTomTatVt();
    }

    /** Các đợt đang gõ trong form, đúng thứ tự trên màn hình. */
    function docLoTuForm() {
      return Array.prototype.map.call(document.querySelectorAll('#ds-lo .dong-lo'), function (o) {
        var ncc = o.querySelector('.lo-ncc').value;
        return {
          ngayNhap: o.querySelector('.lo-ngay').value || homNay(),
          soLuong: parseInt(o.querySelector('.lo-sl').value, 10),
          gia: parseInt(o.querySelector('.lo-gia').value, 10),
          nhaCungCapId: ncc ? parseInt(ncc, 10) : null
        };
      });
    }

    /** Tổng của các đợt: số lượng, tiền, đơn giá bình quân (cùng công thức với backend). */
    function tongLoNhap(ds) {
      var sl = 0, tien = 0;
      ds.forEach(function (l) {
        var s = isNaN(l.soLuong) ? 0 : l.soLuong;
        var g = isNaN(l.gia) ? 0 : l.gia;
        sl += s;
        tien += g * s;
      });
      return { soLuong: sl, tien: tien, gia: sl > 0 ? Math.round(tien / sl) : 0 };
    }

    /**
     * Loại quyết định đơn vị đếm:
     *   nhựa   -> gram, cần ô "Khối lượng 1 cuộn", đã dùng tính bằng gram
     *   còn lại -> cái, giấu ô khối lượng, đã dùng là số cái
     * Móc khoá mà bắt khai "khối lượng 1 đơn vị 1000g" rồi "đã dùng 0 gram"
     * thì chẳng ai hiểu còn mấy cái.
     */
    function doiDonViTheoLoai() {
      var o = document.getElementById('f-loai');
      var oGram = document.getElementById('o-gram');
      var nhan = document.getElementById('nhan-da-dung');
      if (!o) return;
      var chon = o.options[o.selectedIndex];
      var laNhua = chon && chon.getAttribute('data-tinh-chat') === 'nhua';

      if (oGram) oGram.style.display = laNhua ? '' : 'none';
      if (nhan) nhan.textContent = laNhua ? 'Đã dùng (gram)' : 'Đã dùng (cái)';
      veTomTatVt();
    }

    /**
     * Tóm tắt tính ngay khi gõ: tổng tiền, còn lại, tiền đã dùng — theo đúng đơn vị của loại.
     * Số lượng và tiền cộng từ các ĐỢT NHẬP, giá mỗi gram là giá bình quân (mỗi đợt một giá
     * thì không biết cái đang in thuộc đợt nào) — đúng công thức backend dùng để lưu.
     */
    function veTomTatVt() {
      var o = document.getElementById('tom-tat-vt');
      var oLoai = document.getElementById('f-loai');
      if (!o || !oLoai) return;
      var chon = oLoai.options[oLoai.selectedIndex];
      var laNhua = !!chon && chon.getAttribute('data-tinh-chat') === 'nhua';
      var so = function (id) {
        var e = document.getElementById(id);
        return e ? (parseInt(e.value, 10) || 0) : 0;
      };
      var dsLo = docLoTuForm();
      var t = tongLoNhap(dsLo);
      var gram = so('f-gram'), daDung = so('f-dung');
      var tong = laNhua ? gram * t.soLuong : t.soLuong;
      var dv = laNhua ? 'g' : ' cái';
      var moiDonVi = t.soLuong > 0 ? t.tien / t.soLuong : 0;
      var tienDaDung = laNhua
        ? (tong > 0 ? Math.round(t.tien / tong * daDung) : 0)
        : Math.round(moiDonVi * daDung);

      var oTong = document.getElementById('tong-lo');
      if (oTong) {
        oTong.innerHTML = dsLo.length + ' đợt · Tổng <strong>' + Apex.number(t.soLuong) +
          '</strong> đơn vị · <strong>' + Apex.money(t.tien) + '</strong>' +
          (dsLo.length > 1 ? ' · Giá bình quân <strong>' + Apex.money(t.gia) + '</strong>/đơn vị' : '');
      }
      o.innerHTML = 'Tổng tiền mua <strong>' + Apex.money(t.tien) + '</strong>' +
        (laNhua && gram ? ' · Đơn giá <strong>' + Apex.number(Math.round(moiDonVi / gram)) + 'đ/g</strong>' : '') +
        ' · Còn lại <strong>' + Apex.number(Math.max(0, tong - daDung)) + dv + '</strong>' +
        (daDung ? ' · Tiền đã dùng <strong>' + Apex.money(tienDaDung) + '</strong>' : '');
    }

    /* Ô vuông cạnh ô Màu đổi theo màu đang chọn */
    function doiMauVatTu() {
      var o = document.getElementById('f-mau');
      var oMau = document.getElementById('f-mau-o');
      if (!o || !oMau) return;
      var m = Apex.timMau(parseInt(o.value, 10));
      oMau.style.background = m ? (Apex.maMauCua(m.maMau, m.ten) || '#e4e6e9') : '#e4e6e9';
    }

    function luuForm(id, nut) {
      var loi = document.getElementById('loi-form');
      var ten = document.getElementById('f-ten').value.trim();
      if (!ten) { loi.textContent = 'Vui lòng nhập tên vật tư.'; return; }
      var oLoai = document.getElementById('f-loai');
      if (!oLoai.value) {
        loi.innerHTML = 'Chưa có loại vật tư nào — hãy tạo ở trang <a href="danh-muc.html">Danh mục</a> trước.';
        return;
      }

      var tinhChat = oLoai.options[oLoai.selectedIndex].getAttribute('data-tinh-chat') || 'dung_cu';
      var laNhua = tinhChat === 'nhua';

      // Số lượng và giá của vật tư cộng từ các đợt nhập (giá = bình quân), không gõ rời
      var dsLo = docLoTuForm();
      if (!dsLo.length) { loi.textContent = 'Vật tư phải có ít nhất một đợt nhập.'; return; }
      for (var k = 0; k < dsLo.length; k++) {
        if (isNaN(dsLo[k].soLuong) || dsLo[k].soLuong < 1) {
          loi.textContent = 'Đợt nhập thứ ' + (k + 1) + ': số lượng phải là số nguyên từ 1 trở lên.';
          return;
        }
        if (isNaN(dsLo[k].gia) || dsLo[k].gia < 0) {
          loi.textContent = 'Đợt nhập thứ ' + (k + 1) + ': đơn giá phải là số không âm.';
          return;
        }
      }
      var tong = tongLoNhap(dsLo);
      var gia = tong.gia;
      var soLuong = tong.soLuong;
      // Không phải nhựa thì không có khái niệm khối lượng mỗi đơn vị
      var gram = laNhua ? parseInt(document.getElementById('f-gram').value, 10) : 0;
      if (isNaN(gram) || gram < 0) { loi.textContent = 'Khối lượng không hợp lệ, vui lòng nhập số không âm.'; return; }

      var duLieu = {
        ten: ten,
        danhMucId: parseInt(oLoai.value, 10),
        // loai gửi kèm để tương thích; backend tự chép tính chất của loại sang loai
        loai: tinhChat,
        mauSacId: document.getElementById('f-mau').value
          ? parseInt(document.getElementById('f-mau').value, 10) : null,
        loNhap: dsLo,
        // gia + soLuong gửi kèm cho khớp với các đợt; backend mới tự cộng lại từ loNhap
        gia: gia,
        soLuong: soLuong,
        khoiLuongGram: gram,
        trangThai: document.getElementById('f-tt').value,
        ghiChu: document.getElementById('f-ghichu').value.trim(),
        hinhAnh: layAnh ? layAnh() : '',
        nhaCungCapId: document.getElementById('f-ncc').value
          ? parseInt(document.getElementById('f-ncc').value, 10) : null
      };

      var oDung = document.getElementById('f-dung');
      if (oDung) {
        var dv = laNhua ? 'gram' : 'cái';
        var toiDa = laNhua ? gram * soLuong : soLuong;
        var daDung = parseInt(oDung.value, 10);
        if (isNaN(daDung) || daDung < 0) { loi.textContent = 'Số ' + dv + ' đã dùng không hợp lệ.'; return; }
        if (daDung > toiDa) {
          loi.textContent = 'Đã dùng không thể lớn hơn số đang có (' + toiDa + ' ' + dv + ').';
          return;
        }
        duLieu.daDungGram = daDung;
      }

      // Lưu xong Apex tự đóng hộp, nạp lại các khoá của trang rồi hiện toast; backend từ chối
      // thì câu backend báo hiện ngay trong ô lỗi, hộp vẫn mở.
      Apex.dangLuu(nut, function () { return id ? Apex.suaVatTu(id, duLieu) : Apex.themVatTu(duLieu); }, loi);
    }

    /* ---------------- Nhựa sắp hết ---------------- */

    /* Backend lọc sẵn các cuộn nhựa còn ≤ 200g (tk-kho.nhuaSapHet), kèm trạng thái đã suy */
    function veSapHet() {
      Apex.fill('#nhua-sap-het', (TK.nhuaSapHet || []).map(function (v) {
        return '<div class="dong-het"><div>' +
          '<div class="ten-vt">' + Apex.esc(v.ten) + '</div>' +
          '<div class="phu-vt">Màu: ' + (v.mau ? Apex.oMau(v.maMau, v.mau) + Apex.esc(v.mau) : '—') +
          ' · Còn lại <strong>' + Apex.number(v.conLaiGram) + 'g</strong></div>' +
          '</div>' + Apex.badgeTtVatTu(v) + '</div>';
      }).join('') || '<div style="text-align:center;color:var(--chu-mo);padding:28px;">Nhựa còn đủ dùng.</div>');
    }

    /* Vẽ lại toàn trang từ dữ liệu trong Apex — gọi lúc mở trang và sau mỗi lần ghi */
    function veLaiTrang() { docThongKe(); veKpi(); veLocTrangThai(); veBang(); veSapHet(); }

    /* Một request cho cả trang: vật tư, danh mục (ô Loại, tên loại), màu sắc và nhà cung cấp
       (hai ô chọn trong form) cùng số liệu tk-kho. Apex gọi veLaiTrang khi dữ liệu về và sau mỗi lần ghi. */
    Apex.trang({ bo: ['vat-tu', 'danh-muc', 'mau-sac', 'nha-cung-cap', 'tk-kho'], ve: veLaiTrang });
  </script>
</body>
