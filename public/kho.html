<!DOCTYPE html>
<html lang="vi" dir="ltr">

  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Quản lý kho và vật tư in 3D - IN3D Store">

    <title>Kho &amp; vật tư | IN3D Store</title>

    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicons/favicon-16x16.png">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicons/favicon.ico">
    <meta name="theme-color" content="#ffffff">
    <script src="assets/js/config.js"></script>
    <script src="vendors/overlayscrollbars/OverlayScrollbars.min.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,500,600,700%7cPoppins:300,400,500,600,700,800,900&amp;display=swap" rel="stylesheet">
    <link href="vendors/overlayscrollbars/OverlayScrollbars.min.css" rel="stylesheet">
    <link href="assets/css/theme-rtl.min.css" rel="stylesheet" id="style-rtl">
    <link href="assets/css/theme.min.css" rel="stylesheet" id="style-default">
    <link href="assets/css/user-rtl.min.css" rel="stylesheet" id="user-style-rtl">
    <link href="assets/css/user.min.css" rel="stylesheet" id="user-style-default">
    <link href="assets/css/app3d.css" rel="stylesheet">
    <script>
      var isRTL = JSON.parse(localStorage.getItem('isRTL'));
      if (isRTL) {
        document.getElementById('style-default').setAttribute('disabled', true);
        document.getElementById('user-style-default').setAttribute('disabled', true);
        document.querySelector('html').setAttribute('dir', 'rtl');
      } else {
        document.getElementById('style-rtl').setAttribute('disabled', true);
        document.getElementById('user-style-rtl').setAttribute('disabled', true);
      }
    </script>
    <script src="assets/js/app3d.js"></script>
  </head>

  <body>
    <main class="main" id="top">
      <div class="container" data-layout="container">
        <script>
          var isFluid = JSON.parse(localStorage.getItem('isFluid'));
          if (isFluid) {
            var container = document.querySelector('[data-layout]');
            container.classList.remove('container');
            container.classList.add('container-fluid');
          }
        </script>

        <script>App3D.sidebar('kho');</script>

        <div class="content">
          <script>App3D.topbar();</script>

          <script>
            App3D.pageHeader(
              'Kho & vật tư',
              'Theo dõi tồn kho máy in, nhựa in (PLA, PETG, TPU), resin và linh kiện thay thế.',
              '<button class="btn btn-falcon-default btn-sm me-2" type="button"><span class="fas fa-file-import me-1"></span>Nhập kho hàng loạt</button>' +
              '<button class="btn btn-primary btn-sm" type="button"><span class="fas fa-clipboard-check me-1"></span>Kiểm kê</button>'
            );
          </script>

          <div class="row g-3 mb-3">
            <div class="col-6 col-md-3">
              <div class="card h-100"><div class="card-body text-center">
                <h6 class="text-600 mb-2">Mặt hàng theo dõi</h6>
                <h4 class="fw-normal text-700 mb-0" id="stat-items">0</h4>
              </div></div>
            </div>
            <div class="col-6 col-md-3">
              <div class="card h-100"><div class="card-body text-center">
                <h6 class="text-600 mb-2">Dưới mức tối thiểu</h6>
                <h4 class="fw-normal text-warning mb-0" id="stat-below">0</h4>
              </div></div>
            </div>
            <div class="col-6 col-md-3">
              <div class="card h-100"><div class="card-body text-center">
                <h6 class="text-600 mb-2">Hết hàng</h6>
                <h4 class="fw-normal text-danger mb-0" id="stat-out">0</h4>
              </div></div>
            </div>
            <div class="col-6 col-md-3">
              <div class="card h-100"><div class="card-body text-center">
                <h6 class="text-600 mb-2">Tổng đơn vị tồn</h6>
                <h4 class="fw-normal text-700 mb-0" id="stat-units">0</h4>
              </div></div>
            </div>
          </div>

          <div class="card mb-3" id="stockTable" data-list='{"valueNames":["sku","name","type","stock","location","updated"],"page":10,"pagination":true}'>
            <div class="card-header">
              <div class="row flex-between-center g-2">
                <div class="col-sm-auto">
                  <h6 class="mb-0 text-nowrap py-2 py-xl-0">Tồn kho chi tiết</h6>
                </div>
                <div class="col-sm-auto">
                  <div class="row g-2">
                    <div class="col-auto">
                      <div class="input-group input-group-sm">
                        <span class="input-group-text"><span class="fas fa-search"></span></span>
                        <input class="form-control search" type="search" placeholder="Tìm mã SKU, tên vật tư..." aria-label="Tìm vật tư" />
                      </div>
                    </div>
                    <div class="col-auto">
                      <select class="form-select form-select-sm" id="filter-type" aria-label="Lọc theo loại">
                        <option value="">Tất cả loại</option>
                        <option value="Máy in">Máy in</option>
                        <option value="Vật tư tiêu hao">Vật tư tiêu hao</option>
                        <option value="Linh kiện">Linh kiện</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive scrollbar">
                <table class="table table-sm table-striped fs--1 mb-0 overflow-hidden app3d-table">
                  <thead class="bg-200 text-900">
                    <tr>
                      <th class="sort" data-sort="sku">Mã SKU</th>
                      <th class="sort" data-sort="name">Mặt hàng</th>
                      <th class="sort" data-sort="type">Loại</th>
                      <th class="sort text-center" data-sort="stock">Tồn</th>
                      <th class="text-center">Tối thiểu</th>
                      <th>Mức tồn</th>
                      <th class="sort" data-sort="location">Vị trí</th>
                      <th class="sort" data-sort="updated">Cập nhật</th>
                      <th class="text-center">Trạng thái</th>
                      <th class="text-end">Thao tác</th>
                    </tr>
                  </thead>
                  <tbody class="list"></tbody>
                </table>
              </div>
              <div class="text-center py-4 fallback d-none">
                <p class="fw-bold fs-1 mb-0">Không tìm thấy mặt hàng nào.</p>
              </div>
            </div>
            <div class="card-footer">
              <div class="d-flex justify-content-center">
                <ul class="pagination mb-0"></ul>
              </div>
            </div>
          </div>
          <script>
            App3D.fill('#stockTable tbody.list', App3D.inventoryRows());
          </script>

          <!-- Gợi ý nhập hàng -->
          <div class="card mb-3">
            <div class="card-header border-bottom">
              <h6 class="mb-0">Đề xuất nhập hàng trong tuần</h6>
            </div>
            <div class="card-body" id="restock-suggestions"></div>
          </div>
          <script>
            App3D.fill('#restock-suggestions', App3D.inventory
              .filter(function (i) { return i.stock <= i.min; })
              .map(function (i) {
                var need = Math.max(i.min * 2 - i.stock, i.min);
                return '<div class="d-flex align-items-center justify-content-between border-bottom border-200 py-2">' +
                  '<div><h6 class="mb-0 fs--1">' + App3D.escapeHtml(i.name) + '</h6>' +
                  '<span class="fs--2 text-500">' + App3D.escapeHtml(i.sku) + ' &middot; tồn ' + i.stock + '/' + i.min + '</span></div>' +
                  '<div class="text-end"><span class="badge badge-soft-primary">Nên nhập ' + need + '</span></div></div>';
              }).join('') || '<p class="mb-0 text-500">Tất cả mặt hàng đều trên mức tồn tối thiểu.</p>');
          </script>

          <script>App3D.footer();</script>
        </div>
      </div>
    </main>

    <script src="vendors/popper/popper.min.js"></script>
    <script src="vendors/bootstrap/bootstrap.min.js"></script>
    <script src="vendors/is/is.min.js"></script>
    <script src="vendors/fontawesome/all.min.js"></script>
    <script src="vendors/lodash/lodash.min.js"></script>
    <script src="vendors/list.js/list.min.js"></script>
    <script src="assets/js/theme.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var inv = App3D.inventory;
        document.getElementById('stat-items').textContent = App3D.number(inv.length);
        document.getElementById('stat-below').textContent = App3D.number(inv.filter(function (i) { return i.stock > 0 && i.stock <= i.min; }).length);
        document.getElementById('stat-out').textContent = App3D.number(inv.filter(function (i) { return i.stock <= 0; }).length);
        document.getElementById('stat-units').textContent = App3D.number(inv.reduce(function (s, i) { return s + i.stock; }, 0));

        var select = document.getElementById('filter-type');
        var searchInput = document.querySelector('#stockTable .search');
        select.addEventListener('change', function () {
          searchInput.value = select.value;
          searchInput.dispatchEvent(new Event('keyup', { bubbles: true }));
        });
      });
    </script>
  </body>

</html>
