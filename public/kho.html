<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kho &amp; vật tư</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/apex.css?v=24" rel="stylesheet">
  <script src="assets/js/apex.js?v=23"></script>
  <style>
    .dong-het { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--vien); }
    .dong-het:last-child { border-bottom: none; }
    .dong-het .ten-vt { font-weight: 600; font-size: 14px; }
    .dong-het .phu-vt { color: var(--chu-mo); font-size: 12.5px; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="apex-khung">
    <div id="apex-sidebar-cho"></div>
    <div class="apex-noi-dung">
      <div id="apex-topbar-cho"></div>
      <main class="apex-trang">

        <!-- KPI -->
        <div class="luoi-kpi" id="kpi"></div>

        <!-- Bảng kho vật tư -->
        <div class="the">
          <div class="the-dau">
            <div>
              <h3>Kho vật tư</h3>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
              <select id="loc-trang-thai" class="nut nut-vien" style="padding:7px 10px;" onchange="veBang()">
                <option value="">Tất cả trạng thái</option>
              </select>
              <button class="nut nut-chinh" type="button" onclick="moFormVatTu(null)">
                <i class="fa-solid fa-plus"></i> Thêm
              </button>
            </div>
          </div>
          <div class="the-than khong-dem bang-cuon">
            <table class="bang">
              <thead>
                <tr>
                  <th>Vật tư</th>
                  <th class="giua">Trạng thái</th>
                  <th>Màu</th>
                  <th class="phai">Giá mua</th>
                  <th class="giua">SL</th>
                  <th class="phai">Tổng tiền</th>
                  <th class="giua">Đã dùng</th>
                  <th class="phai">Tiền đã dùng</th>
                  <th class="giua">Còn lại</th>
                </tr>
              </thead>
              <tbody id="bang-vat-tu"></tbody>
            </table>
          </div>
        </div>

        <!-- Nhựa sắp hết -->
        <div class="the">
          <div class="the-dau"><div><h3>Nhựa sắp hết</h3></div></div>
          <div class="the-than" id="nhua-sap-het"></div>
        </div>

      </main>
    </div>
  </div>

  <script>
    Apex.shell('kho', 'Kho & vật tư');

    var VT = Apex.vatTu || [];
    var NCC = Apex.nhaCungCap || [];

    /* ---------------- KPI ---------------- */

    function veKpi() {
      var cp = Apex.tinhChiPhi();
      var soMayIn = VT.filter(function (v) { return v.loai === 'may_in'; }).length;
      var soCuonNhua = VT.filter(function (v) { return v.loai === 'nhua'; })
        .reduce(function (s, v) { return s + (v.soLuong || 0); }, 0);

      Apex.fill('#kpi',
        '<div class="kpi"><div class="dong-dau"><span class="nhan">Tổng vốn vật tư</span>' +
        '<span class="bieu-tuong bt-xanh"><i class="fa-solid fa-sack-dollar"></i></span></div>' +
        '<div class="so">' + Apex.money(cp.tienMuaVatTu) + '</div>' +
        '<div class="thay-doi">Đã bỏ ra mua toàn bộ kho</div></div>' +

        '<div class="kpi"><div class="dong-dau"><span class="nhan">Máy in</span>' +
        '<span class="bieu-tuong bt-toi"><i class="fa-solid fa-print"></i></span></div>' +
        '<div class="so">' + Apex.number(soMayIn) + ' máy</div>' +
        '<div class="thay-doi">' + Apex.money(cp.tienMayIn) + '</div></div>' +

        '<div class="kpi"><div class="dong-dau"><span class="nhan">Cuộn nhựa</span>' +
        '<span class="bieu-tuong bt-vang"><i class="fa-solid fa-record-vinyl"></i></span></div>' +
        '<div class="so">' + Apex.number(soCuonNhua) + ' cuộn</div>' +
        '<div class="thay-doi">Tổng ' + Apex.number(cp.tongGramMua) + 'g nhựa đã mua</div></div>' +

        '<div class="kpi"><div class="dong-dau"><span class="nhan">Nhựa còn lại</span>' +
        '<span class="bieu-tuong ' + (cp.gramConLai <= Apex.nguongNhuaSapHet ? 'bt-do' : 'bt-xanh') + '"><i class="fa-solid fa-weight-hanging"></i></span></div>' +
        '<div class="so">' + Apex.number(cp.gramConLai) + 'g</div>' +
        '<div class="thay-doi">đã dùng ' + Apex.number(cp.tongGramDaDung) + 'g</div></div>'
      );
    }

    /* ---------------- Bảng ---------------- */

    function veLocTrangThai() {
      var el = document.getElementById('loc-trang-thai');
      var dangChon = el.value;
      el.innerHTML = '<option value="">Tất cả trạng thái</option>' +
        Object.keys(Apex.ttVatTu).map(function (k) {
          var so = VT.filter(function (v) { return Apex.ttVatTuThucTe(v) === k; }).length;
          return '<option value="' + k + '">' + Apex.ttVatTu[k].ten + ' (' + so + ')</option>';
        }).join('');
      el.value = dangChon;
    }

    function anhVatTu(v) { return Apex.anhDayDu(v.hinhAnh) || Apex.anhSanPham(v.ten); }

    /* Chuỗi JS an toàn khi nhét vào thuộc tính onclick="..." */
    function jsStr(s) { return JSON.stringify(String(s == null ? '' : s)).replace(/"/g, '&quot;'); }

    function veBang() {
      var loc = document.getElementById('loc-trang-thai').value;
      var html = VT.map(function (v, i) { return { v: v, i: i }; })
        .filter(function (x) { return !loc || Apex.ttVatTuThucTe(x.v) === loc; })
        .map(function (x) {
          var v = x.v;
          // Nhựa đếm bằng gram, máy in và dụng cụ đếm bằng cái — backend gửi sẵn donVi
          var dv = v.donVi || 'cái';
          var tong = v.tongCoThe || 0;
          var daDung = v.daDungGram || 0;
          var pt = tong > 0 ? Math.min(100, daDung / tong * 100) : 0;
          var mau = pt > 70 ? 'var(--vang)' : 'var(--accent)';

          return '<tr class="hang-bam" onclick="moChiTiet(' + x.i + ')" title="Bấm để xem chi tiết">' +
            '<td><div class="o-ten"><img class="anh-sp" src="' + anhVatTu(v) + '" alt="" ' +
            'onerror="this.src=\'' + Apex.anhSanPham(v.ten) + '\'" />' +
            '<div><div class="chinh">' + Apex.esc(v.ten) + '</div>' +
            '<div class="phu">' + Apex.esc(Apex.tenLoaiVatTu(v)) + '</div></div></div></td>' +
            '<td class="giua">' + Apex.badgeTtVatTu(v) + '</td>' +
            '<td>' + Apex.nhanMau(v, 15) + '</td>' +
            '<td class="phai">' + Apex.money(v.gia) + '</td>' +
            '<td class="giua"><strong>' + Apex.number(v.soLuong || 0) + '</strong></td>' +
            '<td class="phai">' + Apex.money(v.tongTienMua || 0) + '</td>' +
            '<td class="giua"><div><strong>' + Apex.number(daDung) + '</strong> ' + dv + '</div>' +
            '<div class="tien-trinh" style="margin-top:6px;"><div style="width:' + pt.toFixed(1) +
            '%;background:' + mau + '"></div></div></td>' +
            '<td class="phai">' + (daDung ? Apex.money(v.tienDaDung || 0) : '<span style="color:var(--chu-mo)">—</span>') + '</td>' +
            '<td class="giua"><strong>' + Apex.number(v.conLai || 0) + '</strong> ' + dv + '</td>' +
            '</tr>';
        }).join('');

      Apex.fill('#bang-vat-tu', html ||
        '<tr><td colspan="8" style="text-align:center;color:var(--chu-mo);padding:28px;">' +
        (loc ? 'Không có vật tư nào ở trạng thái này.' : 'Kho chưa có vật tư nào.') +
        '</td></tr>');
    }

    /* ---------------- Hộp thoại CHI TIẾT ---------------- */

    function moChiTiet(i) {
      var v = VT[i];
      if (!v) return;
      var laNhua = v.loai === 'nhua';
      var dv = v.donVi || 'cái';   // nhựa: g · máy in, dụng cụ: cái
      var tt = v.trangThai || 'con_hang';
      var ttThuc = Apex.ttVatTuThucTe(v);

      var dong = function (nhan, giaTri) {
        return '<div class="dong-tt"><span class="nhan-tt">' + nhan + '</span>' +
          '<span class="gia-tri">' + giaTri + '</span></div>';
      };

      var chonTt = Object.keys(Apex.ttVatTu).map(function (k) {
        return '<option value="' + k + '"' + (k === tt ? ' selected' : '') + '>' + Apex.ttVatTu[k].ten + '</option>';
      }).join('');

      var html =
        '<div class="ht-dau">' +
        '<div><h3>' + Apex.esc(v.ten) + '</h3><div class="phu">' +
        Apex.esc(Apex.tenLoaiVatTu(v)) +
        (v.mau ? ' · ' + Apex.oMau(v.maMau, v.mau) + Apex.esc(v.mau) : '') + '</div></div>' +
        '<button class="nut-dong" type="button" onclick="Apex.dongHopThoai()" aria-label="Đóng">' +
        '<i class="fa-solid fa-xmark"></i></button></div>' +

        '<div class="ht-than"><div class="ct-2cot">' +
        '<img class="anh-chi-tiet" src="' + anhVatTu(v) + '" alt="" onerror="this.src=\'' + Apex.anhSanPham(v.ten) + '\'" />' +
        '<div>' +
        dong('Trạng thái', Apex.badgeTtVatTu(ttThuc)) +
        dong('Giá mua 1 đơn vị', Apex.money(v.gia || 0)) +
        dong('Số lượng', Apex.number(v.soLuong || 0)) +
        dong('Tổng tiền đã mua', '<strong>' + Apex.money(v.tongTienMua || 0) + '</strong>') +
        (laNhua ? dong('Khối lượng mỗi cuộn', Apex.number(v.khoiLuongGram || 0) + 'g') : '') +
        (laNhua ? dong('Đơn giá theo gram', Math.round(v.donGiaMoiGram || 0).toLocaleString('vi-VN') + '₫/g') : '') +
        dong('Đã dùng', '<strong>' + Apex.number(v.daDungGram || 0) + ' ' + dv + '</strong> / ' +
             Apex.number(v.tongCoThe || 0) + ' ' + dv) +
        dong(laNhua ? 'Tiền nhựa đã tiêu hao' : 'Tiền đã dùng', Apex.money(v.tienDaDung || 0)) +
        dong('Còn lại', '<strong>' + Apex.number(v.conLai || 0) + ' ' + dv + '</strong>') +
        dong('Nhà cung cấp', v.nhaCungCap ? Apex.esc(v.nhaCungCap) : '—') +
        (v.ghiChu ? dong('Ghi chú', Apex.esc(v.ghiChu)) : '') +
        '<div class="o-nhap" style="margin-top:16px;margin-bottom:0;">' +
        '<label for="ct-tt-vt">Đổi nhanh trạng thái</label>' +
        '<select id="ct-tt-vt" onchange="Apex.doiTrangThaiVatTu(' + v.id + ', this.value)">' + chonTt + '</select>' +
        '</div>' +
        '</div></div></div>' +

        '<div class="ht-chan">' +
        '<button class="nut nut-do" type="button" onclick="Apex.xoaVatTu(' + v.id + ')">' +
        '<i class="fa-solid fa-trash"></i> Xoá</button>' +
        '<div class="day-phai">' +
        (laNhua
          ? '<button class="nut nut-xanh" type="button" onclick="Apex.dungThemGram(' + v.id + ', ' +
            jsStr(v.ten) + ')"><i class="fa-solid fa-plus"></i> Ghi nhận</button>'
          : '') +
        '<button class="nut nut-chinh" type="button" onclick="moFormVatTu(' + i + ')">' +
        '<i class="fa-solid fa-pen-to-square"></i> Sửa</button>' +
        '</div></div>';

      Apex.moHopThoai(html);
    }

    /* ---------------- Hộp thoại THÊM / SỬA ---------------- */

    var layAnh = null;

    function moFormVatTu(i) {
      var v = (i === null || i === undefined) ? null : VT[i];
      var moi = !v;
      var anhHienTai = v ? (v.hinhAnh || '') : '';

      // Loại lấy từ bảng danh mục (nhóm vật tư). Vật tư cũ chưa nối loại thì chọn
      // theo tính chất đang lưu; vật tư mới mặc định là nhựa (thứ nhập nhiều nhất).
      var dsLoai = Apex.danhMucVatTu();
      var loaiMacDinh = v ? v.danhMucId : null;
      if (!loaiMacDinh) {
        var tcMacDinh = v ? (v.loai || 'dung_cu') : 'nhua';
        var trung = dsLoai.filter(function (d) { return (d.tinhChat || 'dung_cu') === tcMacDinh; })[0] || dsLoai[0];
        if (trung) loaiMacDinh = trung.id;
      }
      var chonLoai = dsLoai.length
        ? dsLoai.map(function (d) {
            return '<option value="' + d.id + '" data-tinh-chat="' + Apex.esc(d.tinhChat || 'dung_cu') + '"' +
              (d.id === loaiMacDinh ? ' selected' : '') + '>' + Apex.esc(d.ten) + '</option>';
          }).join('')
        : '<option value="">— Chưa có loại vật tư —</option>';

      var chonTt = Object.keys(Apex.ttVatTu).map(function (k) {
        var macDinh = v ? (v.trangThai || 'con_hang') : 'con_hang';
        return '<option value="' + k + '"' + (k === macDinh ? ' selected' : '') + '>' + Apex.ttVatTu[k].ten + '</option>';
      }).join('');

      var chonMau = '<option value="">— Không chọn —</option>' + (Apex.mauSac || []).map(function (m) {
        var dangChon = v && (v.mauSacId === m.id || (!v.mauSacId && v.mau === m.ten));
        return '<option value="' + m.id + '"' + (dangChon ? ' selected' : '') + '>' + Apex.esc(m.ten) + '</option>';
      }).join('');

      var chonNcc = '<option value="">— Không chọn —</option>' + NCC.map(function (n) {
        return '<option value="' + n.id + '"' + (v && v.nhaCungCapId === n.id ? ' selected' : '') + '>' +
          Apex.esc(n.ten) + '</option>';
      }).join('');

      var html =
        '<div class="ht-dau">' +
        '<div><h3>' + (moi ? 'Thêm vật tư mới' : 'Sửa vật tư') + '</h3>' +
        (moi ? '' : '<div class="phu">' + Apex.esc(v.ten) + '</div>') + '</div>' +
        '<button class="nut-dong" type="button" onclick="Apex.dongHopThoai()" aria-label="Đóng">' +
        '<i class="fa-solid fa-xmark"></i></button></div>' +

        '<div class="ht-than">' +
        Apex.htmlOTaiAnh('vt-anh', anhHienTai, 'Chọn ảnh') +
        '<div class="o-nhap"><label for="f-ten">Tên vật tư *</label>' +
        '<input type="text" id="f-ten" value="' +
        (v ? Apex.esc(v.ten) : '') + '" /></div>' +
        '<div class="luoi-nhap-2">' +
        '<div class="o-nhap"><label for="f-loai">Loại</label>' +
        '<select id="f-loai" onchange="doiDonViTheoLoai()"' + (dsLoai.length ? '' : ' disabled') + '>' +
        chonLoai + '</select></div>' +
        '<div class="o-nhap"><label for="f-mau">Màu</label>' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
        '<span id="f-mau-o" title="Màu đang chọn" style="width:26px;height:26px;border-radius:7px;' +
        'border:1px solid rgba(0,0,0,.18);flex-shrink:0;background:#e4e6e9;"></span>' +
        '<select id="f-mau" style="flex:1;min-width:0;" onchange="doiMauVatTu()">' + chonMau + '</select></div>' +
        '</div>' +
        '<div class="o-nhap"><label for="f-gia">Giá mua 1 đơn vị (VNĐ)</label>' +
        '<input type="number" id="f-gia" min="0" step="1000" value="' + (v ? (v.gia || 0) : 0) + '" /></div>' +
        '<div class="o-nhap"><label for="f-sl">Số lượng</label>' +
        '<input type="number" id="f-sl" min="1" step="1" value="' + (v ? (v.soLuong || 1) : 1) + '" /></div>' +
        // Ô khối lượng chỉ có nghĩa với nhựa; loại khác thì doiDonViTheoLoai() giấu đi
        '<div class="o-nhap" id="o-gram"><label for="f-gram">Khối lượng 1 đơn vị (gram)</label>' +
        '<input type="number" id="f-gram" min="0" step="50" value="' + (v ? (v.khoiLuongGram || 0) : 1000) + '" />' +
        '</div>' +
        '<div class="o-nhap"><label for="f-tt">Trạng thái</label><select id="f-tt">' + chonTt + '</select></div>' +
        '</div>' +
        (moi ? '' :
          '<div class="o-nhap"><label for="f-dung" id="nhan-da-dung">Đã dùng</label>' +
          '<input type="number" id="f-dung" min="0" step="1" value="' + (v.daDungGram || 0) + '" /></div>') +
        '<div class="o-nhap"><label for="f-ncc">Nhà cung cấp</label><select id="f-ncc">' + chonNcc + '</select>' +
        '</div>' +
        '<div class="o-nhap"><label for="f-ghichu">Ghi chú</label>' +
        '<textarea id="f-ghichu" rows="2">' +
        (v ? Apex.esc(v.ghiChu || '') : '') + '</textarea></div>' +
        '<div class="bao-loi" id="loi-form"></div>' +
        '</div>' +

        '<div class="ht-chan"><div class="day-phai">' +
        '<button class="nut nut-vien" type="button" onclick="Apex.dongHopThoai()">Huỷ</button>' +
        '<button class="nut nut-chinh" type="button" onclick="luuForm(' + (v ? v.id : 'null') + ')">' +
        '<i class="fa-solid fa-floppy-disk"></i> Lưu</button>' +
        '</div></div>';

      Apex.moHopThoai(html);
      layAnh = Apex.ganOTaiAnh('vt-anh', anhHienTai);
      doiMauVatTu();
      doiDonViTheoLoai();
    }

    /**
     * Loại quyết định đơn vị đếm:
     *   nhựa   -> gram, cần ô "Khối lượng 1 cuộn", đã dùng tính bằng gram
     *   còn lại -> cái, giấu ô khối lượng, đã dùng là số cái
     * Móc khoá mà bắt khai "khối lượng 1 đơn vị 1000g" rồi "đã dùng 0 gram"
     * thì chẳng ai hiểu còn mấy cái.
     */
    function doiDonViTheoLoai() {
      var o = document.getElementById('f-loai');
      var oGram = document.getElementById('o-gram');
      var nhan = document.getElementById('nhan-da-dung');
      if (!o) return;
      var chon = o.options[o.selectedIndex];
      var laNhua = chon && chon.getAttribute('data-tinh-chat') === 'nhua';

      if (oGram) oGram.style.display = laNhua ? '' : 'none';
      if (nhan) nhan.textContent = laNhua ? 'Đã dùng (gram)' : 'Đã dùng (cái)';
    }

    /* Ô vuông cạnh ô Màu đổi theo màu đang chọn */
    function doiMauVatTu() {
      var o = document.getElementById('f-mau');
      var oMau = document.getElementById('f-mau-o');
      if (!o || !oMau) return;
      var m = Apex.timMau(parseInt(o.value, 10));
      oMau.style.background = m ? (Apex.maMauCua(m.maMau, m.ten) || '#e4e6e9') : '#e4e6e9';
    }

    function luuForm(id) {
      var loi = document.getElementById('loi-form');
      var ten = document.getElementById('f-ten').value.trim();
      if (!ten) { loi.textContent = 'Vui lòng nhập tên vật tư.'; return; }
      var oLoai = document.getElementById('f-loai');
      if (!oLoai.value) {
        loi.innerHTML = 'Chưa có loại vật tư nào — hãy tạo ở trang <a href="danh-muc.html">Danh mục</a> trước.';
        return;
      }

      var tinhChat = oLoai.options[oLoai.selectedIndex].getAttribute('data-tinh-chat') || 'dung_cu';
      var laNhua = tinhChat === 'nhua';

      var gia = parseInt(document.getElementById('f-gia').value, 10);
      var soLuong = parseInt(document.getElementById('f-sl').value, 10);
      // Không phải nhựa thì không có khái niệm khối lượng mỗi đơn vị
      var gram = laNhua ? parseInt(document.getElementById('f-gram').value, 10) : 0;
      if (isNaN(gia) || gia < 0) { loi.textContent = 'Giá mua không hợp lệ, vui lòng nhập số không âm.'; return; }
      if (isNaN(soLuong) || soLuong < 1) { loi.textContent = 'Số lượng phải là số nguyên từ 1 trở lên.'; return; }
      if (isNaN(gram) || gram < 0) { loi.textContent = 'Khối lượng không hợp lệ, vui lòng nhập số không âm.'; return; }

      var duLieu = {
        ten: ten,
        danhMucId: parseInt(oLoai.value, 10),
        // loai gửi kèm để tương thích; backend tự chép tính chất của loại sang loai
        loai: tinhChat,
        mauSacId: document.getElementById('f-mau').value
          ? parseInt(document.getElementById('f-mau').value, 10) : null,
        gia: gia,
        soLuong: soLuong,
        khoiLuongGram: gram,
        trangThai: document.getElementById('f-tt').value,
        ghiChu: document.getElementById('f-ghichu').value.trim(),
        hinhAnh: layAnh ? layAnh() : '',
        nhaCungCapId: document.getElementById('f-ncc').value
          ? parseInt(document.getElementById('f-ncc').value, 10) : null
      };

      var oDung = document.getElementById('f-dung');
      if (oDung) {
        var dv = laNhua ? 'gram' : 'cái';
        var toiDa = laNhua ? gram * soLuong : soLuong;
        var daDung = parseInt(oDung.value, 10);
        if (isNaN(daDung) || daDung < 0) { loi.textContent = 'Số ' + dv + ' đã dùng không hợp lệ.'; return; }
        if (daDung > toiDa) {
          loi.textContent = 'Đã dùng không thể lớn hơn số đang có (' + toiDa + ' ' + dv + ').';
          return;
        }
        duLieu.daDungGram = daDung;
      }

      loi.textContent = '';
      var ok = id ? Apex.suaVatTu(id, duLieu) : Apex.themVatTu(duLieu);
      if (ok) Apex.capNhatXong(['vat-tu', 'danh-muc'], id ? 'Đã lưu vật tư' : 'Đã thêm vật tư');
      else loi.textContent = 'Không lưu được vật tư. Kiểm tra lại backend Java (cổng 8090) rồi thử lại.';
    }

    /* ---------------- Nhựa sắp hết ---------------- */

    function veSapHet() {
      var sapHet = VT.filter(function (v) {
        return v.loai === 'nhua' && Apex.gramConLai(v) <= Apex.nguongNhuaSapHet;
      });
      Apex.fill('#nhua-sap-het', sapHet.map(function (v) {
        return '<div class="dong-het"><div>' +
          '<div class="ten-vt">' + Apex.esc(v.ten) + '</div>' +
          '<div class="phu-vt">Màu: ' + (v.mau ? Apex.oMau(v.maMau, v.mau) + Apex.esc(v.mau) : '—') +
          ' · Còn lại <strong>' + Apex.number(Apex.gramConLai(v)) + 'g</strong></div>' +
          '</div>' + Apex.badgeTtVatTu(v) + '</div>';
      }).join('') || '<div style="text-align:center;color:var(--chu-mo);padding:28px;">Nhựa còn đủ dùng.</div>');
    }

    /* Vẽ lại toàn trang từ dữ liệu trong Apex — gọi lúc mở trang và sau mỗi lần ghi */
    function veLaiTrang() { veKpi(); veLocTrangThai(); veBang(); veSapHet(); }
    Apex.datVeLai(veLaiTrang);   // Apex gọi ngay khi dữ liệu về, và sau mỗi lần ghi
  </script>
</body>
</html>
