<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nhà cung cấp</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/apex.css?v=30" rel="stylesheet">
  <script src="assets/js/apex.js?v=28"></script>
  <style>
    .nhom-ncc { padding: 14px 0; border-bottom: 1px solid var(--vien); }
    .nhom-ncc:first-child { padding-top: 0; }
    .nhom-ncc:last-child { border-bottom: 0; padding-bottom: 0; }
    .nhom-ncc .ten-ncc { font-weight: 700; margin-bottom: 8px; }
    .ds-vat-tu { display: flex; flex-direction: column; gap: 6px; }
    .ds-vat-tu .dong-vt {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      font-size: 13.5px; padding: 7px 12px; border: 1px solid var(--vien); border-radius: 9px;
    }
    .ds-vat-tu .dong-vt .mau-vt { color: var(--chu-mo); font-weight: 400; }
    .ds-vat-tu .trong { color: var(--chu-mo); font-size: 13.5px; padding: 4px 0; }
  </style>
</head>
<body>
  <div class="apex-khung">
    <div id="apex-sidebar-cho"></div>
    <div class="apex-noi-dung">
      <div id="apex-topbar-cho"></div>
      <main class="apex-trang">

        <div class="luoi-kpi" id="kpi-ncc"></div>

        <div class="the">
          <div class="the-dau">
            <div>
              <h3>Danh sách nhà cung cấp</h3>
            </div>
            <button class="nut nut-chinh" type="button" onclick="moForm(null)">
              <i class="fa-solid fa-plus"></i> Thêm
            </button>
          </div>

          <div class="the-than khong-dem bang-cuon">
            <table class="bang">
              <thead>
                <tr>
                  <th>Tên</th>
                  <th>Liên hệ</th>
                  <th>Ghi chú</th>
                  <th class="giua">Số vật tư</th>
                  <th class="phai">Tổng đã nhập</th>
                </tr>
              </thead>
              <tbody id="bang-ncc"></tbody>
            </table>
          </div>
        </div>

        <div class="the">
          <div class="the-dau">
            <div><h3>Vật tư theo nhà cung cấp</h3></div>
          </div>
          <div class="the-than" id="vat-tu-theo-ncc"></div>
        </div>

      </main>
    </div>
  </div>

  <script>
    Apex.shell('nha-cung-cap', 'Nhà cung cấp');

    var NCC = Apex.nhaCungCap || [];

    /* Số liệu backend gom sẵn (khoá tk-nha-cung-cap): KPI + từng nhà cung cấp có bao nhiêu
       vật tư, tổng tiền đã nhập và danh sách vật tư. Trang khỏi tải cả kho về để lọc, cộng. */
    var TK = { kpi: {}, theoNhaCungCap: [] };
    var THEO_NCC = {};   // id nhà cung cấp -> { soVatTu, tongTienNhap, vatTu: [{id, ten, mau, maMau, tongTienMua}] }

    function docSoLieu() {
      TK = Apex.tk('tk-nha-cung-cap') || { kpi: {}, theoNhaCungCap: [] };
      THEO_NCC = {};
      (TK.theoNhaCungCap || []).forEach(function (t) { THEO_NCC[t.id] = t; });
    }

    function soLieuCua(id) {
      return THEO_NCC[id] || { soVatTu: 0, tongTienNhap: 0, vatTu: [] };
    }
    function oLienHe(lienHe) {
      var lh = (lienHe || '').trim();
      if (!lh) return '<span style="color:var(--chu-mo);">—</span>';
      if (/^https?:\/\//i.test(lh)) {
        var rutGon = lh.replace(/^https?:\/\//i, '').replace(/\/+$/, '');
        if (rutGon.length > 32) rutGon = rutGon.slice(0, 32) + '…';
        return '<a href="' + Apex.esc(lh) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' +
          Apex.esc(rutGon) + '</a>';
      }
      return Apex.esc(lh);
    }

    /* ---------------- KPI ---------------- */

    function veKpi() {
      var kpi = TK.kpi || {};
      Apex.fill('#kpi-ncc', [
        { nhan: 'Nhà cung cấp', so: Apex.number(kpi.soNhaCungCap || 0), icon: 'fa-truck-field', mau: 'bt-xanh' },
        { nhan: 'Vật tư đã nhập', so: Apex.number(kpi.soVatTuCoNguon || 0), icon: 'fa-boxes-stacked', mau: 'bt-vang' },
        { nhan: 'Tổng tiền đã nhập', so: Apex.money(kpi.tongTienNhap || 0), icon: 'fa-wallet', mau: 'bt-toi' }
      ].map(function (k) {
        return '<div class="kpi"><div class="dong-dau"><span class="nhan">' + k.nhan + '</span>' +
          '<span class="bieu-tuong ' + k.mau + '"><i class="fa-solid ' + k.icon + '"></i></span></div>' +
          '<div class="so">' + k.so + '</div></div>';
      }).join(''));
    }

    /* ---------------- Bảng ---------------- */

    function veBang() {
      Apex.fill('#bang-ncc', NCC.map(function (n, i) {
        var s = soLieuCua(n.id);
        return '<tr class="hang-bam" onclick="moChiTiet(' + i + ')" title="Bấm để xem chi tiết">' +
          '<td><strong>' + Apex.esc(n.ten || '') + '</strong></td>' +
          '<td>' + oLienHe(n.lienHe) + '</td>' +
          '<td>' + (n.ghiChu ? Apex.esc(n.ghiChu) : '<span style="color:var(--chu-mo);">—</span>') + '</td>' +
          '<td class="giua">' + Apex.number(s.soVatTu || 0) + '</td>' +
          '<td class="phai"><strong>' + Apex.money(s.tongTienNhap || 0) + '</strong></td>' +
          '</tr>';
      }).join('') ||
        '<tr><td colspan="5" style="text-align:center;color:var(--chu-mo);padding:28px;">Chưa có nhà cung cấp nào.</td></tr>');
    }

    function veVatTuTheoNcc() {
      Apex.fill('#vat-tu-theo-ncc', NCC.map(function (n) {
        var vt = soLieuCua(n.id).vatTu || [];
        var ds = vt.length
          ? '<div class="ds-vat-tu">' + vt.map(function (v) {
              return '<div class="dong-vt"><span><strong>' + Apex.esc(v.ten || '') + '</strong>' +
                (v.mau ? ' <span class="mau-vt">· ' + Apex.oMau(v.maMau, v.mau) + Apex.esc(v.mau) + '</span>' : '') + '</span>' +
                '<span><strong>' + Apex.money(Number(v.tongTienMua) || 0) + '</strong></span></div>';
            }).join('') + '</div>'
          : '<div class="ds-vat-tu"><div class="trong">Chưa nhập vật tư nào.</div></div>';
        return '<div class="nhom-ncc"><div class="ten-ncc">' + Apex.esc(n.ten || '') + '</div>' + ds + '</div>';
      }).join('') || '<div style="text-align:center;color:var(--chu-mo);padding:28px;">Chưa có nhà cung cấp nào.</div>');
    }

    /* ---------------- Hộp thoại CHI TIẾT ---------------- */

    function moChiTiet(i) {
      var n = NCC[i];
      if (!n) return;
      var s = soLieuCua(n.id);
      var vt = s.vatTu || [];

      var dong = function (nhan, giaTri) {
        return '<div class="dong-tt"><span class="nhan-tt">' + nhan + '</span>' +
          '<span class="gia-tri">' + giaTri + '</span></div>';
      };

      var dsVt = vt.length
        ? '<div class="ds-vat-tu" style="margin-top:10px;">' + vt.map(function (v) {
            return '<div class="dong-vt"><span><strong>' + Apex.esc(v.ten) + '</strong>' +
              (v.mau ? ' <span class="mau-vt">· ' + Apex.oMau(v.maMau, v.mau) + Apex.esc(v.mau) + '</span>' : '') + '</span>' +
              '<span><strong>' + Apex.money(Number(v.tongTienMua) || 0) + '</strong></span></div>';
          }).join('') + '</div>'
        : '<div style="color:var(--chu-mo);font-size:13.5px;margin-top:8px;">Chưa nhập vật tư nào từ nơi này.</div>';

      var html =
        '<div class="ht-dau">' +
        '<div><h3>' + Apex.esc(n.ten) + '</h3></div>' +
        '<button class="nut-dong" type="button" onclick="Apex.dongHopThoai()"><i class="fa-solid fa-xmark"></i></button></div>' +

        '<div class="ht-than">' +
        '<div>' +
        dong('Liên hệ', oLienHe(n.lienHe)) +
        dong('Số vật tư đã nhập', Apex.number(s.soVatTu || 0)) +
        dong('Tổng tiền đã nhập', '<strong>' + Apex.money(s.tongTienNhap || 0) + '</strong>') +
        '</div>' +
        (n.ghiChu
          ? '<div style="margin-top:14px;"><div style="font-weight:600;margin-bottom:5px;">Ghi chú</div>' +
            '<div style="color:var(--chu-mo);font-size:13.5px;white-space:pre-wrap;">' + Apex.esc(n.ghiChu) + '</div></div>'
          : '') +
        '<div style="margin-top:16px;font-weight:600;">Vật tư đã nhập</div>' + dsVt +
        '</div>' +

        '<div class="ht-chan">' +
        '<button class="nut nut-do" type="button" onclick="Apex.dangLuu(this, Apex.xoaNhaCungCap(' + n.id + '))">' +
        '<i class="fa-solid fa-trash"></i> Xoá</button>' +
        '<div class="day-phai">' +
        '<button class="nut nut-chinh" type="button" onclick="moForm(' + i + ')">' +
        '<i class="fa-solid fa-pen-to-square"></i> Sửa</button>' +
        '</div></div>';

      Apex.moHopThoai(html);
    }

    /* ---------------- Hộp thoại THÊM / SỬA ---------------- */

    function moForm(i) {
      var n = (i === null || i === undefined) ? null : NCC[i];
      var moi = !n;

      var html =
        '<div class="ht-dau">' +
        '<div><h3>' + (moi ? 'Thêm nhà cung cấp' : 'Sửa nhà cung cấp') + '</h3>' +
        (moi ? '' : '<div class="phu">' + Apex.esc(n.ten) + '</div>') + '</div>' +
        '<button class="nut-dong" type="button" onclick="Apex.dongHopThoai()"><i class="fa-solid fa-xmark"></i></button></div>' +

        '<div class="ht-than">' +
        '<div class="o-nhap"><label for="f-ten">Tên nhà cung cấp *</label>' +
        '<input type="text" id="f-ten" value="' +
        (n ? Apex.esc(n.ten || '') : '') + '" /></div>' +
        '<div class="o-nhap"><label for="f-lien-he">Liên hệ</label>' +
        '<input type="text" id="f-lien-he" value="' +
        (n ? Apex.esc(n.lienHe || '') : '') + '" />' +
        '</div>' +
        '<div class="o-nhap"><label for="f-ghi-chu">Ghi chú</label>' +
        '<textarea id="f-ghi-chu" rows="2">' +
        (n ? Apex.esc(n.ghiChu || '') : '') + '</textarea></div>' +
        '<div class="bao-loi" id="loi-form"></div>' +
        '</div>' +

        '<div class="ht-chan"><div class="day-phai">' +
        '<button class="nut nut-vien" type="button" onclick="Apex.dongHopThoai()">Huỷ</button>' +
        '<button class="nut nut-chinh" type="button" onclick="luuForm(' + (n ? n.id : 'null') + ', this)">' +
        '<i class="fa-solid fa-floppy-disk"></i> Lưu</button>' +
        '</div></div>';

      Apex.moHopThoai(html);
    }

    function luuForm(id, nut) {
      var loi = document.getElementById('loi-form');
      var ten = document.getElementById('f-ten').value.trim();
      if (!ten) { loi.textContent = 'Vui lòng nhập tên nhà cung cấp.'; return; }

      var duLieu = {
        ten: ten,
        lienHe: document.getElementById('f-lien-he').value.trim(),
        ghiChu: document.getElementById('f-ghi-chu').value.trim()
      };
      loi.textContent = '';
      // Nút khoá + "Đang lưu…" trong lúc chờ; lỗi backend hiện ngay trong form, lưu xong Apex tự nạp lại trang
      Apex.dangLuu(nut, id
        ? Apex.suaNhaCungCap(id, duLieu, 'Đã lưu nhà cung cấp')
        : Apex.themNhaCungCap(duLieu, 'Đã thêm nhà cung cấp'), loi);
    }

    function veLaiTrang() { docSoLieu(); veKpi(); veBang(); veVatTuTheoNcc(); }
    // MỘT request cho cả trang: danh sách nhà cung cấp + số liệu gom sẵn. Apex vẽ khi dữ liệu về và sau mỗi lần ghi.
    Apex.trang({ bo: ['nha-cung-cap', 'tk-nha-cung-cap'], ve: veLaiTrang });
  </script>
</body>
</html>
