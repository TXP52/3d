<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý vốn &amp; chi phí</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/apex.css?v=30" rel="stylesheet">
  <script src="assets/js/cau-hinh.js"></script>
  <!-- Cổng chặn: chưa đăng nhập là chuyển thẳng sang trang đăng nhập, chạy trước apex.js -->
  <script src="assets/js/canh-cong.js?v=1"></script>
    <script src="assets/js/apex.js?v=36"></script>
  <!-- echarts (~1 MB) tải SAU apex.js và defer: dữ liệu được gọi ngay, biểu đồ vẽ khi echarts xong -->
  <script defer src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    .dong-tong td { font-weight: 700; background: #f6f7f8; }
    .hang-ap-dung { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
    .the-tong.gia-gram { margin-top: 18px; }

    /* Thời gian in của mẫu = giờ + phút (cùng kiểu ô ở trang Sản phẩm) */
    .o-gio-phut { display: flex; align-items: center; gap: 6px; }
    .o-nhap .o-gio-phut input { flex: 1 1 0; min-width: 0; }
    .o-gio-phut span { font-size: 13px; color: var(--chu-mo); white-space: nowrap; }
    .hang-ap-dung .o-nhap { flex: 1; min-width: 160px; margin: 0; }

    .luoi-chia { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 16px; }
    .luoi-chia .o-nhap { margin-bottom: 14px; }
    @media (max-width: 700px) { .luoi-chia { grid-template-columns: 1fr; } }
    .the-tong {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 4px;
    }
    @media (max-width: 560px) { .the-tong { grid-template-columns: 1fr; } }
    .the-tong .o-tong {
      border: 1px solid var(--vien); border-radius: var(--radius-nho); padding: 12px 14px;
    }
    .the-tong .o-tong.chinh { border-color: var(--accent); background: var(--accent-nhat); }
    .the-tong .o-tong .nhan-tong { color: var(--chu-mo); font-size: 12.5px; font-weight: 500; }
    .the-tong .o-tong .so-tong { font-size: 19px; font-weight: 700; margin-top: 3px; }
    .the-tong .o-tong.chinh .so-tong { color: var(--accent-dam); font-size: 24px; }
    .the-tong .o-tong .cong-thuc { color: var(--chu-mo); font-size: 12px; margin-top: 2px; }

    /* Chi phí chạy máy: năm định mức bên trái, tiền mỗi giờ in bên phải */
    .hang-nut-cp { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
    /* Chi tiết chi phí và giá bán đề xuất chia đôi bề ngang, không kéo cao bằng nhau
       (apex.css để .luoi-2 là 2fr 1fr và tự về 1 cột khi màn hẹp hơn 992px) */
    /* Chỉ chia đôi ở màn rộng: dưới 992px apex.css đã cho mỗi thẻ một hàng, nếu đặt ngoài
       media query thì dòng này đè lên và điện thoại vẫn bị hai cột bóp nhỏ */
    @media (min-width: 993px) {
      .luoi-tren { grid-template-columns: 1fr 1fr; }
    }
    .luoi-tren { align-items: start; }
    /* Thẻ giá bán nằm trong nửa bề ngang: số và biểu đồ xếp dọc cho dễ đọc */
    #khu-gia .luoi-2-deu { grid-template-columns: 1fr; }
    #khu-gia .khung-bieu-do { min-height: 220px; }
    /* Bảng nhựa rộng cả trang, cách thẻ phía trên một khoảng như các thẻ khác */
    .luoi-tren + .the { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="apex-khung">
    <div id="apex-sidebar-cho"></div>
    <div class="apex-noi-dung">
      <div id="apex-topbar-cho"></div>
      <main class="apex-trang">

        <!-- PHẦN 1: KPI vốn & chi phí -->
        <div class="luoi-kpi" id="kpi-von"></div>

        <!-- PHẦN 2: Chia tiền — hai ô riêng: chia vốn và chia lãi -->
        <div class="luoi-2">
          <div class="the">
            <div class="the-dau">
              <div><h3>Chia vốn</h3></div>
              <button class="nut nut-vien nut-nho" type="button" onclick="xoaChia('von')">
                <i class="fa-solid fa-eraser"></i> Xoá
              </button>
            </div>
            <div class="the-than">
              <div class="luoi-nhap-2">
                <div class="o-nhap">
                  <label for="ct-von">Tổng vốn (VNĐ)</label>
                  <input type="number" id="ct-von" min="0" step="1000">
                </div>
                <div class="o-nhap">
                  <label for="ct-von-chia">Số chia</label>
                  <input type="number" id="ct-von-chia" min="1" step="1">
                </div>
              </div>
              <div id="kq-chia-von"></div>
            </div>
          </div>

          <div class="the">
            <div class="the-dau">
              <div><h3>Chia lãi</h3></div>
              <button class="nut nut-vien nut-nho" type="button" onclick="xoaChia('lai')">
                <i class="fa-solid fa-eraser"></i> Xoá
              </button>
            </div>
            <div class="the-than">
              <div class="luoi-nhap-2">
                <div class="o-nhap">
                  <label for="ct-lai">Tổng lãi (VNĐ)</label>
                  <input type="number" id="ct-lai" min="0" step="1000">
                </div>
                <div class="o-nhap">
                  <label for="ct-lai-chia">Số chia</label>
                  <input type="number" id="ct-lai-chia" min="1" step="1">
                </div>
              </div>
              <div id="kq-chia-lai"></div>
            </div>
          </div>
        </div>

        <!-- Chi phí chạy máy mỗi giờ in (vẽ lại bằng veChiPhiMay()) -->
        <div id="khu-chi-phi-may"></div>

        <!-- PHẦN 3 + 5: chi tiết chi phí và giá bán đề xuất nằm cạnh nhau -->
        <div class="luoi-2 luoi-tren">
          <div class="the">
            <div class="the-dau"><div><h3>Chi tiết chi phí</h3></div></div>
            <div class="the-than khong-dem bang-cuon">
              <table class="bang">
                <thead><tr><th>Khoản mục</th><th class="phai">Số tiền</th></tr></thead>
                <tbody id="bang-chi-phi"></tbody>
              </table>
            </div>
          </div>

          <!-- Giá bán đề xuất theo gram (vẽ lại bằng veLai()) -->
          <div id="khu-gia"></div>
        </div>

        <!-- PHẦN 4: Nhựa đã dùng theo cuộn — rộng cả trang, bảng dài nên để riêng một hàng -->
        <div class="the">
          <div class="the-dau"><div><h3>Nhựa đã dùng theo cuộn</h3></div></div>
          <div class="the-than khong-dem bang-cuon">
            <table class="bang">
              <thead>
                <tr>
                  <th>Cuộn nhựa</th>
                  <th class="phai">Đơn giá/gram</th>
                  <th class="giua">Đã dùng</th>
                  <th class="giua">Còn lại</th>
                  <th class="phai">Tiền đã dùng</th>
                </tr>
              </thead>
              <tbody id="bang-nhua"></tbody>
            </table>
          </div>
        </div>

        <!-- PHẦN 6: Bảng giá dự kiến từng sản phẩm đang bán (vẽ lại bằng veLai()) -->
        <div id="khu-gia-bang"></div>

      </main>
    </div>
  </div>

  <script>
    Apex.shell('quan-ly-von', 'Quản lý vốn & chi phí');

    (function () {
      /* Mọi con số vốn, chi phí, doanh thu, lãi/lỗ và giá bán/gram do backend tính sẵn (khoá 'von').
         Trước đây trang tự cộng từ toàn bộ vật tư + đơn hàng tải về, doanh thu còn cộng cả đơn
         đã huỷ nên lãi/lỗ bị thổi lên. Riêng tỉ lệ lãi lưu ở trình duyệt này và gửi kèm mỗi
         lần khởi tạo (tiLeLai) để backend tính giá bán đề xuất. */
      var KHOA_TI_LE = 'in3d_ti_le_lai';

      /** Tỉ lệ lãi đã lưu (%), chưa có hoặc hỏng thì 120%. */
      function docTiLeLai() {
        var v = NaN;
        try { v = parseFloat(localStorage.getItem(KHOA_TI_LE)); } catch (e) { v = NaN; }
        return isNaN(v) ? 120 : v;
      }
      // Giữ trong biến: trình duyệt chặn localStorage thì vẫn áp dụng được cho lần xem này
      var TI_LE_LAI = docTiLeLai();

      /* ---------- PHẦN 1: KPI (vẽ lại được sau mỗi lần ghi nhận gram) ---------- */
      function veKpi() {
        var von = Apex.tk('von') || {};
        var cp = von.chiPhi || {};
        var laiLo = von.laiLo || 0;
        var dsKpi = [
          {
            nhan: 'Tổng chi phí', so: Apex.money(cp.tongChiPhi), icon: 'fa-coins', mau: 'bt-do', phu: ''
          },
          {
            nhan: 'Vốn mua vật tư', so: Apex.money(cp.tienMuaVatTu), icon: 'fa-boxes-stacked', mau: 'bt-toi',
            phu: '<div class="thay-doi" style="color:var(--chu-mo);">Máy in ' + Apex.money(cp.tienMayIn) + '</div>'
          },
          {
            nhan: 'Nhựa đã dùng', so: Apex.money(cp.tienNhuaDaDung), icon: 'fa-fill-drip', mau: 'bt-vang',
            phu: '<div class="thay-doi" style="color:var(--chu-mo);">' + Apex.number(cp.tongGramDaDung) + 'g / ' + Apex.number(cp.tongGramMua) + 'g</div>'
          },
          {
            nhan: 'Doanh thu đơn hàng', so: Apex.money(von.doanhThu), icon: 'fa-wallet', mau: 'bt-xanh',
            phu: '<div class="thay-doi ' + (laiLo >= 0 ? 'tang' : 'giam') + '">Lãi/Lỗ: ' + Apex.money(laiLo) + '</div>'
          }
        ];
        Apex.fill('#kpi-von', dsKpi.map(function (k) {
          return '<div class="kpi"><div class="dong-dau"><span class="nhan">' + k.nhan + '</span>' +
            '<span class="bieu-tuong ' + k.mau + '"><i class="fa-solid ' + k.icon + '"></i></span></div>' +
            '<div class="so">' + k.so + '</div>' + k.phu + '</div>';
        }).join(''));
      }

      /* ---------- PHẦN 2: Chia tiền ----------
         Máy tính nhỏ để tính nhanh khi gộp/tách một khoản: nhập tiền vốn,
         số chia và tiền lãi rồi xem cả TỔNG (nhân số chia) lẫn MỖI PHẦN
         (chia số chia) — hai chiều hay dùng nhất khi chia tiền một lô in.
         Số vừa nhập được nhớ lại để mở trang sau vẫn còn. */

      /* Hai ô độc lập: chia VỐN và chia LÃI. Mỗi ô nhập tổng tiền + số chia, hiện mỗi phần
         bao nhiêu (và phần dư nếu chia không hết). Số đã gõ nhớ lại trong trình duyệt này. */
      var KHOA_CHIA = 'in3d_chia_tien';
      var O_CHIA = {
        von: { tong: 'ct-von', chia: 'ct-von-chia', kq: '#kq-chia-von', nhan: 'vốn' },
        lai: { tong: 'ct-lai', chia: 'ct-lai-chia', kq: '#kq-chia-lai', nhan: 'lãi' }
      };

      function soNhap(o) {
        var v = parseFloat(o.value);
        return isNaN(v) || v < 0 ? 0 : v;
      }

      function oTongNho(nhan, so, congThuc, chinh) {
        return '<div class="o-tong' + (chinh ? ' chinh' : '') + '">' +
          '<div class="nhan-tong">' + nhan + '</div>' +
          '<div class="so-tong">' + so + '</div>' +
          '<div class="cong-thuc">' + congThuc + '</div></div>';
      }

      function veMotO(loai) {
        var c = O_CHIA[loai];
        var oTong = document.getElementById(c.tong);
        var oChia = document.getElementById(c.chia);
        if (!oTong || !oChia) return;
        var tong = soNhap(oTong);
        var soChia = parseFloat(oChia.value);
        var coChia = !isNaN(soChia) && soChia > 0;
        var moiPhan = coChia ? Math.floor(tong / soChia) : 0;
        var du = coChia ? tong - moiPhan * soChia : 0;

        Apex.fill(c.kq, '<div class="the-tong">' +
          oTongNho('Tổng ' + c.nhan, Apex.money(Math.round(tong)),
            coChia ? 'chia cho ' + Apex.number(soChia) + ' phần' : 'chưa nhập số chia') +
          oTongNho('Mỗi phần', coChia ? Apex.money(moiPhan) : '—',
            coChia ? Apex.number(tong) + ' ÷ ' + Apex.number(soChia) : '—', true) +
          (coChia && du > 0
            ? oTongNho('Còn dư', Apex.money(Math.round(du)),
                Apex.number(tong) + ' − ' + Apex.number(moiPhan) + ' × ' + Apex.number(soChia))
            : '') +
          '</div>');
      }

      function veChiaTien() {
        veMotO('von');
        veMotO('lai');
        try {
          localStorage.setItem(KHOA_CHIA, JSON.stringify({
            von: document.getElementById('ct-von').value,
            vonChia: document.getElementById('ct-von-chia').value,
            lai: document.getElementById('ct-lai').value,
            laiChia: document.getElementById('ct-lai-chia').value
          }));
        } catch (e) { /* trình duyệt chặn localStorage thì thôi, không chặn tính toán */ }
      }

      window.xoaChia = function (loai) {
        var c = O_CHIA[loai];
        document.getElementById(c.tong).value = '';
        document.getElementById(c.chia).value = '';
        veChiaTien();
        document.getElementById(c.tong).focus();
      };

      (function napChiaTien() {
        var cu = null;
        try { cu = JSON.parse(localStorage.getItem(KHOA_CHIA)); } catch (e) { cu = null; }
        if (cu && typeof cu === 'object') {
          document.getElementById('ct-von').value = cu.von || '';
          document.getElementById('ct-von-chia').value = cu.vonChia || cu.soChia || '';
          document.getElementById('ct-lai').value = cu.lai || '';
          document.getElementById('ct-lai-chia').value = cu.laiChia || cu.soChia || '';
        }
        ['ct-von', 'ct-von-chia', 'ct-lai', 'ct-lai-chia'].forEach(function (id) {
          document.getElementById(id).addEventListener('input', veChiaTien);
        });
        veChiaTien();
      })();

      /* ---------- PHẦN 3 + 4: Chi tiết chi phí, nhựa đã dùng theo cuộn ---------- */
      function veChiPhi() {
        var von = Apex.tk('von') || {};
        var cp = von.chiPhi || {};
        Apex.fill('#bang-chi-phi',
          '<tr><td>Tiền mua máy in</td><td class="phai">' + Apex.money(cp.tienMayIn) + '</td></tr>' +
          '<tr><td>Tiền mua nhựa (toàn bộ cuộn)</td><td class="phai">' + Apex.money(cp.tienNhuaTong) + '</td></tr>' +
          // Mọi vật tư còn lại trong kho: dụng cụ, móc khoá, lõi, keo... (backend cũ chưa trả thì ẩn dòng)
          (cp.tienDungCu == null ? ''
            : '<tr><td>Tiền mua dụng cụ, phụ kiện</td><td class="phai">' + Apex.money(cp.tienDungCu) + '</td></tr>') +
          '<tr><td style="color:var(--vang);font-weight:700;">→ Trong đó nhựa ĐÃ DÙNG (tính vào giá thành)</td>' +
          '<td class="phai" style="color:var(--vang);font-weight:700;">' + Apex.money(cp.tienNhuaDaDung) + '</td></tr>' +
          '<tr class="dong-tong"><td>TỔNG CHI PHÍ</td><td class="phai">' + Apex.money(cp.tongChiPhi) + '</td></tr>');

        /* Nhựa đã dùng theo cuộn: backend lọc sẵn các cuộn nhựa, đúng thứ tự kho */
        Apex.fill('#bang-nhua', (von.cuonNhua || []).map(function (v) {
          return '<tr class="hang-bam" onclick="moFormGram(' + v.id + ')">' +
            // Ảnh thật của cuộn nhựa trong kho; chưa có ảnh thì chữ cái đầu như trước
            '<td><div class="o-ten"><img class="anh-sp" src="' +
            (Apex.anhDayDu(v.hinhAnh) || Apex.anhSanPham(v.ten)) + '" alt="" ' +
            'onerror="this.src=\'' + Apex.anhSanPham(v.ten) + '\'" />' +
            '<div><div class="chinh">' + Apex.esc(v.ten) + '</div>' +
            (v.mau ? '<div class="phu">' + Apex.nhanMau(v, 14) + '</div>' : '') +
            '</div></div></td>' +
            '<td class="phai">' + Apex.money(Math.round(v.donGiaMoiGram || 0)) + '/g</td>' +
            '<td class="giua"><strong>' + Apex.number(v.daDungGram || 0) + 'g</strong></td>' +
            '<td class="giua">' + Apex.number(v.conLaiGram || 0) + 'g</td>' +
            '<td class="phai">' + Apex.money(v.tienDaDung || 0) + '</td>' +
            '</tr>';
        }).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--chu-mo);padding:28px;">Chưa có cuộn nhựa nào trong kho.</td></tr>');
      }

      /** Một cuộn nhựa trong khoá 'von' theo id (có tongGram, daDungGram, donGiaMoiGram...). */
      function timCuon(id) {
        return ((Apex.tk('von') || {}).cuonNhua || []).filter(function (x) { return x.id === id; })[0] || null;
      }

      /* ---------- Chi phí chạy máy ----------
         Tiền máy mỗi giờ in = khấu hao máy + điện + bảo trì, backend tính sẵn (khoá 'chi-phi-may')
         từ máy in trong kho và bốn định mức đầu ở bảng cai_dat; trang Sản phẩm nhân số này với giờ in
         của từng biến thể ra tiền máy / giá vốn một cái. Sửa định mức -> PUT /quan-tri/chi-phi-may.
         Ô để trống (hoặc gõ đúng số mặc định) = xoá định mức riêng, quay về số mặc định.
         Định mức thứ năm (nhựa in được mỗi giờ) không đổi tiền mỗi giờ: backend dùng nó chia tiền
         máy ra mỗi gram cho giá bán đề xuất khi chưa đủ sản phẩm có giờ in để tự tính trung bình. */
      var O_CHI_PHI = [
        { khoa: 'tuoiThoGio', id: 'cp-tuoi-tho', nhan: 'Tuổi thọ máy (giờ in)', ten: 'Tuổi thọ máy', buoc: 'any' },
        { khoa: 'congSuatW', id: 'cp-cong-suat', nhan: 'Công suất trung bình (W)', ten: 'Công suất máy', buoc: 'any' },
        // Tiền: backend làm tròn tới đồng lúc lưu, trang làm tròn y vậy
        { khoa: 'giaDienKwh', id: 'cp-gia-dien', nhan: 'Giá điện (₫/kWh)', ten: 'Giá điện', buoc: '1', tien: true },
        { khoa: 'baoTriMoiGio', id: 'cp-bao-tri', nhan: 'Bảo trì (₫/giờ in)', ten: 'Chi phí bảo trì', buoc: '1', tien: true },
        { khoa: 'gramMoiGio', id: 'cp-gram-gio', nhan: 'Nhựa in được mỗi giờ (g)', ten: 'Nhựa in được mỗi giờ', buoc: 'any' }
      ];

      /** Một ô số của thẻ bên phải — cùng kiểu ô tổng của phần Chia tiền. */
      function oTong(nhan, so, congThuc, chinh) {
        return '<div class="o-tong' + (chinh ? ' chinh' : '') + '">' +
          '<div class="nhan-tong">' + nhan + '</div>' +
          '<div class="so-tong">' + so + '</div>' +
          (congThuc ? '<div class="cong-thuc">' + congThuc + '</div>' : '') + '</div>';
      }

      /** Định mức đang được sửa khác số mặc định (backend: khác macDinh = định mức riêng). */
      function laDinhMucRieng(cp, khoa) {
        var md = cp.macDinh || {};
        return md[khoa] != null && cp[khoa] !== md[khoa];
      }

      /** Bốn ô tiền mỗi giờ: khấu hao, điện, bảo trì, tổng (tổng = cộng ba dòng đã làm tròn). */
      function veSoChiPhiMay(s) {
        Apex.fill('#so-chi-phi-may',
          oTong('Khấu hao máy / giờ', Apex.money(s.khauHaoMoiGio),
            s.soMayIn
              ? Apex.money(s.giaMayTrungBinh) + ' ÷ ' + Apex.number(s.tuoiThoGio) + ' giờ' +
                (s.soMayIn > 1 ? ' · trung bình ' + Apex.number(s.soMayIn) + ' máy' : '')
              : 'Chưa có máy in trong kho') +
          oTong('Điện / giờ', Apex.money(s.dienMoiGio),
            Apex.number(s.congSuatW) + ' W × ' + Apex.money(s.giaDienKwh) + '/kWh') +
          oTong('Bảo trì / giờ', Apex.money(s.baoTriMoiGio), '') +
          oTong('Tổng / giờ in', Apex.money(s.tongMoiGio),
            Apex.number(s.khauHaoMoiGio) + ' + ' + Apex.number(s.dienMoiGio) + ' + ' + Apex.number(s.baoTriMoiGio), true));
      }

      function veChiPhiMay() {
        var khu = document.getElementById('khu-chi-phi-may');
        var cp = Apex.tk('chi-phi-may');
        // Backend cũ chưa có khoá này thì không vẽ thẻ (khỏi hiện số 0 như thật)
        if (!cp || typeof cp.tongMoiGio !== 'number') { khu.innerHTML = ''; return; }
        var md = cp.macDinh || {};
        var coRieng = O_CHI_PHI.some(function (o) { return laDinhMucRieng(cp, o.khoa); });
        // Nhựa in được mỗi giờ: chủ shop gõ số vào ô thì backend nghe theo số đó; để trống (hoặc
        // bấm "Về mặc định") thì quay lại tự tính trung bình từ giờ in của sản phẩm
        var von = Apex.tk('von') || {};
        var gramTuDuLieu = von.nguonGramMoiGio === 'du-lieu';

        khu.innerHTML =
          '<div class="the">' +
          '<div class="the-dau"><div><h3>Chi phí chạy máy</h3></div></div>' +
          '<div class="the-than">' +
          '<div class="luoi-2-deu">' +
          '<div>' +
          // Backend cũ chưa có định mức nào (không có số mặc định) thì không vẽ ô đó
          '<div class="luoi-nhap-2">' + O_CHI_PHI.filter(function (o) { return md[o.khoa] != null; }).map(function (o) {
            // Ô "nhựa in được mỗi giờ" đang để backend tự tính: hiện đúng số đang dùng, sửa được
            var tuTinh = o.khoa === 'gramMoiGio' && gramTuDuLieu;
            var giaTri = tuTinh ? von.gramMoiGio : cp[o.khoa];
            return '<div class="o-nhap"><label for="' + o.id + '">' + o.nhan + '</label>' +
              '<input type="number" id="' + o.id + '" min="0" step="' + o.buoc + '" value="' +
              Apex.esc(giaTri == null ? '' : giaTri) + '" data-goc="' +
              Apex.esc(giaTri == null ? '' : giaTri) + '"' +
              (tuTinh ? ' title="' + Apex.esc('Đang tự tính: trung bình ' +
                      Apex.number(von.soBienTheCoGioIn) + ' biến thể có giờ in. Gõ số khác để dùng số của bạn.') + '"' : '') +
              ' oninput="xemTruocChiPhiMay()" />' +
              (tuTinh ? '<div class="goi-y">Tự tính từ ' + Apex.number(von.soBienTheCoGioIn) +
                       ' biến thể có giờ in — gõ số khác để dùng số của bạn.</div>' : '') +
              '</div>';
          }).join('') + '</div>' +
          '<div class="bao-loi" id="loi-chi-phi-may"></div>' +
          '<div class="hang-nut-cp">' +
          (coRieng
            ? '<button class="nut nut-vien" type="button" onclick="veMacDinhChiPhiMay(this)">' +
              '<i class="fa-solid fa-rotate-left"></i> Về mặc định</button>'
            : '') +
          '<button class="nut nut-chinh" type="button" onclick="luuChiPhiMay(this)">' +
          '<i class="fa-solid fa-floppy-disk"></i> Lưu</button>' +
          '</div>' +
          '</div>' +
          '<div class="the-tong" id="so-chi-phi-may"></div>' +
          '</div>' +
          '</div></div>';
        veSoChiPhiMay(cp);
      }

      /**
       * Số đang gõ trong một ô định mức: '' = để trống (theo mặc định), NaN = không hợp lệ.
       * Tiền làm tròn tới đồng như backend.
       */
      function docDinhMuc(o) {
        var e = document.getElementById(o.id);
        if (!e) return '';
        if (e.validity && e.validity.badInput) return NaN;
        var chu = e.value.trim();
        if (chu === '') return '';
        var so = Number(chu);
        if (o.tien) so = Math.round(so);
        return so > 0 && so <= 1e9 ? so : NaN;
      }

      /**
       * Gõ tới đâu tính thử tới đó, cùng công thức ChiPhiMayService.tinh (giá máy trung bình lấy
       * số đã làm tròn backend gửi — nhiều máy khác giá thì có thể lệch 1₫; lưu xong là số backend).
       * Ô đang gõ dở / sai thì giữ số đang dùng cho dòng đó.
       */
      window.xemTruocChiPhiMay = function () {
        var cp = Apex.tk('chi-phi-may');
        if (!cp) return;
        var md = cp.macDinh || {};
        var dm = {};
        O_CHI_PHI.forEach(function (o) {
          var so = docDinhMuc(o);
          dm[o.khoa] = so === '' ? md[o.khoa] : (isNaN(so) ? cp[o.khoa] : so);
        });
        var khauHao = cp.soMayIn ? Math.round(cp.giaMayTrungBinh / dm.tuoiThoGio) : 0;
        var dien = Math.round(dm.congSuatW / 1000 * dm.giaDienKwh);
        var baoTri = Math.round(dm.baoTriMoiGio);
        veSoChiPhiMay({
          soMayIn: cp.soMayIn, giaMayTrungBinh: cp.giaMayTrungBinh,
          tuoiThoGio: dm.tuoiThoGio, congSuatW: dm.congSuatW, giaDienKwh: dm.giaDienKwh,
          khauHaoMoiGio: khauHao, dienMoiGio: dien, baoTriMoiGio: baoTri, tongMoiGio: khauHao + dien + baoTri
        });
      };

      /** Gửi PUT rồi nạp lại trang (backend đã tính lại số mỗi giờ; tiền máy sản phẩm tính lúc đọc). */
      function guiChiPhiMay(nut, body) {
        var loi = document.getElementById('loi-chi-phi-may');
        Apex.dangLuu(nut, function () {
          return Apex.ghi('PUT', '/quan-tri/chi-phi-may', body).then(function (kq) {
            return Apex.capNhatXong('Đã lưu chi phí chạy máy').then(function () { return kq; });
          });
        }, loi);
      }

      /**
       * Chỉ gửi định mức có đổi. Để trống hoặc gõ đúng số mặc định -> null (xoá định mức riêng);
       * số khác -> số đó. Câu lỗi cùng chữ với backend.
       */
      window.luuChiPhiMay = function (nut) {
        var cp = Apex.tk('chi-phi-may') || {};
        var md = cp.macDinh || {};
        var loi = document.getElementById('loi-chi-phi-may');
        var body = {}, coDoi = false;
        for (var i = 0; i < O_CHI_PHI.length; i++) {
          var o = O_CHI_PHI[i];
          var oNhap = document.getElementById(o.id);
          // Không đụng vào ô chủ shop không sửa: ô "nhựa in được mỗi giờ" đang hiện số TỰ TÍNH,
          // gửi lên là biến nó thành định mức cố định dù chủ shop chỉ sửa ô khác
          if (oNhap && oNhap.value === oNhap.getAttribute('data-goc')) continue;
          var so = docDinhMuc(o);
          if (typeof so === 'number' && isNaN(so)) {
            loi.textContent = o.ten + ' phải là số dương.';
            document.getElementById(o.id).focus();
            return;
          }
          var gui = (so === '' || so === md[o.khoa]) ? null : so;
          var doi = gui === null ? laDinhMucRieng(cp, o.khoa) : gui !== cp[o.khoa];
          if (doi) { body[o.khoa] = gui; coDoi = true; }
        }
        loi.textContent = '';
        if (!coDoi) { Apex.baoNhanh('Không có gì thay đổi'); return; }
        guiChiPhiMay(nut, body);
      };

      /** Xoá mọi định mức riêng, quay về các số mặc định. */
      window.veMacDinhChiPhiMay = function (nut) {
        var cp = Apex.tk('chi-phi-may') || {};
        var body = {};
        O_CHI_PHI.forEach(function (o) { if (laDinhMucRieng(cp, o.khoa)) body[o.khoa] = null; });
        if (!Object.keys(body).length) return;
        if (!confirm('Đưa các định mức đã sửa về số mặc định?')) return;
        guiChiPhiMay(nut, body);
      };

      /* ---------- PHẦN 5 + 6: Giá bán theo gram ---------- */
      /* Giá bán đề xuất theo gram = (giá vốn nhựa + tiền máy mỗi gram) × (1 + tỉ lệ lãi) — backend
         tính sẵn trong khoá 'von'. Tiền máy mỗi gram = tiền máy mỗi giờ ÷ nhựa in được mỗi giờ
         (tự tính trung bình từ giờ in của sản phẩm, chưa đủ thì theo định mức ở thẻ Chi phí chạy máy).
         Bảng giá dự kiến từng sản phẩm: backend tự lấy các sản phẩm ĐANG BÁN và tính sẵn trong
         chính khoá 'von' (trường giaSanPham) — tiền nhựa + tiền máy theo giờ in của sản phẩm
         (chưa khai giờ thì ước theo gram), giá bán làm tròn 500đ. */

      /** 90 -> "1 giờ 30 phút", 45 -> "45 phút", 120 -> "2 giờ" (cùng cách viết trang Sản phẩm). */
      function chuThoiGian(phut) {
        phut = Math.max(0, Math.round(phut || 0));
        var g = Math.floor(phut / 60), p = phut % 60;
        if (!g) return Apex.number(p) + ' phút';
        return Apex.number(g) + ' giờ' + (p ? ' ' + p + ' phút' : '');
      }

      /**
       * Bảng giá dự kiến — backend tự lấy MỌI SẢN PHẨM ĐANG BÁN (khoá 'von', trường giaSanPham)
       * rồi tính tiền nhựa + tiền máy + giá bán đề xuất, nên trang không gõ tay mẫu nữa.
       * Thời gian in có dấu "~" là backend ước theo số gram (sản phẩm chưa khai giờ in).
       * Giá đang bán thấp hơn giá đề xuất thì tô đỏ để chủ shop thấy ngay.
       */
      function veBangGiaSanPham(ds) {
        var o = document.getElementById('bang-mau-in');
        if (!o) return;
        ds = ds || [];
        o.innerHTML = ds.map(function (m) {
          var thap = m.giaDangBan > 0 && m.giaDangBan < m.giaBan;
          return '<tr class="hang-bam" onclick="window.location.href=\'san-pham.html\'">' +
            '<td><div class="o-ten"><img class="anh-sp" src="' +
              (Apex.anhDayDu(m.hinhAnh) || Apex.anhSanPham(m.ten)) + '" alt="" />' +
              '<div><div class="chinh">' + Apex.esc(m.ten) + '</div>' +
              (m.maSanPham ? '<div class="phu">Mã: ' + Apex.esc(m.maSanPham) + '</div>' : '') +
              '</div></div></td>' +
            '<td class="giua">' + Apex.number(m.gram || 0) + 'g</td>' +
            '<td class="giua"' + (m.phutUocTinh ? ' style="color:var(--chu-mo);"' : '') + '>' +
              (m.phutUocTinh ? '~' : '') + chuThoiGian(m.phut) + '</td>' +
            '<td class="phai">' + Apex.money(m.tienNhua) + '</td>' +
            '<td class="phai">' + Apex.money(m.tienMay) + '</td>' +
            '<td class="phai" style="font-weight:700;color:var(--accent-dam);">' + Apex.money(m.giaBan) + '</td>' +
            '<td class="phai"' + (thap ? ' style="color:var(--do);font-weight:600;"' : '') + '>' +
              (m.giaDangBan > 0 ? Apex.money(m.giaDangBan) : '—') + '</td>' +
            '<td class="phai" style="color:var(--accent-dam);">' + Apex.money(m.lai) + '</td>' +
            '</tr>';
        }).join('') || '<tr><td colspan="8" style="text-align:center;color:var(--chu-mo);padding:28px;">' +
          'Chưa có sản phẩm nào đang bán (và đã khai số gram nhựa).</td></tr>';
      }

      /** Dòng cơ sở của tiền máy mỗi gram: "4.630 ₫/giờ ÷ 25 g/giờ" (+ nguồn nếu tự tính từ sản phẩm). */
      function coSoTienMay(von) {
        var chu = Apex.money(von.chiPhiMayMoiGio) + '/giờ ÷ ' + Apex.number(von.gramMoiGio) + ' g/giờ';
        if (von.nguonGramMoiGio === 'du-lieu') {
          chu += ' · trung bình ' + Apex.number(von.soBienTheCoGioIn) + ' biến thể';
        }
        return chu;
      }

      window.veLai = function () {
        var von = Apex.tk('von') || {};
        var tiLe = von.tiLeLai != null ? von.tiLeLai : TI_LE_LAI;
        var giaVon = von.giaVonMoiGram || 0;
        var giaBan = von.giaBanMoiGram || 0;
        // Backend cũ chưa tính tiền máy theo gram thì chỉ hiện phần nhựa như trước
        var coMay = typeof von.tienMayMoiGram === 'number';
        var tienMay = coMay ? von.tienMayMoiGram : 0;
        var giaVonTong = coMay ? von.giaVonTongMoiGram : giaVon;
        var dg = function (n) { return Apex.number(n || 0) + ' đ/gram'; };

        var html =
          '<div class="the">' +
            '<div class="the-dau"><div><h3>Giá bán đề xuất theo gram</h3></div></div>' +
            '<div class="the-than"><div class="luoi-2-deu">' +
              '<div>' +
                '<div class="hang-ap-dung">' +
                  '<div class="o-nhap"><label for="ti-le-lai">Tỉ lệ lãi mong muốn (%)</label>' +
                  '<input type="number" id="ti-le-lai" min="0" step="5" value="' + Apex.esc(tiLe) + '" /></div>' +
                  '<button class="nut nut-chinh" onclick="apDungTiLe(this)">Áp dụng</button>' +
                '</div>' +
                '<div class="the-tong gia-gram">' +
                  oTong('Giá vốn nhựa', dg(giaVon), '') +
                  (coMay
                    ? oTong('Tiền máy', dg(tienMay), coSoTienMay(von)) +
                      oTong('Giá vốn tổng', dg(giaVonTong), Apex.number(giaVon) + ' + ' + Apex.number(tienMay))
                    : '') +
                  oTong('Giá bán đề xuất', dg(giaBan),
                    Apex.number(giaVonTong) + ' × ' + Apex.number(100 + Number(tiLe)) + '%', true) +
                '</div>' +
              '</div>' +
              '<div><div class="khung-bieu-do" id="bd-gia"></div></div>' +
            '</div></div>' +
          '</div>';

        Apex.fill('#khu-gia', html);

        // Bảng giá từng sản phẩm để riêng ở dưới (rộng cả trang), thẻ giá theo gram nằm cột trái
        Apex.fill('#khu-gia-bang',
          '<div class="the" style="margin-top:20px;">' +
            '<div class="the-dau"><div><h3>Giá dự kiến từng sản phẩm đang bán</h3></div></div>' +
            '<div class="the-than khong-dem bang-cuon">' +
              '<table class="bang"><thead><tr>' +
                '<th>Sản phẩm</th><th class="giua">Khối lượng</th><th class="giua">Thời gian in</th>' +
                '<th class="phai">Tiền nhựa</th><th class="phai">Tiền máy</th>' +
                '<th class="phai">Giá bán đề xuất</th><th class="phai">Giá đang bán</th>' +
                '<th class="phai">Lãi dự kiến</th>' +
              '</tr></thead><tbody id="bang-mau-in"></tbody></table>' +
            '</div>' +
          '</div>');

        if (coMay) {
          Apex.bieuDoCot('bd-gia', ['Nhựa', 'Máy', 'Giá vốn', 'Giá bán'],
            [giaVon, tienMay, giaVonTong, giaBan], 'Đồng / gram');
        } else {
          Apex.bieuDoCot('bd-gia', ['Giá vốn/gram', 'Giá bán/gram'], [giaVon, giaBan], 'Đồng / gram');
        }
        veBangGiaSanPham(von.giaSanPham);
      };

      window.apDungTiLe = function (nut) {
        var o = document.getElementById('ti-le-lai');
        var v = parseFloat(o.value);
        if (isNaN(v) || v < 0) { Apex.baoLoi('Tỉ lệ lãi không hợp lệ.'); o.focus(); return; }
        TI_LE_LAI = v;
        try { localStorage.setItem(KHOA_TI_LE, String(v)); } catch (e) { /* bị chặn thì chỉ áp dụng lần xem này */ }
        // Nạp lại khoá 'von' với tỉ lệ mới: backend tính lại giá bán/gram, xong Apex gọi vẽ lại.
        // Dùng taiLaiHoacLoi (bản reject) để nạp trượt thì nút báo lỗi, không lặng lẽ giữ giá cũ.
        Apex.dangLuu(nut, Apex.taiLaiHoacLoi(), null, 'Đang tính…');
      };

      /* ---------- Hộp thoại: nhập số gram đã dùng ---------- */

      window.moFormGram = function (id) {
        // Cuộn lấy ngay trong khoá 'von' (đã có tongGram = khối lượng × số lượng) nên
        // trang không cần tải cả danh sách vật tư về nữa
        var v = timCuon(id);
        if (!v) return;
        var tong = v.tongGram || 0;

        Apex.moHopThoai(
          '<div class="ht-dau"><div><h3>' + Apex.esc(v.ten) + '</h3>' +
          '<div class="phu">' + (v.mau ? Apex.oMau(v.maMau, v.mau) + Apex.esc(v.mau) + ' \u00b7 ' : '') +
          'cu\u1ed9n ' + Apex.number(tong) + 'g</div></div>' +
          '<button class="nut-dong" type="button" onclick="Apex.dongHopThoai()"><i class="fa-solid fa-xmark"></i></button></div>' +

          '<div class="ht-than">' +
          '<div class="o-nhap"><label for="f-gram">T\u1ed5ng s\u1ed1 gram \u0111\u00e3 d\u00f9ng</label>' +
          '<input type="number" id="f-gram" min="0" max="' + tong + '" step="1" value="' + (v.daDungGram || 0) + '" />' +
          '<div class="goi-y">\u0110ang d\u00f9ng ' + Apex.number(v.daDungGram || 0) + 'g / ' + Apex.number(tong) + 'g' +
          ' \u00b7 \u0111\u01a1n gi\u00e1 ' + Apex.money(Math.round(v.donGiaMoiGram || 0)) + '/g</div></div>' +
          '<div class="o-nhap"><label for="f-them">Ho\u1eb7c c\u1ed9ng th\u00eam v\u1eeba in xong (gram)</label>' +
          '<input type="number" id="f-them" min="0" step="1" /></div>' +
          '<div class="bao-loi" id="loi-gram"></div>' +
          '</div>' +

          '<div class="ht-chan"><div class="day-phai">' +
          '<button class="nut nut-vien" type="button" onclick="Apex.dongHopThoai()">Hu\u1ef7</button>' +
          '<button class="nut nut-chinh" type="button" onclick="luuGram(' + id + ',' + tong + ', this)">' +
          '<i class="fa-solid fa-floppy-disk"></i> L\u01b0u</button>' +
          '</div></div>'
        );
      };

      /* Ghi số gram đã dùng. Apex.dangLuu khoá nút và hiện "Đang lưu…" trong lúc chờ; backend từ chối
         thì câu báo của backend hiện ngay ở ô .bao-loi, hộp thoại vẫn mở để sửa lại.
         Lưu xong Apex tự đóng hộp thoại, nạp lại khoá 'von' rồi vẽ lại cả trang. */
      window.luuGram = function (id, tong, nut) {
        var loi = document.getElementById('loi-gram');
        var them = parseInt(document.getElementById('f-them').value, 10);
        var gram = parseInt(document.getElementById('f-gram').value, 10);

        if (!isNaN(them) && them > 0) gram = (isNaN(gram) ? 0 : gram) + them;
        if (isNaN(gram) || gram < 0) { loi.textContent = 'S\u1ed1 gram kh\u00f4ng h\u1ee3p l\u1ec7.'; return; }
        if (gram > tong) { loi.textContent = 'Kh\u00f4ng th\u1ec3 d\u00f9ng qu\u00e1 ' + tong + 'g c\u1ee7a cu\u1ed9n n\u00e0y.'; return; }

        Apex.dangLuu(nut, Apex.suaVatTu(id, { daDungGram: gram }, 'Đã ghi nhận số gram'), loi);
      };

      window.veLaiTrang = function () { veKpi(); veChiPhi(); veChiPhiMay(); veLai(); };

      /* Một request cho cả trang (vốn + chi phí chạy máy). Tỉ lệ lãi gửi kèm mỗi lần nạp (đọc lại
         ở thời điểm gửi) để backend tính luôn giá bán/gram; Apex gọi veLaiTrang khi dữ liệu về và
         sau mỗi lần ghi. */
      Apex.trang({
        bo: ['von', 'chi-phi-may'],
        thamSo: function () { return { tiLeLai: TI_LE_LAI }; },
        ve: veLaiTrang
      });
    })();
