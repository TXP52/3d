<!DOCTYPE html>
<html lang="vi" dir="ltr">

  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Quản lý vốn - IN3D Store">

    <title>Quản lý vốn | IN3D Store</title>

    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicons/favicon-16x16.png">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicons/favicon.ico">
    <meta name="theme-color" content="#ffffff">
    <script src="assets/js/config.js"></script>
    <script src="vendors/overlayscrollbars/OverlayScrollbars.min.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,500,600,700%7cPoppins:300,400,500,600,700,800,900&amp;display=swap" rel="stylesheet">
    <link href="vendors/overlayscrollbars/OverlayScrollbars.min.css" rel="stylesheet">
    <link href="assets/css/theme-rtl.min.css" rel="stylesheet" id="style-rtl">
    <link href="assets/css/theme.min.css" rel="stylesheet" id="style-default">
    <link href="assets/css/user-rtl.min.css" rel="stylesheet" id="user-style-rtl">
    <link href="assets/css/user.min.css" rel="stylesheet" id="user-style-default">
    <link href="assets/css/app3d.css" rel="stylesheet">
    <script>
      var isRTL = JSON.parse(localStorage.getItem('isRTL'));
      if (isRTL) {
        document.getElementById('style-default').setAttribute('disabled', true);
        document.getElementById('user-style-default').setAttribute('disabled', true);
        document.querySelector('html').setAttribute('dir', 'rtl');
      } else {
        document.getElementById('style-rtl').setAttribute('disabled', true);
        document.getElementById('user-style-rtl').setAttribute('disabled', true);
      }
    </script>
    <script src="assets/js/app3d.js"></script>
  </head>

  <body>
    <main class="main" id="top">
      <div class="container" data-layout="container">
        <script>
          var isFluid = JSON.parse(localStorage.getItem('isFluid'));
          if (isFluid) {
            var container = document.querySelector('[data-layout]');
            container.classList.remove('container');
            container.classList.add('container-fluid');
          }
        </script>

        <script>App3D.sidebar('quan-ly-von');</script>

        <div class="content">
          <script>App3D.topbar();</script>

          <script>
            App3D.pageHeader(
              'Quản lý vốn',
              'Theo dõi vốn nhập hàng, giá trị tồn kho và lợi nhuận kỳ vọng theo từng sản phẩm. Giá vốn tạm tính 70% giá bán khi chưa nhập giá vốn thật.',
              ''
            );
          </script>

          <!-- Thẻ tổng quan vốn -->
          <div class="row g-3 mb-3" id="von-stats"></div>
          <script>
            (function () {
              var sp = App3D.products;
              var vonTon = sp.reduce(function (s, p) { return s + (p.cost || 0) * (p.stock || 0); }, 0);
              var giaTriBan = sp.reduce(function (s, p) { return s + (p.price || 0) * (p.stock || 0); }, 0);
              var loiNhuanKyVong = giaTriBan - vonTon;
              var doanhThuDaBan = App3D.orders.reduce(function (s, o) { return s + (o.total || 0); }, 0);

              var cards = [
                { label: 'Vốn đang nằm trong kho', value: App3D.money(vonTon), color: 'primary', icon: 'fas fa-coins' },
                { label: 'Giá trị bán lẻ tồn kho', value: App3D.money(giaTriBan), color: 'warning', icon: 'fas fa-tags' },
                { label: 'Lợi nhuận kỳ vọng', value: App3D.money(loiNhuanKyVong), color: 'success', icon: 'fas fa-chart-line' },
                { label: 'Doanh thu đơn đã nhận', value: App3D.money(doanhThuDaBan), color: 'primary', icon: 'fas fa-wallet' }
              ];
              App3D.fill('#von-stats', cards.map(function (c) {
                return '<div class="col-6 col-xxl-3"><div class="card h-100"><div class="card-body">' +
                  '<div class="d-flex justify-content-between align-items-center">' +
                  '<div><h6 class="text-600 mb-2">' + c.label + '</h6>' +
                  '<h5 class="fw-normal text-700 mb-0">' + c.value + '</h5></div>' +
                  '<div class="app3d-kpi-icon bg-soft-' + c.color + ' text-' + c.color + '"><span class="' + c.icon + '"></span></div>' +
                  '</div></div></div></div>';
              }).join(''));
            })();
          </script>

          <!-- Bảng vốn theo sản phẩm -->
          <div class="card mb-3">
            <div class="card-header">
              <h6 class="mb-0">Vốn theo từng sản phẩm</h6>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive scrollbar">
                <table class="table table-sm table-striped fs--1 mb-0 app3d-table">
                  <thead class="bg-200 text-900">
                    <tr>
                      <th>Sản phẩm</th>
                      <th class="text-end">Giá vốn</th>
                      <th class="text-end">Giá bán</th>
                      <th class="text-center">Tồn</th>
                      <th class="text-end">Vốn tồn kho</th>
                      <th class="text-end">Giá trị bán</th>
                      <th class="text-center">Biên LN</th>
                    </tr>
                  </thead>
                  <tbody id="bang-von"></tbody>
                </table>
              </div>
            </div>
          </div>
          <script>
            App3D.fill('#bang-von', App3D.products.map(function (p) {
              var vonTon = (p.cost || 0) * (p.stock || 0);
              var banTon = (p.price || 0) * (p.stock || 0);
              var bien = p.price > 0 ? Math.round(((p.price - p.cost) / p.price) * 100) : 0;
              return '<tr>' +
                '<td class="align-middle"><div class="d-flex align-items-center"><img class="anh-sp-nho me-2" src="' + (p.img || App3D.anhSanPham(p.name)) + '" alt="" /><h6 class="mb-0 fs--1">' + App3D.escapeHtml(p.name) + '</h6></div></td>' +
                '<td class="align-middle text-end">' + App3D.money(p.cost) + '</td>' +
                '<td class="align-middle text-end">' + App3D.money(p.price) + '</td>' +
                '<td class="align-middle text-center">' + App3D.number(p.stock) + '</td>' +
                '<td class="align-middle text-end fw-semi-bold">' + App3D.money(vonTon) + '</td>' +
                '<td class="align-middle text-end">' + App3D.money(banTon) + '</td>' +
                '<td class="align-middle text-center"><span class="badge badge-soft-' + (bien >= 25 ? 'success' : bien >= 10 ? 'warning' : 'danger') + '">' + bien + '%</span></td>' +
                '</tr>';
            }).join(''));
          </script>

          <script>App3D.footer();</script>
        </div>
      </div>
    </main>

    <script src="vendors/popper/popper.min.js"></script>
    <script src="vendors/bootstrap/bootstrap.min.js"></script>
    <script src="vendors/is/is.min.js"></script>
    <script src="vendors/fontawesome/all.min.js"></script>
    <script src="vendors/lodash/lodash.min.js"></script>
    <script src="assets/js/theme.js"></script>
  </body>

</html>
