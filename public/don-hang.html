<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đơn hàng</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/apex.css?v=29" rel="stylesheet">
  <script src="assets/js/apex.js?v=27"></script>
  <style>
    .ds-mon { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .dong-mon {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      font-size: 13.5px; padding: 8px 12px; border: 1px solid var(--vien); border-radius: 9px;
    }
  </style>
</head>
<body>
  <div class="apex-khung">
    <div id="apex-sidebar-cho"></div>
    <div class="apex-noi-dung">
      <div id="apex-topbar-cho"></div>
      <main class="apex-trang">

        <!-- KPI trạng thái -->
        <div class="luoi-kpi" id="kpi"></div>

        <!-- Bảng đơn hàng -->
        <div class="the">
          <div class="the-dau">
            <div><h3>Tất cả đơn hàng</h3></div>
            <select id="loc-trang-thai" class="nut nut-vien" style="padding:7px 10px;" onchange="locDon()">
              <option value="">Tất cả trạng thái</option>
              <option>Chờ xác nhận</option>
              <option>Đang xử lý</option>
              <option>Đang giao</option>
              <option>Hoàn thành</option>
              <option>Đã huỷ</option>
            </select>
          </div>
          <div class="the-than khong-dem bang-cuon">
            <table class="bang">
              <thead>
                <tr>
                  <th>Mã đơn</th><th>Khách hàng</th><th>Sản phẩm</th><th>Thanh toán</th>
                  <th class="giua">Trạng thái</th><th>Ngày đặt</th><th class="phai">Tổng tiền</th>
                </tr>
              </thead>
              <tbody id="bang-don"></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script>
    Apex.shell('don-hang', 'Đơn hàng');

    /* Số đơn / tổng tiền theo trạng thái và số món mỗi đơn do backend đếm sẵn (khoá 'tk-don-hang').
       Trang chỉ lọc hàng theo ô chọn trạng thái trên danh sách đã nạp — lọc giao diện. */
    var THEO_DON = {};   // id đơn -> { soMon, phuongThuc, daThanhToan }

    function veKpi() {
      var tk = Apex.tk('tk-don-hang') || {};
      var theoTt = {};
      (tk.theoTrangThai || []).forEach(function (t) { theoTt[t.trangThai] = t; });
      var cau = [
        { khoa: 'cho_xac_nhan', tt: 'Chờ xác nhận', icon: 'fa-clock', mau: 'bt-vang' },
        { khoa: 'dang_giao', tt: 'Đang giao', icon: 'fa-truck', mau: 'bt-toi' },
        { khoa: 'hoan_thanh', tt: 'Hoàn thành', icon: 'fa-circle-check', mau: 'bt-xanh' },
        { khoa: 'da_huy', tt: 'Đã huỷ', icon: 'fa-ban', mau: 'bt-do' }
      ];
      Apex.fill('#kpi', cau.map(function (c) {
        var s = theoTt[c.khoa] || {};
        return '<div class="kpi"><div class="dong-dau"><span class="nhan">' + c.tt + '</span>' +
          '<span class="bieu-tuong ' + c.mau + '"><i class="fa-solid ' + c.icon + '"></i></span></div>' +
          '<div class="so">' + Apex.number(s.soDon) + ' đơn</div>' +
          '<div class="thay-doi" style="color:var(--chu-mo)">' + Apex.money(s.tongTien) + '</div></div>';
      }).join(''));
    }

    /** Số món của đơn: backend đếm sẵn; thiếu thì lấy số Apex đã đổi từ chi tiết đơn. */
    function soMonCua(o) {
      return THEO_DON[o.dbId] ? THEO_DON[o.dbId].soMon : (o.items || 0);
    }

    function timDon(dbId) {
      for (var i = 0; i < Apex.orders.length; i++) if (Apex.orders[i].dbId === dbId) return Apex.orders[i];
      return null;
    }

    function veBang(loc) {
      var don = Apex.orders.filter(function (o) { return !loc || o.status === loc; });
      Apex.fill('#bang-don', don.map(function (o) {
        var mon = (o.chiTiet || []).map(function (c) { return Apex.esc(c.ten) + ' ×' + c.soLuong; }).join('<br>') || (soMonCua(o) + ' món');
        return '<tr class="hang-bam" onclick="moChiTiet(' + o.dbId + ')" title="Bấm để xem chi tiết">' +
          '<td><strong>' + Apex.esc(o.id) + '</strong></td>' +
          '<td><div class="o-ten"><div><div class="chinh">' + Apex.esc(o.customer) + '</div><div class="phu">' + Apex.esc(o.phone) + '</div></div></div></td>' +
          '<td style="font-size:12.5px;color:var(--chu-mo);">' + mon + '</td>' +
          '<td>' + Apex.esc(o.payment) + '</td>' +
          '<td class="giua">' + Apex.badgeTrangThai(o.status) + '</td>' +
          '<td>' + Apex.esc(o.date) + '</td>' +
          '<td class="phai"><strong>' + Apex.money(o.total) + '</strong></td>' +
          '</tr>';
      }).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--chu-mo);padding:28px;">Không có đơn hàng nào' + (loc ? ' ở trạng thái "' + loc + '"' : '') + '.</td></tr>');
    }

    /* ---------------- Hộp thoại chi tiết đơn ---------------- */

    function moChiTiet(dbId) {
      var o = timDon(dbId);
      if (!o) return;

      var dong = function (nhan, giaTri) {
        return '<div class="dong-tt"><span class="nhan-tt">' + nhan + '</span>' +
          '<span class="gia-tri">' + giaTri + '</span></div>';
      };

      var mon = (o.chiTiet || []).length
        ? '<div class="ds-mon">' + o.chiTiet.map(function (c) {
            var goc = c.donGiaGoc || c.donGia || 0;
            var duocGiam = goc > (c.donGia || 0);
            return '<div class="dong-mon"><span>' + Apex.esc(c.ten) +
              ' <span style="color:var(--chu-mo)">×' + c.soLuong + '</span></span>' +
              '<span>' + (duocGiam
                ? '<s style="color:var(--chu-mo);font-weight:400;">' + Apex.money(goc * c.soLuong) + '</s> '
                : '') +
              '<strong>' + Apex.money((c.donGia || 0) * (c.soLuong || 0)) + '</strong></span></div>';
          }).join('') + '</div>'
        : '<div style="color:var(--chu-mo);font-size:13.5px;">' + Apex.esc(soMonCua(o)) + ' món</div>';

      var ttHienTai = '';   // khoá trạng thái đang có, để trả ô chọn về nếu backend từ chối đổi
      var chonTt = Object.keys(Apex.ttMap).map(function (k) {
        if (Apex.ttMap[k] === o.status) ttHienTai = k;
        return '<option value="' + k + '"' + (Apex.ttMap[k] === o.status ? ' selected' : '') + '>' +
          Apex.ttMap[k] + '</option>';
      }).join('');

      var html =
        '<div class="ht-dau">' +
        '<div><h3>Đơn ' + Apex.esc(o.id) + '</h3><div class="phu">Đặt ngày ' + Apex.esc(o.date) + '</div></div>' +
        '<button class="nut-dong" type="button" onclick="Apex.dongHopThoai()"><i class="fa-solid fa-xmark"></i></button></div>' +

        '<div class="ht-than">' +
        '<div>' +
        dong('Trạng thái', Apex.badgeTrangThai(o.status)) +
        dong('Khách hàng', Apex.esc(o.customer)) +
        dong('Số điện thoại', Apex.esc(o.phone || '—')) +
        // Địa chỉ giao và ghi chú của khách — bản cũ không hiện nên phải hỏi lại khách
        dong('Địa chỉ giao', Apex.esc(o.diaChi || '—')) +
        (o.ghiChu ? dong('Ghi chú', Apex.esc(o.ghiChu)) : '') +
        dong('Thanh toán', Apex.esc(o.payment)) +
        // Đơn có dùng mã thì tách rõ tạm tính / giảm giá, không thì chỉ một dòng tổng tiền
        ((o.tienGiam > 0 || o.tienGiamSanPham > 0)
          ? dong('Tiền hàng', Apex.money(o.tienHangGoc)) +
            (o.tienGiamSanPham > 0
              ? dong('Giảm giá sản phẩm',
                     '<span style="color:var(--accent-dam);">&minus; ' + Apex.money(o.tienGiamSanPham) + '</span>')
              : '') +
            (o.tienGiam > 0
              ? dong('Mã khuyến mãi', '<span class="badge badge-xanh">' + Apex.esc(o.maKhuyenMai) + '</span> ' +
                     '<span style="color:var(--accent-dam);">&minus; ' + Apex.money(o.tienGiam) + '</span>')
              : '')
          : '') +
        dong('Tổng tiền', '<strong>' + Apex.money(o.total) + '</strong>') +
        '</div>' +
        '<div style="margin-top:16px;font-weight:600;">Sản phẩm đã đặt</div>' + mon +
        '<div class="o-nhap" style="margin-top:16px;margin-bottom:0;">' +
        '<label for="ct-tt-don">Đổi trạng thái đơn</label>' +
        '<select id="ct-tt-don" data-cu="' + ttHienTai + '" onchange="doiTrangThaiDon(' + o.dbId + ', this)">' + chonTt + '</select></div>' +
        // Backend từ chối (hoặc mất kết nối) thì câu báo hiện ở đây, hộp thoại vẫn mở
        '<div class="bao-loi" id="loi-don"></div>' +
        '</div>' +

        // Apex.dangLuu: khoá nút + "Đang xoá…/Đang lưu…" trong lúc chờ, lỗi hiện ở ô .bao-loi phía trên.
        // Ghi xong Apex tự đóng hộp thoại, nạp lại trang và báo toast.
        '<div class="ht-chan">' +
        '<button class="nut nut-do" type="button" onclick="Apex.dangLuu(this, Apex.xoaDon(' + o.dbId + '))">' +
        '<i class="fa-solid fa-trash"></i> Xoá</button>' +
        '<div class="day-phai">' +
        '<button class="nut nut-xanh" type="button" onclick="Apex.dangLuu(this, Apex.danhDauDaTT(' + o.dbId + '))">' +
        '<i class="fa-solid fa-check"></i> Đã thanh toán</button></div>' +
        '</div>';

      Apex.moHopThoai(html);
    }

    /* Đổi trạng thái ngay khi chọn. Trong lúc chờ ô chọn bị khoá; backend từ chối thì câu báo
       hiện trong hộp và ô chọn trả về trạng thái cũ để không hiểu nhầm là đã đổi. */
    function doiTrangThaiDon(dbId, oChon) {
      var cu = oChon.getAttribute('data-cu');
      Apex.dangLuu(oChon, Apex.doiTrangThai(dbId, oChon.value)).then(function (kq) {
        if (kq === undefined && cu && document.body.contains(oChon)) oChon.value = cu;
      });
    }

    function locDon() { veBang(document.getElementById('loc-trang-thai').value); }

    function veLaiTrang() {
      THEO_DON = {};
      ((Apex.tk('tk-don-hang') || {}).theoDon || []).forEach(function (d) { THEO_DON[d.id] = d; });
      veKpi();
      veBang(document.getElementById('loc-trang-thai').value);
    }
    // Một request cho cả trang; Apex gọi veLaiTrang khi dữ liệu về và sau mỗi lần ghi
    Apex.trang({ bo: ['don-hang', 'tk-don-hang'], ve: veLaiTrang });
  </script>
</body>
</html>
