<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý xuất nhập | IN3D Store</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/apex.css?v=6" rel="stylesheet">
  <script src="assets/js/apex.js?v=6"></script>
</head>
<body>
  <div class="apex-khung">
    <div id="apex-sidebar-cho"></div>
    <div class="apex-noi-dung">
      <div id="apex-topbar-cho"></div>
      <main class="apex-trang">

        <!-- KPI -->
        <div class="luoi-kpi" id="kpi"></div>

        <!-- Phiếu xuất kho -->
        <div class="the">
          <div class="the-dau">
            <div><h3>Phiếu xuất kho (theo đơn hàng)</h3><div class="phu">Mỗi đơn hàng tương ứng một phiếu xuất</div></div>
            <a class="nut nut-vien nut-nho" href="don-hang.html">Xem đơn hàng</a>
          </div>
          <div class="the-than khong-dem bang-cuon">
            <table class="bang">
              <thead>
                <tr>
                  <th>Mã phiếu</th>
                  <th>Ngày</th>
                  <th>Khách nhận</th>
                  <th class="giua">Số món</th>
                  <th class="giua">Trạng thái đơn</th>
                  <th class="phai">Giá trị xuất</th>
                </tr>
              </thead>
              <tbody id="bang-xuat"></tbody>
            </table>
          </div>
        </div>

        <!-- Đề xuất nhập kho -->
        <div class="the">
          <div class="the-dau">
            <div><h3>Đề xuất nhập kho</h3><div class="phu">Dựa trên tồn kho và mức tối thiểu</div></div>
            <a class="nut nut-vien nut-nho" href="kho.html">Sang trang Kho</a>
          </div>
          <div class="the-than khong-dem bang-cuon">
            <table class="bang">
              <thead>
                <tr>
                  <th>Mặt hàng</th>
                  <th class="giua">Tồn</th>
                  <th class="giua">Tối thiểu</th>
                  <th class="giua">Trạng thái</th>
                  <th class="phai">Cần nhập</th>
                </tr>
              </thead>
              <tbody id="bang-nhap"></tbody>
            </table>
          </div>
        </div>

      </main>
      <div id="apex-chan-cho"></div>
    </div>
  </div>

  <script>
    Apex.shell('quan-ly-xuat-nhap', 'Quản lý xuất nhập');

    (function () {
      var don = Apex.orders || [];
      var sp = Apex.products || [];

      var tongGiaTri = don.reduce(function (s, o) { return s + (o.total || 0); }, 0);
      var tongMon = don.reduce(function (s, o) { return s + (o.items || 0); }, 0);
      var tonKho = sp.reduce(function (s, p) { return s + (p.stock || 0); }, 0);

      Apex.fill('#kpi', [
        { nhan: 'Phiếu xuất', so: Apex.number(don.length) + ' phiếu', icon: 'fa-file-export', mau: 'bt-xanh' },
        { nhan: 'Tổng giá trị xuất', so: Apex.money(tongGiaTri), icon: 'fa-wallet', mau: 'bt-vang' },
        { nhan: 'Số món đã xuất', so: Apex.number(tongMon) + ' món', icon: 'fa-boxes-packing', mau: 'bt-do' },
        { nhan: 'Tồn kho hiện tại', so: Apex.number(tonKho) + ' món', icon: 'fa-warehouse', mau: 'bt-toi' }
      ].map(function (k) {
        return '<div class="kpi"><div class="dong-dau"><span class="nhan">' + k.nhan + '</span>' +
          '<span class="bieu-tuong ' + k.mau + '"><i class="fa-solid ' + k.icon + '"></i></span></div>' +
          '<div class="so">' + k.so + '</div></div>';
      }).join(''));

      // Phiếu xuất kho
      Apex.fill('#bang-xuat', don.map(function (o) {
        return '<tr>' +
          '<td><span class="badge badge-vang">XK-' + Apex.esc(o.id) + '</span></td>' +
          '<td>' + Apex.esc(Apex.ngayVN(o.date)) + '</td>' +
          '<td>' + Apex.esc(o.customer) + '</td>' +
          '<td class="giua">' + Apex.number(o.items || 0) + '</td>' +
          '<td class="giua">' + Apex.badgeTrangThai(o.status) + '</td>' +
          '<td class="phai"><strong>' + Apex.money(o.total || 0) + '</strong></td>' +
          '</tr>';
      }).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--chu-mo);padding:28px;">Chưa có phiếu xuất nào — phiếu tự sinh khi khách đặt hàng.</td></tr>');

      // Đề xuất nhập kho
      Apex.fill('#bang-nhap', sp.map(function (p) {
        var ton = p.stock || 0, toiThieu = p.min || 0;
        var canNhap = Math.max(0, toiThieu * 2 - ton);
        return '<tr>' +
          '<td><div class="o-ten"><img class="anh-sp" src="' + (Apex.anhDayDu(p.img) || Apex.anhSanPham(p.name)) + '" alt="" />' +
          '<div><div class="chinh">' + Apex.esc(p.name) + '</div><div class="phu">' + Apex.esc(p.sku || '') + '</div></div></div></td>' +
          '<td class="giua"><strong>' + Apex.number(ton) + '</strong></td>' +
          '<td class="giua">' + Apex.number(toiThieu) + '</td>' +
          '<td class="giua">' + Apex.badgeTon(ton, toiThieu) + '</td>' +
          '<td class="phai">' + (canNhap > 0
            ? '<span class="badge badge-vang">Nên nhập ' + Apex.number(canNhap) + '</span>'
            : '<span style="color:var(--chu-mo);">—</span>') + '</td>' +
          '</tr>';
      }).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--chu-mo);padding:28px;">Chưa có mặt hàng nào trong kho.</td></tr>');
    })();
  </script>
</body>
</html>
