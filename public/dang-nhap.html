<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | IN3D Store</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/apex.css?v=5" rel="stylesheet">
  <style>
    .o-otp {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 18px 0 10px 0;
    }
    .o-otp input {
      width: 46px;
      height: 56px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      border: 1px solid var(--vien);
      border-radius: 10px;
      outline: none;
      font-family: inherit;
    }
    .o-otp input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-nhat); }
    .dem-nguoc { text-align: center; color: var(--chu-mo); font-size: 13px; margin-bottom: 12px; }
    .dem-nguoc strong { color: var(--accent-dam); }
    .gui-lai { background: none; border: none; color: var(--accent-dam); font-weight: 600; cursor: pointer; font-family: inherit; font-size: 13px; }
    .gui-lai:disabled { color: var(--chu-mo); cursor: not-allowed; }
    .buoc-2 { display: none; }
    .hop-email {
      background: var(--accent-nhat);
      color: #065f46;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      text-align: center;
      margin-bottom: 4px;
    }
    .nut-quay-lai { background: none; border: none; color: var(--chu-mo); font-size: 13px; cursor: pointer; font-family: inherit; }
    .nut-quay-lai:hover { color: var(--chu); }
  </style>
</head>
<body>
  <div class="dang-nhap-nen">
    <div class="dang-nhap-hop">

      <div class="logo-lon">
        <img src="assets/img/logo.png" alt="IN3D Store">
        <div>
          <h1>IN3D Store</h1>
          <div class="phu">Hệ thống quản trị bán hàng</div>
        </div>
      </div>

      <!-- BƯỚC 1: email + mật khẩu -->
      <form id="buoc-1">
        <div class="o-nhap">
          <label for="email">Email quản trị</label>
          <input type="email" id="email" placeholder="admin@example.com" autocomplete="username" required>
        </div>
        <div class="o-nhap">
          <label for="mat-khau">Mật khẩu</label>
          <input type="password" id="mat-khau" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
        </div>
        <p class="bao-loi" id="loi-1"></p>
        <button class="nut nut-chinh" type="submit" id="nut-1" style="width:100%;justify-content:center;padding:11px;">
          <i class="fa-solid fa-right-to-bracket"></i> Tiếp tục
        </button>
      </form>

      <!-- BƯỚC 2: nhập mã OTP -->
      <div class="buoc-2" id="buoc-2">
        <div class="hop-email" id="hop-email"></div>
        <p style="text-align:center;color:var(--chu-mo);font-size:13px;margin-top:12px;">
          Nhập mã gồm 6 chữ số để hoàn tất đăng nhập
        </p>

        <div class="o-otp" id="o-otp">
          <input type="text" inputmode="numeric" maxlength="1" data-i="0">
          <input type="text" inputmode="numeric" maxlength="1" data-i="1">
          <input type="text" inputmode="numeric" maxlength="1" data-i="2">
          <input type="text" inputmode="numeric" maxlength="1" data-i="3">
          <input type="text" inputmode="numeric" maxlength="1" data-i="4">
          <input type="text" inputmode="numeric" maxlength="1" data-i="5">
        </div>

        <div class="dem-nguoc" id="dem-nguoc"></div>
        <p class="bao-loi" id="loi-2"></p>
        <p class="bao-ok" id="ok-2" style="display:none;text-align:center;"></p>

        <button class="nut nut-chinh" type="button" id="nut-2" style="width:100%;justify-content:center;padding:11px;">
          <i class="fa-solid fa-shield-halved"></i> Xác thực &amp; đăng nhập
        </button>

        <div style="text-align:center;margin-top:14px;display:flex;justify-content:space-between;align-items:center;">
          <button class="nut-quay-lai" type="button" onclick="veBuoc1()"><i class="fa-solid fa-arrow-left"></i> Quay lại</button>
          <button class="gui-lai" type="button" id="nut-gui-lai" onclick="guiLaiMa()">Gửi lại mã</button>
        </div>
      </div>

      <p style="color:var(--chu-mo);font-size:12.5px;text-align:center;margin-top:20px;line-height:1.6;">
        <i class="fa-solid fa-lock"></i> Chỉ tài khoản có quyền <strong>quản trị</strong> mới đăng nhập được.<br>
        Hệ thống gửi mã xác thực về email mỗi lần đăng nhập.
      </p>

    </div>
  </div>

  <script>
    var JAVA_API = 'http://localhost:8090/api';
    var emailDangDangNhap = '';
    var boDemNguoc = null;

    var loi1 = document.getElementById('loi-1');
    var loi2 = document.getElementById('loi-2');
    var ok2 = document.getElementById('ok-2');
    var nut1 = document.getElementById('nut-1');
    var nut2 = document.getElementById('nut-2');
    var oOtp = [].slice.call(document.querySelectorAll('#o-otp input'));

    function datNut(nut, dangChay, chuGoc) {
      nut.disabled = dangChay;
      nut.innerHTML = dangChay ? 'Đang xử lý...' : chuGoc;
    }

    /* ---------- BƯỚC 1: kiểm tra email + mật khẩu, nhận OTP ---------- */

    document.getElementById('buoc-1').addEventListener('submit', async function (e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var matKhau = document.getElementById('mat-khau').value;

      if (!email) { loi1.textContent = 'Vui lòng nhập email.'; return; }
      if (!matKhau) { loi1.textContent = 'Vui lòng nhập mật khẩu.'; return; }

      loi1.textContent = '';
      datNut(nut1, true);

      try {
        var resp = await fetch(JAVA_API + '/auth/admin/dang-nhap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, matKhau: matKhau })
        });
        var kq = await resp.json();
        if (!resp.ok) {
          loi1.textContent = kq.loi || ('Lỗi HTTP ' + resp.status);
          datNut(nut1, false, '<i class="fa-solid fa-right-to-bracket"></i> Tiếp tục');
          return;
        }
        emailDangDangNhap = kq.email;
        sangBuoc2(kq);
      } catch (err) {
        loi1.textContent = 'Không kết nối được backend Java. Hãy chạy backend (cổng 8090) rồi thử lại.';
        datNut(nut1, false, '<i class="fa-solid fa-right-to-bracket"></i> Tiếp tục');
      }
    });

    function sangBuoc2(kq) {
      document.getElementById('buoc-1').style.display = 'none';
      document.getElementById('buoc-2').style.display = 'block';
      document.getElementById('hop-email').innerHTML =
        '<i class="fa-solid fa-envelope-circle-check"></i> ' + (kq.thongBao || '');
      loi2.textContent = '';
      ok2.style.display = 'none';
      oOtp.forEach(function (o) { o.value = ''; });
      oOtp[0].focus();
      batDauDemNguoc((kq.phutHieuLuc || 5) * 60);
      datNut(nut2, false, '<i class="fa-solid fa-shield-halved"></i> Xác thực &amp; đăng nhập');
    }

    function veBuoc1() {
      clearInterval(boDemNguoc);
      document.getElementById('buoc-2').style.display = 'none';
      document.getElementById('buoc-1').style.display = 'block';
      datNut(nut1, false, '<i class="fa-solid fa-right-to-bracket"></i> Tiếp tục');
      document.getElementById('mat-khau').value = '';
    }

    function batDauDemNguoc(giay) {
      clearInterval(boDemNguoc);
      var o = document.getElementById('dem-nguoc');
      var nutGL = document.getElementById('nut-gui-lai');
      nutGL.disabled = true;
      var conLai = giay;
      var ve = function () {
        if (conLai <= 0) {
          o.innerHTML = 'Mã đã hết hạn — hãy bấm "Gửi lại mã".';
          nutGL.disabled = false;
          clearInterval(boDemNguoc);
          return;
        }
        var p = Math.floor(conLai / 60), s = conLai % 60;
        o.innerHTML = 'Mã có hiệu lực trong <strong>' + p + ':' + (s < 10 ? '0' : '') + s + '</strong>';
        // Cho gửi lại sau khi còn dưới 4 phút (đã chờ ~1 phút)
        if (conLai < giay - 60) nutGL.disabled = false;
        conLai--;
      };
      ve();
      boDemNguoc = setInterval(ve, 1000);
    }

    /* ---------- Ô nhập OTP: tự nhảy ô, dán được cả mã ---------- */

    oOtp.forEach(function (o, i) {
      o.addEventListener('input', function () {
        o.value = o.value.replace(/\D/g, '');
        if (o.value && i < oOtp.length - 1) oOtp[i + 1].focus();
        if (layMa().length === 6) nut2.click();
      });
      o.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && !o.value && i > 0) oOtp[i - 1].focus();
      });
      o.addEventListener('paste', function (e) {
        e.preventDefault();
        var so = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6).split('');
        so.forEach(function (ky, j) { if (oOtp[j]) oOtp[j].value = ky; });
        if (so.length === 6) nut2.click(); else if (oOtp[so.length]) oOtp[so.length].focus();
      });
    });

    function layMa() {
      return oOtp.map(function (o) { return o.value; }).join('');
    }

    /* ---------- BƯỚC 2: xác thực OTP ---------- */

    nut2.addEventListener('click', async function () {
      var ma = layMa();
      if (ma.length !== 6) { loi2.textContent = 'Vui lòng nhập đủ 6 chữ số.'; return; }

      loi2.textContent = '';
      datNut(nut2, true);

      try {
        var resp = await fetch(JAVA_API + '/auth/admin/xac-thuc-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailDangDangNhap, ma: ma })
        });
        var kq = await resp.json();
        if (!resp.ok) {
          loi2.textContent = kq.loi || ('Lỗi HTTP ' + resp.status);
          oOtp.forEach(function (o) { o.value = ''; });
          oOtp[0].focus();
          datNut(nut2, false, '<i class="fa-solid fa-shield-halved"></i> Xác thực &amp; đăng nhập');
          return;
        }
        clearInterval(boDemNguoc);
        localStorage.setItem('in3d_phien', JSON.stringify({
          token: kq.token, hoTen: kq.hoTen, email: kq.email, vaiTro: kq.vaiTro
        }));
        ok2.textContent = 'Xin chào ' + kq.hoTen + '! Đang vào trang quản trị...';
        ok2.style.display = 'block';
        setTimeout(function () { window.location.href = 'index.html'; }, 800);
      } catch (err) {
        loi2.textContent = 'Không kết nối được backend Java.';
        datNut(nut2, false, '<i class="fa-solid fa-shield-halved"></i> Xác thực &amp; đăng nhập');
      }
    });

    /* ---------- Gửi lại mã ---------- */

    async function guiLaiMa() {
      var nutGL = document.getElementById('nut-gui-lai');
      nutGL.disabled = true;
      nutGL.textContent = 'Đang gửi...';
      loi2.textContent = '';
      try {
        var resp = await fetch(JAVA_API + '/auth/admin/dang-nhap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailDangDangNhap, matKhau: document.getElementById('mat-khau').value })
        });
        var kq = await resp.json();
        if (!resp.ok) { loi2.textContent = kq.loi || 'Không gửi lại được mã.'; veBuoc1(); return; }
        document.getElementById('hop-email').innerHTML =
          '<i class="fa-solid fa-envelope-circle-check"></i> Đã gửi lại mã. ' + (kq.thongBao || '');
        oOtp.forEach(function (o) { o.value = ''; });
        oOtp[0].focus();
        batDauDemNguoc((kq.phutHieuLuc || 5) * 60);
      } catch (err) {
        loi2.textContent = 'Không kết nối được backend Java.';
      }
      nutGL.textContent = 'Gửi lại mã';
    }
  </script>
</body>
</html>
