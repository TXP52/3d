<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cài đặt cửa hàng</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/apex.css?v=16" rel="stylesheet">
  <script src="assets/js/apex.js?v=15"></script>
  <style>
    .dong-tt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--vien); }
    .dong-tt:last-child { border-bottom: none; }
    .dong-tt .nhan-tt { font-size: 13.5px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="apex-khung">
    <div id="apex-sidebar-cho"></div>
    <div class="apex-noi-dung">
      <div id="apex-topbar-cho"></div>
      <main class="apex-trang">

        <div class="luoi-2">

          <!-- Thông tin cửa hàng -->
          <div class="the">
            <div class="the-dau"><div><h3>Thông tin cửa hàng</h3><div class="phu">Thông tin hiển thị trên website bán hàng</div></div></div>
            <div class="the-than">
              <div class="o-nhap">
                <label for="ten-ch">Tên cửa hàng</label>
                <input id="ten-ch" type="text">
              </div>
              <div class="o-nhap">
                <label for="email-ch">Email liên hệ</label>
                <input id="email-ch" type="email">
              </div>
              <div class="o-nhap">
                <label for="dt-ch">Điện thoại</label>
                <input id="dt-ch" type="text">
              </div>
              <div class="o-nhap">
                <label for="dc-ch">Địa chỉ</label>
                <textarea id="dc-ch" rows="2"></textarea>
              </div>
              <div class="o-nhap">
                <label for="gio-ch">Giờ mở cửa</label>
                <input id="gio-ch" type="text">
                <div class="goi-y">Ví dụ: 8:00 - 21:00 (tất cả các ngày trong tuần)</div>
              </div>
              <div class="bao-ok" id="bao-ok" style="display:none;">Đã lưu cài đặt!</div>
              <button class="nut nut-chinh" id="nut-luu"><i class="fa-solid fa-floppy-disk"></i> Lưu</button>
            </div>
          </div>

          <!-- Trạng thái hệ thống -->
          <div class="the" style="align-self:start;">
            <div class="the-dau"><div><h3>Trạng thái hệ thống</h3></div></div>
            <div class="the-than" id="trang-thai-ht"></div>
          </div>

        </div>

      </main>
    </div>
  </div>

  <script>
    Apex.shell('cai-dat', 'Cài đặt cửa hàng');

    (function () {
      var KHOA = 'in3d_caidat';

      var oTen = document.getElementById('ten-ch');
      var oEmail = document.getElementById('email-ch');
      var oDT = document.getElementById('dt-ch');
      var oDC = document.getElementById('dc-ch');
      var oGio = document.getElementById('gio-ch');
      var baoOk = document.getElementById('bao-ok');

      // Đọc lại cài đặt đã lưu
      var daLuu = null;
      try { daLuu = JSON.parse(localStorage.getItem(KHOA)); } catch (e) { daLuu = null; }
      if (!daLuu || typeof daLuu !== 'object') { daLuu = {}; }

      // Chỉ hiện những gì chủ shop đã lưu; chưa lưu thì để trống chứ không điền địa chỉ bịa
      oTen.value = daLuu.ten || '';
      oEmail.value = daLuu.email || '';
      oDT.value = daLuu.dienThoai || '';
      oDC.value = daLuu.diaChi || '';
      oGio.value = daLuu.gio || '';

      document.getElementById('nut-luu').addEventListener('click', function () {
        var duLieu = {
          ten: oTen.value.trim(),
          email: oEmail.value.trim(),
          dienThoai: oDT.value.trim(),
          diaChi: oDC.value.trim(),
          gio: oGio.value.trim()
        };
        try { localStorage.setItem(KHOA, JSON.stringify(duLieu)); } catch (e) { }
        oTen.value = duLieu.ten;
        oEmail.value = duLieu.email;
        oDT.value = duLieu.dienThoai;
        oDC.value = duLieu.diaChi;
        oGio.value = duLieu.gio;
        baoOk.style.display = 'block';
        setTimeout(function () { baoOk.style.display = 'none'; }, 2600);
      });

      // Trạng thái hệ thống
      var phien = Apex.layPhien();
      var taiKhoan = phien && phien.hoTen
        ? { lop: 'badge-xanh', chu: Apex.esc(phien.hoTen) }
        : { lop: 'badge-xam', chu: 'Chưa đăng nhập' };

      var dong = function (nhan, lop, chu) {
        return '<div class="dong-tt"><span class="nhan-tt">' + nhan + '</span>' +
          '<span class="badge ' + lop + '"><span class="cham"></span>' + chu + '</span></div>';
      };

      function veLaiTrang() {
        Apex.fill('#trang-thai-ht',
          dong('Tài khoản đăng nhập', taiKhoan.lop, taiKhoan.chu) +
          dong('Số sản phẩm', 'badge-xam', Apex.number(Apex.products.length)) +
          dong('Số danh mục sản phẩm', 'badge-xam', Apex.number(Apex.danhMucSanPham().length)) +
          dong('Số loại vật tư', 'badge-xam', Apex.number(Apex.danhMucVatTu().length)) +
          dong('Số đơn hàng', 'badge-xam', Apex.number(Apex.orders.length))
        );
      }
      Apex.datVeLai(veLaiTrang);   // Apex gọi ngay khi dữ liệu về
    })();
  </script>
</body>
</html>
