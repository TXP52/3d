<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cài đặt cửa hàng</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/apex.css?v=30" rel="stylesheet">
  <script src="assets/js/cau-hinh.js?v=2"></script>
  <!-- Cổng chặn: chưa đăng nhập là chuyển thẳng sang trang đăng nhập, chạy trước apex.js -->
  <script src="assets/js/canh-cong.js?v=1"></script>
    <script src="assets/js/apex.js?v=36"></script>
  <style>
    .dong-tt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--vien); }
    .dong-tt:last-child { border-bottom: none; }
    .dong-tt .nhan-tt { font-size: 13.5px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="apex-khung">
    <div id="apex-sidebar-cho"></div>
    <div class="apex-noi-dung">
      <div id="apex-topbar-cho"></div>
      <main class="apex-trang">

        <div class="luoi-2">

          <!-- Thông tin cửa hàng -->
          <div class="the">
            <div class="the-dau"><div><h3>Thông tin cửa hàng</h3></div></div>
            <div class="the-than">
              <div class="o-nhap">
                <label for="ten-ch">Tên cửa hàng</label>
                <input id="ten-ch" type="text">
              </div>
              <div class="o-nhap">
                <label for="email-ch">Email liên hệ</label>
                <input id="email-ch" type="email">
              </div>
              <div class="o-nhap">
                <label for="dt-ch">Điện thoại</label>
                <input id="dt-ch" type="text">
              </div>
              <div class="o-nhap">
                <label for="dc-ch">Địa chỉ</label>
                <textarea id="dc-ch" rows="2"></textarea>
              </div>
              <div class="o-nhap">
                <label for="gio-ch">Giờ mở cửa</label>
                <input id="gio-ch" type="text">
              </div>
              <div class="bao-ok" id="bao-ok" style="display:none;">Đã lưu cài đặt!</div>
              <button class="nut nut-chinh" id="nut-luu"><i class="fa-solid fa-floppy-disk"></i> Lưu</button>
            </div>
          </div>

          <div>
            <!-- Đổi mật khẩu quản trị -->
            <div class="the" style="margin-bottom:20px;">
              <div class="the-dau"><div><h3>Đổi mật khẩu</h3></div></div>
              <div class="the-than">
                <div class="o-nhap">
                  <label for="mk-cu">Mật khẩu hiện tại</label>
                  <input id="mk-cu" type="password" autocomplete="current-password">
                </div>
                <div class="o-nhap">
                  <label for="mk-moi">Mật khẩu mới</label>
                  <input id="mk-moi" type="password" autocomplete="new-password">
                </div>
                <div class="o-nhap">
                  <label for="mk-lai">Nhập lại mật khẩu mới</label>
                  <input id="mk-lai" type="password" autocomplete="new-password">
                </div>
                <div class="bao-loi" id="mk-loi" style="display:none;"></div>
                <div class="bao-ok" id="mk-ok" style="display:none;"></div>
                <button class="nut nut-chinh" id="nut-doi-mk">
                  <i class="fa-solid fa-key"></i> Đổi mật khẩu
                </button>
              </div>
            </div>

            <!-- Trạng thái hệ thống -->
            <div class="the">
              <div class="the-dau"><div><h3>Trạng thái hệ thống</h3></div></div>
              <div class="the-than" id="trang-thai-ht"></div>
            </div>
          </div>

        </div>

      </main>
    </div>
  </div>

  <script>
    Apex.shell('cai-dat', 'Cài đặt cửa hàng');

    /* ---------------- Đổi mật khẩu quản trị ----------------
       Gọi thẳng API chứ không qua Apex.ghi: Apex.ghi nạp lại toàn bộ dữ liệu trang
       sau mỗi lần ghi, mà đổi mật khẩu thì chẳng có bảng nào cần vẽ lại. */
    (function () {
      var oCu = document.getElementById('mk-cu');
      var oMoi = document.getElementById('mk-moi');
      var oLai = document.getElementById('mk-lai');
      var oLoi = document.getElementById('mk-loi');
      var oOk = document.getElementById('mk-ok');
      var nut = document.getElementById('nut-doi-mk');

      function bao(el, chu) {
        oLoi.style.display = 'none';
        oOk.style.display = 'none';
        if (!chu) return;
        el.textContent = chu;
        el.style.display = 'block';
      }

      nut.addEventListener('click', function () {
        var cu = oCu.value;
        var moi = oMoi.value;

        if (!cu) { bao(oLoi, 'Nhập mật khẩu hiện tại.'); oCu.focus(); return; }
        if (moi.length < 8) { bao(oLoi, 'Mật khẩu mới phải có ít nhất 8 ký tự.'); oMoi.focus(); return; }
        if (moi !== oLai.value) { bao(oLoi, 'Hai ô mật khẩu mới không giống nhau.'); oLai.focus(); return; }

        bao(null, '');
        nut.disabled = true;

        var phien = Apex.layPhien();
        fetch(Apex.javaApi + '/auth/doi-mat-khau', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + (phien && phien.token)
          },
          body: JSON.stringify({ matKhauCu: cu, matKhauMoi: moi })
        }).then(function (r) {
          return r.json().then(function (kq) { return { ok: r.ok, kq: kq }; });
        }).then(function (d) {
          nut.disabled = false;
          if (!d.ok) { bao(oLoi, d.kq.loi || 'Không đổi được mật khẩu.'); return; }
          oCu.value = oMoi.value = oLai.value = '';
          bao(oOk, 'Đã đổi mật khẩu. Lần đăng nhập sau dùng mật khẩu mới.');
        }, function () {
          nut.disabled = false;
          bao(oLoi, 'Không kết nối được server');
        });
      });
    })();

    (function () {
      var KHOA = 'in3d_caidat';

      var oTen = document.getElementById('ten-ch');
      var oEmail = document.getElementById('email-ch');
      var oDT = document.getElementById('dt-ch');
      var oDC = document.getElementById('dc-ch');
      var oGio = document.getElementById('gio-ch');
      var baoOk = document.getElementById('bao-ok');

      // Đọc lại cài đặt đã lưu
      var daLuu = null;
      try { daLuu = JSON.parse(localStorage.getItem(KHOA)); } catch (e) { daLuu = null; }
      if (!daLuu || typeof daLuu !== 'object') { daLuu = {}; }

      // Chỉ hiện những gì chủ shop đã lưu; chưa lưu thì để trống chứ không điền địa chỉ bịa
      oTen.value = daLuu.ten || '';
      oEmail.value = daLuu.email || '';
      oDT.value = daLuu.dienThoai || '';
      oDC.value = daLuu.diaChi || '';
      oGio.value = daLuu.gio || '';

      document.getElementById('nut-luu').addEventListener('click', function () {
        var duLieu = {
          ten: oTen.value.trim(),
          email: oEmail.value.trim(),
          dienThoai: oDT.value.trim(),
          diaChi: oDC.value.trim(),
          gio: oGio.value.trim()
        };
        try { localStorage.setItem(KHOA, JSON.stringify(duLieu)); } catch (e) { }
        oTen.value = duLieu.ten;
        oEmail.value = duLieu.email;
        oDT.value = duLieu.dienThoai;
        oDC.value = duLieu.diaChi;
        oGio.value = duLieu.gio;
        baoOk.style.display = 'block';
        setTimeout(function () { baoOk.style.display = 'none'; }, 2600);
      });

      // Trạng thái hệ thống
      var phien = Apex.layPhien();
      var taiKhoan = phien && phien.hoTen
        ? { lop: 'badge-xanh', chu: Apex.esc(phien.hoTen) }
        : { lop: 'badge-xam', chu: 'Chưa đăng nhập' };

      var dong = function (nhan, lop, chu) {
        return '<div class="dong-tt"><span class="nhan-tt">' + nhan + '</span>' +
          '<span class="badge ' + lop + '"><span class="cham"></span>' + chu + '</span></div>';
      };

      // Các con số đếm sẵn ở backend (khoá 'tk-cai-dat') — không phải tải cả danh sách về để đếm
      function veLaiTrang() {
        var tk = Apex.tk('tk-cai-dat') || {};
        Apex.fill('#trang-thai-ht',
          dong('Tài khoản đăng nhập', taiKhoan.lop, taiKhoan.chu) +
          dong('Số sản phẩm', 'badge-xam', Apex.number(tk.soSanPham)) +
          dong('Số danh mục sản phẩm', 'badge-xam', Apex.number(tk.soDanhMucSanPham)) +
          dong('Số loại vật tư', 'badge-xam', Apex.number(tk.soLoaiVatTu)) +
          dong('Số đơn hàng', 'badge-xam', Apex.number(tk.soDonHang))
        );
      }
      Apex.trang({ bo: ['tk-cai-dat'], ve: veLaiTrang });   // một request; Apex gọi veLaiTrang khi dữ liệu về
    })();
  </script>
</body>
</html>
