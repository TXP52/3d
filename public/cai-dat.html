<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cài đặt cửa hàng</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/apex.css?v=9" rel="stylesheet">
  <script src="assets/js/apex.js?v=8"></script>
  <style>
    .dong-tt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--vien); }
    .dong-tt:last-child { border-bottom: none; }
    .dong-tt .nhan-tt { font-size: 13.5px; font-weight: 600; }
    .lien-ket-nhanh { display: flex; flex-direction: column; gap: 8px; }
    .lien-ket-nhanh .nut { justify-content: flex-start; }
  </style>
</head>
<body>
  <div class="apex-khung">
    <div id="apex-sidebar-cho"></div>
    <div class="apex-noi-dung">
      <div id="apex-topbar-cho"></div>
      <main class="apex-trang">

        <div class="luoi-2">

          <!-- Thông tin cửa hàng -->
          <div class="the">
            <div class="the-dau"><div><h3>Thông tin cửa hàng</h3><div class="phu">Thông tin hiển thị trên website bán hàng</div></div></div>
            <div class="the-than">
              <div class="o-nhap">
                <label for="ten-ch">Tên cửa hàng</label>
                <input id="ten-ch" type="text" placeholder="IN3D Shop">
              </div>
              <div class="o-nhap">
                <label for="email-ch">Email liên hệ</label>
                <input id="email-ch" type="email" placeholder="lienhe@in3dshop.vn">
              </div>
              <div class="o-nhap">
                <label for="dt-ch">Điện thoại</label>
                <input id="dt-ch" type="text" placeholder="0901 234 567">
              </div>
              <div class="o-nhap">
                <label for="dc-ch">Địa chỉ</label>
                <textarea id="dc-ch" rows="2" placeholder="123 Nguyễn Văn Cừ, Q.5, TP. Hồ Chí Minh"></textarea>
              </div>
              <div class="o-nhap">
                <label for="gio-ch">Giờ mở cửa</label>
                <input id="gio-ch" type="text" placeholder="8:00 - 21:00">
                <div class="goi-y">Ví dụ: 8:00 - 21:00 (tất cả các ngày trong tuần)</div>
              </div>
              <div class="bao-ok" id="bao-ok" style="display:none;">Đã lưu cài đặt!</div>
              <button class="nut nut-chinh" id="nut-luu"><i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi</button>
            </div>
          </div>

          <div>
            <!-- Trạng thái hệ thống -->
            <div class="the" style="margin-bottom:18px;">
              <div class="the-dau"><div><h3>Trạng thái hệ thống</h3></div></div>
              <div class="the-than" id="trang-thai-ht"></div>
            </div>

            <!-- Liên kết nhanh -->
            <div class="the">
              <div class="the-dau"><div><h3>Liên kết nhanh</h3></div></div>
              <div class="the-than">
                <div class="lien-ket-nhanh">
                  <a class="nut nut-vien" href="http://localhost:8123/Home.html" target="_blank" rel="noopener"><i class="fa-solid fa-store"></i> Website bán hàng</a>
                  <a class="nut nut-vien" href="don-hang.html"><i class="fa-solid fa-receipt"></i> Quản lý đơn hàng</a>
                  <a class="nut nut-vien" href="kho.html"><i class="fa-solid fa-boxes-stacked"></i> Kho &amp; vật tư</a>
                </div>
              </div>
            </div>
          </div>

        </div>

      </main>
      <div id="apex-chan-cho"></div>
    </div>
  </div>

  <script>
    Apex.shell('cai-dat', 'Cài đặt cửa hàng');

    (function () {
      var KHOA = 'in3d_caidat';
      var macDinh = {
        ten: 'IN3D Shop',
        email: 'lienhe@in3dshop.vn',
        dienThoai: '0901 234 567',
        diaChi: '123 Nguyễn Văn Cừ, Q.5, TP. Hồ Chí Minh',
        gio: '8:00 - 21:00'
      };

      var oTen = document.getElementById('ten-ch');
      var oEmail = document.getElementById('email-ch');
      var oDT = document.getElementById('dt-ch');
      var oDC = document.getElementById('dc-ch');
      var oGio = document.getElementById('gio-ch');
      var baoOk = document.getElementById('bao-ok');

      // Đọc lại cài đặt đã lưu
      var daLuu = null;
      try { daLuu = JSON.parse(localStorage.getItem(KHOA)); } catch (e) { daLuu = null; }
      if (!daLuu || typeof daLuu !== 'object') { daLuu = {}; }

      oTen.value = daLuu.ten || macDinh.ten;
      oEmail.value = daLuu.email || macDinh.email;
      oDT.value = daLuu.dienThoai || macDinh.dienThoai;
      oDC.value = daLuu.diaChi || macDinh.diaChi;
      oGio.value = daLuu.gio || macDinh.gio;

      document.getElementById('nut-luu').addEventListener('click', function () {
        var duLieu = {
          ten: oTen.value.trim() || macDinh.ten,
          email: oEmail.value.trim() || macDinh.email,
          dienThoai: oDT.value.trim() || macDinh.dienThoai,
          diaChi: oDC.value.trim() || macDinh.diaChi,
          gio: oGio.value.trim() || macDinh.gio
        };
        try { localStorage.setItem(KHOA, JSON.stringify(duLieu)); } catch (e) { }
        oTen.value = duLieu.ten;
        oEmail.value = duLieu.email;
        oDT.value = duLieu.dienThoai;
        oDC.value = duLieu.diaChi;
        oGio.value = duLieu.gio;
        baoOk.style.display = 'block';
        setTimeout(function () { baoOk.style.display = 'none'; }, 2600);
      });

      // Trạng thái hệ thống
      var nguon = { lop: 'badge-vang', chu: 'Dữ liệu mẫu' };
      if (Apex.dataSource === 'java') { nguon = { lop: 'badge-xanh', chu: 'Backend Java' }; }
      else if (Apex.dataSource === 'supabase') { nguon = { lop: 'badge-duong', chu: 'Supabase' }; }

      var phien = Apex.layPhien();
      var taiKhoan = phien && phien.hoTen
        ? { lop: 'badge-xanh', chu: Apex.esc(phien.hoTen) }
        : { lop: 'badge-xam', chu: 'Chưa đăng nhập' };

      var dong = function (nhan, lop, chu) {
        return '<div class="dong-tt"><span class="nhan-tt">' + nhan + '</span>' +
          '<span class="badge ' + lop + '"><span class="cham"></span>' + chu + '</span></div>';
      };

      Apex.fill('#trang-thai-ht',
        dong('Nguồn dữ liệu', nguon.lop, nguon.chu) +
        dong('Tài khoản đăng nhập', taiKhoan.lop, taiKhoan.chu) +
        dong('Số sản phẩm', 'badge-xam', Apex.number(Apex.products.length)) +
        dong('Số đơn hàng', 'badge-xam', Apex.number(Apex.orders.length))
      );
    })();
  </script>
</body>
</html>
