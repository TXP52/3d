<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tổng quan</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/apex.css?v=11" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="assets/js/apex.js?v=10"></script>
</head>
<body>
  <div class="apex-khung">
    <div id="apex-sidebar-cho"></div>
    <div class="apex-noi-dung">
      <div id="apex-topbar-cho"></div>
      <main class="apex-trang">

        <!-- KPI -->
        <div class="luoi-kpi" id="kpi"></div>

        <!-- Biểu đồ -->
        <div class="luoi-2">
          <div class="the">
            <div class="the-dau"><div><h3>Doanh thu theo tháng</h3><div class="phu">Đơn vị: triệu đồng</div></div></div>
            <div class="the-than"><div class="khung-bieu-do" id="bd-doanh-thu"></div></div>
          </div>
          <div class="the">
            <div class="the-dau"><div><h3>Tỉ trọng theo trạng thái đơn</h3><div class="phu">Tính trên đơn hàng thật</div></div></div>
            <div class="the-than"><div class="khung-bieu-do" id="bd-trang-thai"></div></div>
          </div>
        </div>

        <!-- Đơn gần nhất + sắp hết hàng -->
        <div class="luoi-2">
          <div class="the">
            <div class="the-dau"><div><h3>Đơn hàng gần nhất</h3></div><a class="nut nut-vien nut-nho" href="don-hang.html">Xem tất cả</a></div>
            <div class="the-than khong-dem bang-cuon">
              <table class="bang">
                <thead><tr><th>Mã đơn</th><th>Khách hàng</th><th class="giua">Trạng thái</th><th class="phai">Tổng tiền</th></tr></thead>
                <tbody id="bang-don-moi"></tbody>
              </table>
            </div>
          </div>
          <div class="the">
            <div class="the-dau"><div><h3>Sắp hết hàng</h3></div><a class="nut nut-vien nut-nho" href="kho.html">Kho</a></div>
            <div class="the-than khong-dem bang-cuon">
              <table class="bang">
                <thead><tr><th>Sản phẩm</th><th class="giua">Tồn</th></tr></thead>
                <tbody id="bang-sap-het"></tbody>
              </table>
            </div>
          </div>
        </div>

      </main>
      <div id="apex-chan-cho"></div>
    </div>
  </div>

  <script>
    Apex.shell('tong-quan', 'Tổng quan');

    (function () {
      var don = Apex.orders;
      var sp = Apex.products;
      var doanhThu = don.reduce(function (s, o) { return s + o.total; }, 0);
      var choXacNhan = don.filter(function (o) { return o.status === 'Chờ xác nhận'; }).length;
      var sapHet = sp.filter(function (p) { return p.stock <= p.min; });

      Apex.fill('#kpi', [
        { nhan: 'Tổng doanh thu (đơn thật)', so: Apex.money(doanhThu), icon: 'fa-wallet', mau: 'bt-xanh' },
        { nhan: 'Tổng đơn hàng', so: Apex.number(don.length) + ' đơn', icon: 'fa-cart-shopping', mau: 'bt-vang' },
        { nhan: 'Chờ xác nhận', so: Apex.number(choXacNhan) + ' đơn', icon: 'fa-clock', mau: choXacNhan ? 'bt-do' : 'bt-toi' },
        { nhan: 'Sản phẩm đang bán', so: Apex.number(sp.length), icon: 'fa-cube', mau: 'bt-toi' }
      ].map(function (k) {
        return '<div class="kpi"><div class="dong-dau"><span class="nhan">' + k.nhan + '</span>' +
          '<span class="bieu-tuong ' + k.mau + '"><i class="fa-solid ' + k.icon + '"></i></span></div>' +
          '<div class="so">' + k.so + '</div></div>';
      }).join(''));

      // Doanh thu theo tháng (số liệu minh hoạ khi DB chưa có lịch sử theo tháng)
      Apex.bieuDoDuong('bd-doanh-thu', Apex.stats.thang, [
        { ten: 'Năm nay', duLieu: Apex.stats.doanhThuNam },
        { ten: 'Năm trước', duLieu: Apex.stats.doanhThuNamTruoc }
      ]);

      // Tỉ trọng trạng thái đơn từ dữ liệu thật
      var dem = {};
      don.forEach(function (o) { dem[o.status] = (dem[o.status] || 0) + 1; });
      Apex.bieuDoTron('bd-trang-thai', Object.keys(dem).map(function (k) { return { name: k, value: dem[k] }; }));

      // Đơn gần nhất
      Apex.fill('#bang-don-moi', don.slice(0, 6).map(function (o) {
        return '<tr><td><strong>' + Apex.esc(o.id) + '</strong></td><td>' + Apex.esc(o.customer) + '</td>' +
          '<td class="giua">' + Apex.badgeTrangThai(o.status) + '</td>' +
          '<td class="phai"><strong>' + Apex.money(o.total) + '</strong></td></tr>';
      }).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--chu-mo);padding:24px;">Chưa có đơn hàng nào.</td></tr>');

      // Sắp hết hàng
      Apex.fill('#bang-sap-het', (sapHet.length ? sapHet : []).slice(0, 6).map(function (p) {
        return '<tr><td><div class="o-ten"><img class="anh-sp" src="' + (Apex.anhDayDu(p.img) || Apex.anhSanPham(p.name)) + '" alt="" />' +
          '<span class="chinh">' + Apex.esc(p.name) + '</span></div></td>' +
          '<td class="giua">' + Apex.badgeTon(p.stock, p.min) + ' <strong>' + p.stock + '</strong></td></tr>';
      }).join('') || '<tr><td colspan="2" style="text-align:center;color:var(--chu-mo);padding:24px;">Kho đang ổn — không có hàng sắp hết.</td></tr>');
    })();
  </script>
</body>
</html>
