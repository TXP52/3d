<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khuyến mãi</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/apex.css?v=30" rel="stylesheet">
  <script src="assets/js/apex.js?v=30"></script>
  <style>
    /* Mã giảm giá: kiểu vé, dễ nhìn ra ngay giữa bảng */
    .ma-km {
      display: inline-block;
      font-family: ui-monospace, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .5px;
      background: repeating-linear-gradient(-45deg, #f6f8fa, #f6f8fa 6px, #eef1f4 6px, #eef1f4 12px);
      border: 1px dashed var(--vien);
      border-radius: 7px;
      padding: 5px 11px;
      color: var(--chu);
    }
    .ma-km.tat { opacity: .55; }
    .dieu-kien { font-size: 12.5px; color: var(--chu-mo); line-height: 1.55; }
    .thanh-luot {
      height: 5px; border-radius: 3px; background: #e9edf1;
      overflow: hidden; margin-top: 5px; min-width: 70px;
    }
    .thanh-luot i { display: block; height: 100%; background: var(--accent-dam); }

    /* Khối "vé" trong hộp thoại chi tiết */
    .ve-km {
      background: linear-gradient(135deg, #101317, #232a33);
      border-radius: var(--radius-nho);
      padding: 18px 20px;
      color: #fff;
      margin-bottom: 16px;
    }
    .ve-km .ma {
      font-family: ui-monospace, monospace;
      font-size: 25px; font-weight: 800; letter-spacing: 2px;
      color: #a3ff12;
    }
    .ve-km .uu-dai { font-size: 14px; margin-top: 6px; color: #cfd5dc; }
    .ve-km .sao-chep {
      background: rgba(255,255,255,.12); color: #fff; border: 0;
      border-radius: 7px; padding: 6px 12px; font-size: 12.5px;
      cursor: pointer; margin-top: 12px;
    }
    .ve-km .sao-chep:hover { background: rgba(255,255,255,.22); }

    /* Nhãn "Tự áp" thay cho mã ở khuyến mãi sản phẩm */
    .tu-ap {
      display: inline-block;
      font-size: 12.5px;
      background: #ffedd5;
      color: #c2410c;
      border: 1px solid #fcd3a8;
      border-radius: 7px;
      padding: 5px 11px;
      white-space: nowrap;
    }

    /* Danh sách tích chọn sản phẩm trong form */
    .thanh-chon-sp {
      display: flex; align-items: center; gap: 8px;
      flex-wrap: wrap; margin-bottom: 8px;
    }
    .nut.nho { padding: 5px 12px; font-size: 12.5px; }
    .dem-sp { font-size: 12.5px; color: var(--chu-mo); margin-left: auto; }
    .luoi-chon-sp {
      max-height: 210px; overflow-y: auto;
      border: 1px solid var(--vien); border-radius: var(--radius-nho);
      background: var(--nen-phu);
    }
    .o-chon-sp {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; font-size: 13.5px; cursor: pointer;
      border-bottom: 1px solid var(--vien);
    }
    .o-chon-sp:last-child { border-bottom: 0; }
    .o-chon-sp:hover { background: var(--the); }
    .o-chon-sp input { width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }
    .o-chon-sp .ten-sp { flex: 1; min-width: 0; }
    .o-chon-sp .gia-sp { color: var(--chu-mo); font-size: 12.5px; white-space: nowrap; }

    /* Bảng giá trước - sau trong hộp thoại chi tiết */
    .ds-sp-giam {
      max-height: 190px; overflow-y: auto;
      border: 1px solid var(--vien); border-radius: var(--radius-nho);
      background: var(--nen-phu); width: 100%;
    }
    .dong-sp-giam {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 7px 12px; font-size: 13px;
      border-bottom: 1px solid var(--vien);
    }
    .dong-sp-giam:last-child { border-bottom: 0; }
    .dong-sp-giam s { color: var(--chu-mo); }
    .dong-sp-giam b { color: var(--accent-dam); }
    .dong-sp-giam .gia-sp-giam { text-align: right; }
    .dong-sp-giam .khach-tra { display: block; font-size: 12px; color: var(--chu-mo); white-space: normal; }

    /* Xem trước giá sau giảm ngay trong form (backend tính, đúng luật giá khách trả) */
    .xem-truoc-gia { margin-top: 10px; }
    .xem-truoc-gia .nhan-xt { font-size: 12.5px; color: var(--chu-mo); margin-bottom: 6px; }
    .xem-truoc-gia .nhan-xt.loi { color: var(--do); }

    /* Danh sách quận trong hộp thoại chi tiết — dài nên cho xuống dòng */
    .ds-khu-vuc {
      display: block;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--chu-mo);
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="apex-khung">
    <div id="apex-sidebar-cho"></div>
    <div class="apex-noi-dung">
      <div id="apex-topbar-cho"></div>
      <main class="apex-trang">

        <div class="luoi-kpi" id="kpi"></div>

        <div class="the">
          <div class="the-dau">
            <div>
              <h3>Chương trình khuyến mãi</h3>
            </div>
            <button class="nut nut-chinh" type="button" onclick="moFormKm(null)">
              <i class="fa-solid fa-plus"></i> Thêm
            </button>
          </div>
          <div class="the-than khong-dem bang-cuon">
            <table class="bang">
              <thead>
                <tr>
                  <th>Mã / Kiểu</th>
                  <th>Chương trình</th>
                  <th>Ưu đãi</th>
                  <th>Điều kiện</th>
                  <th>Thời gian</th>
                  <th class="giua">Lượt dùng</th>
                  <th class="giua">Trạng thái</th>
                </tr>
              </thead>
              <tbody id="bang-km"></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script>
    Apex.shell('khuyen-mai', 'Khuyến mãi');

    var KM = Apex.khuyenMai || [];

    /* Số liệu backend tính sẵn (khoá tk-khuyen-mai) — trang khỏi tải cả đơn hàng lẫn sản phẩm về:
         kpi            : số mã theo đơn / theo sản phẩm / đang chạy, tổng tiền đã giảm
         theoKhuyenMai  : từng chương trình — số đơn đã áp mã, tiền đã giảm theo mã, % lượt đã dùng,
                          bảng giá trước - sau (giảm giá sản phẩm)
         sanPhamChon    : hàng BÁN cho ô tích chọn (hàng mẫu không bán, dịch vụ tính theo gram) */
    var TK = { kpi: {}, theoKhuyenMai: [], sanPhamChon: [] };
    var THEO_KM = {};   // id chương trình -> dòng theoKhuyenMai
    var SP = [];        // [{ id, ten, gia }]

    function docSoLieu() {
      TK = Apex.tk('tk-khuyen-mai') || { kpi: {}, theoKhuyenMai: [], sanPhamChon: [] };
      THEO_KM = {};
      (TK.theoKhuyenMai || []).forEach(function (t) { THEO_KM[t.id] = t; });
      SP = TK.sanPhamChon || [];
    }

    function soLieuKm(id) {
      return THEO_KM[id] || { soDonDaDung: 0, tienGiamTheoMa: 0, phanTramLuot: null, sanPhamGiam: null };
    }

    /* ---------------- KPI ---------------- */

    function veKpi() {
      var kpi = TK.kpi || {};
      Apex.fill('#kpi', [
        { nhan: 'Giảm theo đơn', so: Apex.number(kpi.theoDon || 0) + ' mã', icon: 'fa-receipt', mau: 'bt-toi' },
        { nhan: 'Giảm giá sản phẩm', so: Apex.number(kpi.theoSanPham || 0) + ' chương trình', icon: 'fa-tag', mau: 'bt-tim' },
        { nhan: 'Đang chạy', so: Apex.number(kpi.dangChay || 0) + ' cái', icon: 'fa-circle-play', mau: 'bt-xanh' },
        { nhan: 'Tiền đã giảm', so: Apex.money(kpi.tienDaGiam || 0), icon: 'fa-arrow-trend-down', mau: 'bt-vang' }
      ].map(function (k) {
        return '<div class="kpi"><div class="dong-dau"><span class="nhan">' + k.nhan + '</span>' +
          '<span class="bieu-tuong ' + k.mau + '"><i class="fa-solid ' + k.icon + '"></i></span></div>' +
          '<div class="so">' + k.so + '</div></div>';
      }).join(''));
    }

    /* ---------------- Bảng ---------------- */

    /** Danh sách id sản phẩm của một chương trình, dạng mảng số. */
    function dsId(k) {
      if (!k.sanPhamIds) return [];
      return String(k.sanPhamIds).split(',').map(function (x) {
        return parseInt(x.trim(), 10);
      }).filter(function (x) { return !isNaN(x); });
    }

    function moTaDieuKien(k) {
      var d = [];
      if (k.kieuApDung === 'san_pham') {
        var ids = dsId(k);
        d.push(ids.length ? ids.length + ' sản phẩm được chọn' : 'Mọi sản phẩm');
      } else {
        if (k.donToiThieu > 0) d.push('Đơn từ ' + Apex.money(k.donToiThieu));
        if (k.chiKhachMoi) d.push('<span class="badge badge-tim">Chỉ khách mới</span>');
        if (k.dieuKienDiaChi) d.push('<span class="badge badge-duong">Theo khu vực</span>');
        if (k.apDungCho && k.apDungCho !== 'tat_ca') {
          // Giá trị lạ (sửa tay trên Supabase Dashboard) thì in nguyên chữ, không ra "Chỉ undefined"
          d.push('Chỉ ' + Apex.esc((Apex.apDungCho[k.apDungCho] || {}).ten || k.apDungCho));
        }
      }
      return d.length ? d.join('<br>') : 'Không kèm điều kiện';
    }

    function moTaThoiGian(k) {
      if (!k.batDau && !k.ketThuc) return 'Không giới hạn';
      var b = k.batDau ? Apex.ngayVN(k.batDau) : '…';
      var kt = k.ketThuc ? Apex.ngayVN(k.ketThuc) : '…';
      return b + '<br>→ ' + kt;
    }

    function moTaLuot(k) {
      if (!k.soLuong) return Apex.number(k.daDung || 0) + ' / ∞';
      var pt = soLieuKm(k.id).phanTramLuot || 0;   // backend tính sẵn, tối đa 100
      return Apex.number(k.daDung || 0) + ' / ' + Apex.number(k.soLuong) +
        '<div class="thanh-luot"><i style="width:' + pt + '%"></i></div>';
    }

    function veBang() {
      Apex.fill('#bang-km', KM.map(function (k, i) {
        return '<tr class="hang-bam" onclick="moChiTiet(' + i + ')" title="Bấm để xem chi tiết">' +
          '<td>' + (k.ma
            ? '<span class="ma-km' + (k.trangThai === 'dang_chay' ? '' : ' tat') + '">' +
              Apex.esc(k.ma) + '</span>'
            : '<span class="tu-ap"><i class="fa-solid fa-wand-magic-sparkles"></i> Tự áp</span>') + '</td>' +
          '<td><span class="chinh">' + Apex.esc(k.ten) + '</span>' +
          '<div class="dieu-kien">' + Apex.badgeKieuKm(k.kieuApDung) + '</div></td>' +
          '<td>' + Apex.badgeLoaiKm(k.loai) +
          '<div class="dieu-kien">' + Apex.esc(Apex.moTaUuDai(k)) + '</div></td>' +
          '<td><div class="dieu-kien">' + moTaDieuKien(k) + '</div></td>' +
          '<td><div class="dieu-kien">' + moTaThoiGian(k) + '</div></td>' +
          '<td class="giua"><div class="dieu-kien">' + moTaLuot(k) + '</div></td>' +
          '<td class="giua">' + Apex.badgeTtKm(k.trangThai) + '</td>' +
          '</tr>';
      }).join('') ||
        '<tr><td colspan="7" style="text-align:center;color:var(--chu-mo);padding:28px;">' +
        'Chưa có mã khuyến mãi nào.</td></tr>');
    }

    /* ---------------- Hộp thoại chi tiết ---------------- */

    function moChiTiet(i) {
      var k = KM[i];
      var s = soLieuKm(k.id);   // số đơn đã áp mã + tiền đã giảm theo mã: backend đếm sẵn

      function dong(nhan, giaTri) {
        return '<div class="dong-tt"><span class="nhan">' + nhan + '</span>' +
          '<span class="gt">' + giaTri + '</span></div>';
      }

      var html =
        '<div class="ht-dau">' +
        '<div><h3>' + Apex.esc(k.ten) + '</h3>' +
        '</div>' +
        '<button class="nut-dong" type="button" onclick="dongForm()"><i class="fa-solid fa-xmark"></i></button></div>' +

        '<div class="ht-than">' +
        '<div class="ve-km">' +
        '<div class="ma">' + (k.ma ? Apex.esc(k.ma) : 'TỰ ÁP DỤNG') + '</div>' +
        '<div class="uu-dai">' + Apex.esc(Apex.moTaUuDai(k)) +
        (k.donToiThieu > 0 ? ' · đơn từ ' + Apex.money(k.donToiThieu) : '') + '</div>' +
        (k.ma
          ? '<button class="sao-chep" type="button" data-ma="' + Apex.esc(k.ma) + '" onclick="chepMa(this)">' +
            '<i class="fa-regular fa-copy"></i> Chép mã</button>'
          : '<div class="uu-dai" style="margin-top:10px;">Khách không phải nhập gì — giá món tự trừ sẵn trên web.</div>') +
        '</div>' +

        dong('Kiểu', Apex.badgeKieuKm(k.kieuApDung)) +
        dong('Trạng thái', Apex.badgeTtKm(k.trangThai)) +
        dong('Loại', Apex.badgeLoaiKm(k.loai)) +
        dong('Mức giảm', Apex.esc(Apex.moTaUuDai(k))) +
        (k.kieuApDung === 'san_pham'
          ? dong('Sản phẩm áp dụng', dsSanPhamHtml(s.sanPhamGiam))
          : dong('Đơn tối thiểu', k.donToiThieu > 0 ? Apex.money(k.donToiThieu) : 'Không yêu cầu') +
            dong('Đối tượng', k.chiKhachMoi
              ? '<span class="badge badge-tim">Chỉ khách hàng mới</span>'
              : 'Mọi khách hàng') +
            dong('Khu vực giao', k.dieuKienDiaChi
              ? '<span class="ds-khu-vuc">' + Apex.esc(String(k.dieuKienDiaChi).replace(/,/g, ', ')) + '</span>'
              : 'Giao đâu cũng được') +
            dong('Phạm vi', (Apex.apDungCho[k.apDungCho] || {}).ten || 'Tất cả')) +
        dong('Thời gian', (k.batDau ? Apex.ngayVN(k.batDau) : 'Không giới hạn') + ' → ' +
             (k.ketThuc ? Apex.ngayVN(k.ketThuc) : 'Không giới hạn')) +
        dong('Lượt dùng', Apex.number(k.daDung || 0) + ' / ' +
             (k.soLuong ? Apex.number(k.soLuong) + ' lượt' : 'không giới hạn')) +
        dong('Đơn đã áp mã', Apex.number(s.soDonDaDung || 0) + ' đơn · giảm ' + Apex.money(s.tienGiamTheoMa || 0)) +
        dong('Hiện trên trang chủ', k.hienThi
          ? '<span class="badge badge-xanh">Có</span>'
          : '<span class="badge badge-xam">Không</span>') +
        (k.moTa ? '<div style="margin-top:14px;font-size:13.5px;line-height:1.7;color:var(--chu-mo);">' +
                  Apex.esc(k.moTa) + '</div>' : '') +
        '</div>' +

        '<div class="ht-chan">' +
        '<button class="nut nut-do" type="button" onclick="xoaKm(' + k.id + ', this)">' +
        '<i class="fa-solid fa-trash"></i> Xoá</button>' +
        '<div class="day-phai">' +
        '<button class="nut nut-vien" type="button" onclick="batTat(' + k.id + ',' + (k.hoatDong ? 'true' : 'false') + ', this)">' +
        '<i class="fa-solid fa-' + (k.hoatDong ? 'circle-pause' : 'circle-play') + '"></i> ' +
        (k.hoatDong ? 'Tắt' : 'Bật') + '</button>' +
        '<button class="nut nut-chinh" type="button" onclick="moFormKm(' + i + ')">' +
        '<i class="fa-solid fa-pen"></i> Sửa</button>' +
        '</div></div>';

      Apex.moHopThoai(html);
    }

    /**
     * Bảng giá trước - sau cho chủ shop soát lại (tối đa 12 dòng).
     *   dong : [{ ten, giaGoc, giaSauGiam, ghiChu? }] — giá do backend tính, trang không giữ công thức
     *   tong : tổng số sản phẩm được giảm (có thể nhiều hơn số dòng gửi về)
     */
    function htmlBangGia(dong, tong) {
      if (!tong) return '<span style="color:var(--chu-mo);">Chưa có sản phẩm nào</span>';

      return '<div class="ds-sp-giam">' + dong.slice(0, 12).map(function (p) {
        return '<div class="dong-sp-giam"><span>' + Apex.esc(p.ten) + '</span>' +
          '<span class="gia-sp-giam"><s>' + Apex.money(p.giaGoc) + '</s> ' +
          '<b>' + Apex.money(p.giaSauGiam) + '</b>' + (p.ghiChu || '') + '</span></div>';
      }).join('') +
        (tong > 12 ? '<div class="dong-sp-giam" style="color:var(--chu-mo);">… và ' +
          (tong - 12) + ' sản phẩm nữa</div>' : '') + '</div>';
    }

    /** Sản phẩm một chương trình đã lưu đang giảm — backend tính sẵn trong tk-khuyen-mai (sanPhamGiam). */
    function dsSanPhamHtml(sanPhamGiam) {
      var g = sanPhamGiam || { tong: 0, ds: [] };
      return htmlBangGia(g.ds || [], g.tong || 0);
    }

    function chepMa(nut) {
      var ma = nut.getAttribute('data-ma') || '';
      var xong = function () { nut.innerHTML = '<i class="fa-solid fa-check"></i> Đã chép'; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ma).then(xong, function () {});
      } else {
        // Trình duyệt cũ hoặc trang không chạy trên https
        var o = document.createElement('textarea');
        o.value = ma; document.body.appendChild(o); o.select();
        try { document.execCommand('copy'); xong(); } catch (e) {}
        document.body.removeChild(o);
      }
    }

    function batTat(id, dangBat, nut) {
      // Hộp chi tiết không có ô báo lỗi: lỗi backend hiện toast đỏ
      Apex.dangLuu(nut, Apex.suaKhuyenMai(id, { hoatDong: !dangBat }, dangBat ? 'Đã tạm dừng' : 'Đã bật lại'));
    }

    /* ---------------- Hộp thoại thêm / sửa ---------------- */

    function moFormKm(i) {
      var k = (i === null || i === undefined) ? null : KM[i];
      var moi = !k;

      function chon(map, hienTai, macDinh) {
        return Object.keys(map).map(function (key) {
          var d = hienTai || macDinh;
          return '<option value="' + key + '"' + (key === d ? ' selected' : '') + '>' +
            map[key].ten + '</option>';
        }).join('');
      }

      var idsDaChon = k ? dsId(k) : [];

      var html =
        '<div class="ht-dau">' +
        '<div><h3>' + (moi ? 'Tạo khuyến mãi' : 'Sửa khuyến mãi') + '</h3>' +
        (moi ? '' : '<div class="phu">' + Apex.esc(k.ma || k.ten) + '</div>') + '</div>' +
        '<button class="nut-dong" type="button" onclick="dongForm()"><i class="fa-solid fa-xmark"></i></button></div>' +

        '<div class="ht-than">' +

        '<div class="o-nhap"><label for="f-kieu">Kiểu khuyến mãi</label>' +
        '<select id="f-kieu" onchange="doiKieuApDung()">' +
        chon(Apex.kieuKhuyenMai, k && k.kieuApDung, 'don_hang') + '</select></div>' +

        '<div class="luoi-nhap-2">' +
        '<div class="o-nhap" id="o-ma"><label for="f-ma">Mã khuyến mãi *</label>' +
        '<input type="text" id="f-ma" style="text-transform:uppercase;" ' +
        'value="' + (k ? Apex.esc(k.ma || '') : '') + '" />' +
        '</div>' +
        '<div class="o-nhap"><label for="f-ten">Tên chương trình *</label>' +
        '<input type="text" id="f-ten" ' +
        'value="' + (k ? Apex.esc(k.ten) : '') + '" /></div>' +
        '</div>' +

        '<div class="o-nhap" id="o-san-pham"><label>Sản phẩm được giảm</label>' +
        '<div class="thanh-chon-sp">' +
        '<button type="button" class="nut nut-vien nho" onclick="chonTatCaSp(true)">Chọn tất cả</button>' +
        '<button type="button" class="nut nut-vien nho" onclick="chonTatCaSp(false)">Bỏ chọn hết</button>' +
        '<span class="dem-sp" id="dem-sp"></span>' +
        '</div>' +
        '<div class="luoi-chon-sp" id="luoi-chon-sp">' + htmlChonSp(idsDaChon) + '</div>' +
        '<div class="xem-truoc-gia" id="xem-truoc-gia">' +
        '<div class="nhan-xt">Giá sau giảm (xem trước)</div>' +
        '<div id="bang-xem-truoc"></div></div>' +
        '</div>' +

        '<div class="luoi-nhap-2">' +
        '<div class="o-nhap"><label for="f-loai">Kiểu giảm</label>' +
        '<select id="f-loai" onchange="doiKieuGiam()">' +
        chon(Apex.loaiKhuyenMai, k && k.loai, 'phan_tram') + '</select></div>' +
        '<div class="o-nhap"><label for="f-gia-tri" id="nhan-gia-tri">Mức giảm *</label>' +
        '<input type="number" id="f-gia-tri" min="1" step="1" ' +
        'value="' + (k ? k.giaTri : 10) + '" />' +
        '</div>' +
        '</div>' +

        '<div class="luoi-nhap-2">' +
        '<div class="o-nhap" id="o-giam-toi-da"><label for="f-giam-toi-da">Giảm tối đa</label>' +
        '<input type="number" id="f-giam-toi-da" min="0" step="1000" ' +
        'value="' + (k ? k.giamToiDa : 0) + '" />' +
        '</div>' +
        '<div class="o-nhap" id="o-don-toi-thieu"><label for="f-don-toi-thieu">Đơn tối thiểu</label>' +
        '<input type="number" id="f-don-toi-thieu" min="0" step="1000" ' +
        'value="' + (k ? k.donToiThieu : 0) + '" />' +
        '</div>' +
        '</div>' +

        '<div class="luoi-nhap-2">' +
        '<div class="o-nhap"><label for="f-bat-dau">Bắt đầu</label>' +
        '<input type="date" id="f-bat-dau" value="' + (k && k.batDau ? k.batDau : '') + '" /></div>' +
        '<div class="o-nhap"><label for="f-ket-thuc">Kết thúc</label>' +
        '<input type="date" id="f-ket-thuc" value="' + (k && k.ketThuc ? k.ketThuc : '') + '" />' +
        '</div>' +
        '</div>' +

        '<div class="luoi-nhap-2" id="o-doi-tuong">' +
        '<div class="o-nhap"><label for="f-khach-moi">Đối tượng</label>' +
        '<select id="f-khach-moi">' +
        '<option value="false"' + (!k || !k.chiKhachMoi ? ' selected' : '') + '>Mọi khách hàng</option>' +
        '<option value="true"' + (k && k.chiKhachMoi ? ' selected' : '') + '>Chỉ khách hàng mới</option>' +
        '</select>' +
        '</div>' +
        '<div class="o-nhap"><label for="f-dia-chi">Khu vực giao hàng</label>' +
        '<input type="text" id="f-dia-chi" ' +
        'value="' + (k ? Apex.esc(k.dieuKienDiaChi || '') : '') + '" />' +
        '<div class="goi-y"><a href="#" onclick="dienNoiThanhHN();return false;">Điền 12 quận nội thành Hà Nội</a></div></div>' +
        '</div>' +

        '<div class="luoi-nhap-2">' +
        '<div class="o-nhap" id="o-so-luong"><label for="f-so-luong">Số lượt cho phép</label>' +
        '<input type="number" id="f-so-luong" min="0" step="1" value="' + (k ? k.soLuong : 0) + '" />' +
        '</div>' +
        '<div class="o-nhap" id="o-ap-dung"><label for="f-ap-dung">Áp dụng cho</label>' +
        '<select id="f-ap-dung">' + chon(Apex.apDungCho, k && k.apDungCho, 'tat_ca') + '</select></div>' +
        '</div>' +

        '<div class="luoi-nhap-2">' +
        '<div class="o-nhap"><label for="f-hoat-dong">Trạng thái</label>' +
        '<select id="f-hoat-dong">' +
        '<option value="true"' + (k && k.hoatDong ? ' selected' : '') + '>Bật — khách dùng được</option>' +
        '<option value="false"' + (!k || !k.hoatDong ? ' selected' : '') + '>Tạm dừng</option>' +
        '</select></div>' +
        '<div class="o-nhap"><label for="f-hien-thi">Khoe ở trang chủ</label>' +
        '<select id="f-hien-thi">' +
        '<option value="true"' + (!k || k.hienThi ? ' selected' : '') + '>Có</option>' +
        '<option value="false"' + (k && !k.hienThi ? ' selected' : '') + '>Không</option>' +
        '</select></div>' +
        '</div>' +

        '<div class="o-nhap"><label for="f-mo-ta">Mô tả</label>' +
        '<input type="text" id="f-mo-ta" ' +
        'value="' + (k ? Apex.esc(k.moTa || '') : '') + '" />' +
        '</div>' +

        '<div class="bao-loi" id="loi-form"></div>' +
        '</div>' +

        '<div class="ht-chan">' +
        (moi ? '' : '<button class="nut nut-do" type="button" onclick="xoaKm(' + k.id + ', this)">' +
          '<i class="fa-solid fa-trash"></i> Xoá</button>') +
        '<div class="day-phai">' +
        '<button class="nut nut-vien" type="button" onclick="dongForm()">Huỷ</button>' +
        '<button class="nut nut-chinh" type="button" onclick="luuKm(' + (k ? k.id : 'null') + ', this)">' +
        '<i class="fa-solid fa-floppy-disk"></i> Lưu</button>' +
        '</div></div>';

      KM_DANG_SUA = k ? k.id : null;
      BODY_XEM_TRUOC = '';
      Apex.moHopThoai(html);
      doiKieuApDung();
      doiKieuGiam();

      // Sửa ô nào trong form cũng hẹn xem trước lại giá (chỉ hỏi khi nội dung thật sự đổi)
      var hop = document.querySelector('#lop-phu-chung .hop-thoai');
      if (hop) {
        hop.addEventListener('input', henXemTruoc);
        hop.addEventListener('change', henXemTruoc);
      }
      xemTruocGia();
    }

    /* ---------------- Xem trước giá trong form ----------------
       Giảm giá sản phẩm: đổi mức giảm, sản phẩm, ngày chạy là thấy ngay giá sau giảm.
       Backend tính (POST /api/khuyen-mai/xem-truoc-gia — chỉ tính, không lưu) bằng đúng luật giá
       khách trả, kể cả khi đang có chương trình khác giảm nhiều hơn, nên trang khỏi giữ bản sao
       công thức. Gõ liên tục thì chờ ngừng tay mới hỏi. */

    var KM_DANG_SUA = null;     // id chương trình đang sửa trong form (null = tạo mới)
    var HEN_XEM_TRUOC = null;   // hẹn giờ chờ ngừng gõ
    var LUOT_XEM_TRUOC = 0;     // lượt hỏi mới nhất; kết quả lượt cũ về muộn thì bỏ qua
    var BODY_XEM_TRUOC = '';    // nội dung đã hỏi gần nhất — không đổi thì khỏi hỏi lại

    function henXemTruoc() {
      clearTimeout(HEN_XEM_TRUOC);
      HEN_XEM_TRUOC = setTimeout(xemTruocGia, 350);
    }

    /* MỌI đường ra khỏi hộp thoại phải tắt hẹn giờ: sửa một ô rồi bấm Huỷ / X / Xoá ngay thì
       hẹn giờ vẫn còn, 350ms sau bắn một POST xem-truoc-gia lạc lõng (có lúc chạy song song
       với lệnh xoá). Lưu thì luuKm đã tự tắt. */
    function dongForm() {
      clearTimeout(HEN_XEM_TRUOC);
      Apex.dongHopThoai();
    }

    function xoaKm(id, nut) {
      clearTimeout(HEN_XEM_TRUOC);
      Apex.dangLuu(nut, Apex.xoaKhuyenMai(id));
    }

    function xemTruocGia() {
      var o = document.getElementById('xem-truoc-gia');
      if (!o) return;   // form đã đóng
      var duLieu = docForm();
      // Giảm theo đơn thì khối sản phẩm đang ẩn, không có giá món nào để xem
      if (duLieu.kieuApDung !== 'san_pham') { BODY_XEM_TRUOC = ''; return; }
      if (KM_DANG_SUA) duLieu.id = KM_DANG_SUA;

      var body = JSON.stringify(duLieu);
      if (body === BODY_XEM_TRUOC) return;
      BODY_XEM_TRUOC = body;

      var luot = ++LUOT_XEM_TRUOC;
      var nhan = o.querySelector('.nhan-xt');
      var bang = o.querySelector('#bang-xem-truoc');
      nhan.className = 'nhan-xt';
      nhan.textContent = 'Giá sau giảm (đang tính…)';

      Apex.ghi('POST', '/khuyen-mai/xem-truoc-gia', duLieu).then(function (ds) {
        if (luot !== LUOT_XEM_TRUOC || !document.body.contains(o)) return;
        nhan.textContent = 'Giá sau giảm (xem trước)';
        bang.innerHTML = htmlXemTruoc(ds || []);
      }, function (e) {
        if (luot !== LUOT_XEM_TRUOC || !document.body.contains(o)) return;
        BODY_XEM_TRUOC = '';   // lỗi thì lần sửa sau hỏi lại
        nhan.className = 'nhan-xt loi';
        nhan.textContent = e.message;
        bang.innerHTML = '';
      });
    }

    /** Dòng xem trước: giá của riêng chương trình đang soạn, kèm ghi chú khi khách thật sự trả giá khác. */
    function htmlXemTruoc(ds) {
      var dong = ds.map(function (p) {
        var ghiChu = '';
        if (p.giaKhachTra !== p.giaSauGiam) {
          // Chương trình chưa chạy (tạm dừng / ngoài ngày), hoặc chương trình khác đang giảm nhiều hơn
          ghiChu = '<span class="khach-tra">' + (p.tenKhuyenMaiKhachTra
            ? 'Khách trả ' + Apex.money(p.giaKhachTra) + ' theo "' + Apex.esc(p.tenKhuyenMaiKhachTra) + '"'
            : 'Chưa chạy: khách vẫn trả giá gốc') + '</span>';
        }
        return { ten: p.ten, giaGoc: p.giaGoc, giaSauGiam: p.giaSauGiam, ghiChu: ghiChu };
      });
      return htmlBangGia(dong, dong.length);
    }

    /** 12 quận nội thành Hà Nội — trùng danh sách backend dùng cho mã freeship. */
    var NOI_THANH_HN = 'Ba Đình,Hoàn Kiếm,Hai Bà Trưng,Đống Đa,Tây Hồ,Cầu Giấy,' +
      'Thanh Xuân,Hoàng Mai,Long Biên,Hà Đông,Bắc Từ Liêm,Nam Từ Liêm';

    window.dienNoiThanhHN = function () {
      var o = document.getElementById('f-dia-chi');
      if (o) { o.value = NOI_THANH_HN; o.focus(); }
    };

    /** HTML danh sách tích chọn sản phẩm. */
    function htmlChonSp(idsDaChon) {
      if (!SP.length) {
        return '<div style="color:var(--chu-mo);font-size:13px;padding:10px;">' +
          'Chưa có sản phẩm nào đang bán.</div>';
      }
      return SP.map(function (p) {
        var tich = idsDaChon.indexOf(p.id) >= 0 ? ' checked' : '';
        return '<label class="o-chon-sp">' +
          '<input type="checkbox" class="tich-sp" value="' + p.id + '"' + tich +
          ' onchange="demSpDaChon()" />' +
          '<span class="ten-sp">' + Apex.esc(p.ten) + '</span>' +
          '<span class="gia-sp">' + Apex.money(p.gia) + '</span></label>';
      }).join('');
    }

    window.chonTatCaSp = function (bat) {
      document.querySelectorAll('.tich-sp').forEach(function (o) { o.checked = bat; });
      demSpDaChon();
      henXemTruoc();   // tích bằng code không phát sự kiện change
    };

    window.demSpDaChon = function () {
      var o = document.getElementById('dem-sp');
      if (!o) return;
      var n = document.querySelectorAll('.tich-sp:checked').length;
      o.textContent = n ? 'Đã chọn ' + n + ' sản phẩm' : 'Chưa chọn — áp cho tất cả';
    };

    /**
     * Đổi kiểu thì ẩn/hiện đúng những ô có ý nghĩa với kiểu đó:
     *   theo đơn  -> cần mã, đơn tối thiểu, số lượt, phạm vi
     *   giá món   -> cần danh sách sản phẩm, bỏ hết mấy thứ của đơn hàng
     */
    window.doiKieuApDung = function () {
      var kieu = document.getElementById('f-kieu').value;
      var laSp = kieu === 'san_pham';
      var an = function (id, giau) {
        var o = document.getElementById(id);
        if (o) o.style.display = giau ? 'none' : '';
      };
      an('o-san-pham', !laSp);
      an('o-ma', laSp);
      an('o-don-toi-thieu', laSp);
      an('o-doi-tuong', laSp);
      an('o-so-luong', laSp);
      an('o-ap-dung', laSp);

      // Miễn phí ship là ưu đãi của cả đơn, không trừ vào giá món được
      var oLoai = document.getElementById('f-loai');
      var optShip = oLoai.querySelector('option[value="mien_ship"]');
      if (optShip) {
        optShip.disabled = laSp;
        if (laSp && oLoai.value === 'mien_ship') { oLoai.value = 'phan_tram'; doiKieuGiam(); }
      }
      demSpDaChon();
      henXemTruoc();
    };

    /** Đổi kiểu giảm thì đổi luôn nhãn và ẩn/hiện ô "Giảm tối đa" cho khỏi rối. */
    function doiKieuGiam() {
      var loai = document.getElementById('f-loai').value;
      var nhan = document.getElementById('nhan-gia-tri');
      var oToiDa = document.getElementById('o-giam-toi-da');
      var oGiaTri = document.getElementById('f-gia-tri');

      if (loai === 'phan_tram') {
        nhan.textContent = 'Giảm bao nhiêu phần trăm? *';
        oGiaTri.max = 100;
        oGiaTri.step = 1;
        oToiDa.style.display = '';
      } else if (loai === 'mien_ship') {
        nhan.textContent = 'Miễn phí ship bao nhiêu? *';
        oGiaTri.removeAttribute('max');
        oGiaTri.step = 1000;
        oToiDa.style.display = 'none';
      } else {
        nhan.textContent = 'Giảm bao nhiêu tiền? *';
        oGiaTri.removeAttribute('max');
        oGiaTri.step = 1000;
        oToiDa.style.display = 'none';
      }
    }

    /** Đọc các ô trong form thành đúng object gửi backend — dùng chung cho Lưu và xem trước giá. */
    function docForm() {
      var kieu = document.getElementById('f-kieu').value;
      var laSp = kieu === 'san_pham';
      var loai = document.getElementById('f-loai').value;
      var batDau = document.getElementById('f-bat-dau').value;
      var ketThuc = document.getElementById('f-ket-thuc').value;

      var idsChon = [].slice.call(document.querySelectorAll('.tich-sp:checked'))
        .map(function (o) { return o.value; });

      return {
        kieuApDung: kieu,
        sanPhamIds: laSp ? idsChon.join(',') : '',
        // giảm giá sản phẩm tự áp, không có mã để gõ
        ma: laSp ? '' : document.getElementById('f-ma').value.trim().toUpperCase().replace(/\s+/g, ''),
        ten: document.getElementById('f-ten').value.trim(),
        moTa: document.getElementById('f-mo-ta').value.trim(),
        loai: loai,
        giaTri: parseInt(document.getElementById('f-gia-tri').value, 10) || 0,
        giamToiDa: loai === 'phan_tram' ? (parseInt(document.getElementById('f-giam-toi-da').value, 10) || 0) : 0,
        donToiThieu: parseInt(document.getElementById('f-don-toi-thieu').value, 10) || 0,
        chiKhachMoi: !laSp && document.getElementById('f-khach-moi').value === 'true',
        dieuKienDiaChi: laSp ? '' : document.getElementById('f-dia-chi').value.trim(),
        batDau: batDau || null,
        ketThuc: ketThuc || null,
        soLuong: parseInt(document.getElementById('f-so-luong').value, 10) || 0,
        apDungCho: document.getElementById('f-ap-dung').value,
        hoatDong: document.getElementById('f-hoat-dong').value === 'true',
        hienThi: document.getElementById('f-hien-thi').value === 'true'
      };
    }

    function luuKm(id, nut) {
      clearTimeout(HEN_XEM_TRUOC);   // đang lưu thì khỏi hỏi giá xem trước nữa
      var loi = document.getElementById('loi-form');
      var duLieu = docForm();
      var laSp = duLieu.kieuApDung === 'san_pham';

      if (!laSp) {
        if (!duLieu.ma) { loi.textContent = 'Khuyến mãi theo đơn phải có mã để khách nhập ở giỏ hàng.'; return; }
        if (!/^[A-Z0-9_-]{3,40}$/.test(duLieu.ma)) {
          loi.textContent = 'Mã chỉ gồm chữ HOA không dấu, số, gạch ngang hoặc gạch dưới, dài 3-40 ký tự.';
          return;
        }
      } else if (duLieu.loai === 'mien_ship') {
        loi.textContent = 'Miễn phí ship là ưu đãi của cả đơn, không trừ vào giá từng món được. ' +
          'Đổi sang kiểu "Theo đơn hàng" nhé.';
        return;
      }
      if (!duLieu.ten) { loi.textContent = 'Vui lòng nhập tên chương trình.'; return; }
      if (duLieu.giaTri <= 0) { loi.textContent = 'Mức giảm phải lớn hơn 0.'; return; }
      if (duLieu.loai === 'phan_tram' && duLieu.giaTri > 100) { loi.textContent = 'Giảm theo phần trăm không được quá 100%.'; return; }

      if (duLieu.batDau && duLieu.ketThuc && duLieu.ketThuc < duLieu.batDau) {
        loi.textContent = 'Ngày kết thúc phải sau ngày bắt đầu.';
        return;
      }

      loi.textContent = '';
      // Nút khoá + "Đang lưu…" trong lúc chờ; backend từ chối (vd mã đã có) thì câu lỗi hiện ngay trong form
      Apex.dangLuu(nut, id
        ? Apex.suaKhuyenMai(id, duLieu, 'Đã lưu khuyến mãi')
        : Apex.themKhuyenMai(duLieu, 'Đã tạo khuyến mãi'), loi);
    }

    function veLaiTrang() { docSoLieu(); veKpi(); veBang(); }
    // MỘT request cho cả trang: danh sách khuyến mãi + số liệu tính sẵn (kèm hàng bán cho ô chọn).
    // Apex vẽ khi dữ liệu về và sau mỗi lần ghi.
    Apex.trang({ bo: ['khuyen-mai', 'tk-khuyen-mai'], ve: veLaiTrang });
  </script>
</body>
</html>
