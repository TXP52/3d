<!DOCTYPE html>
<html lang="vi" dir="ltr">

  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Danh sách sản phẩm máy in 3D - IN3D Store">

    <title>Danh sách sản phẩm | IN3D Store</title>

    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicons/favicon-16x16.png">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicons/favicon.ico">
    <meta name="theme-color" content="#ffffff">
    <script src="assets/js/config.js"></script>
    <script src="vendors/overlayscrollbars/OverlayScrollbars.min.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,500,600,700%7cPoppins:300,400,500,600,700,800,900&amp;display=swap" rel="stylesheet">
    <link href="vendors/overlayscrollbars/OverlayScrollbars.min.css" rel="stylesheet">
    <link href="assets/css/theme-rtl.min.css" rel="stylesheet" id="style-rtl">
    <link href="assets/css/theme.min.css" rel="stylesheet" id="style-default">
    <link href="assets/css/user-rtl.min.css" rel="stylesheet" id="user-style-rtl">
    <link href="assets/css/user.min.css" rel="stylesheet" id="user-style-default">
    <link href="assets/css/app3d.css" rel="stylesheet">
    <script>
      var isRTL = JSON.parse(localStorage.getItem('isRTL'));
      if (isRTL) {
        document.getElementById('style-default').setAttribute('disabled', true);
        document.getElementById('user-style-default').setAttribute('disabled', true);
        document.querySelector('html').setAttribute('dir', 'rtl');
      } else {
        document.getElementById('style-rtl').setAttribute('disabled', true);
        document.getElementById('user-style-rtl').setAttribute('disabled', true);
      }
    </script>
    <script src="assets/js/app3d.js"></script>
  </head>

  <body>
    <main class="main" id="top">
      <div class="container" data-layout="container">
        <script>
          var isFluid = JSON.parse(localStorage.getItem('isFluid'));
          if (isFluid) {
            var container = document.querySelector('[data-layout]');
            container.classList.remove('container');
            container.classList.add('container-fluid');
          }
        </script>

        <script>App3D.sidebar('san-pham');</script>

        <div class="content">
          <script>App3D.topbar();</script>

          <script>
            App3D.pageHeader(
              'Danh sách sản phẩm',
              'Toàn bộ máy in 3D, vật tư và linh kiện đang kinh doanh tại cửa hàng.',
              '<a class="btn btn-falcon-default btn-sm me-2" href="kho.html"><span class="fas fa-warehouse me-1"></span>Kho hàng</a>' +
              '<a class="btn btn-primary btn-sm" href="them-san-pham.html"><span class="fas fa-plus me-1"></span>Thêm sản phẩm</a>'
            );
          </script>

          <!-- Thống kê nhanh -->
          <div class="row g-3 mb-3">
            <div class="col-6 col-md-3">
              <div class="card h-100"><div class="card-body text-center">
                <h6 class="text-600 mb-2">Tổng sản phẩm</h6>
                <h4 class="fw-normal text-700 mb-0" id="stat-total">0</h4>
              </div></div>
            </div>
            <div class="col-6 col-md-3">
              <div class="card h-100"><div class="card-body text-center">
                <h6 class="text-600 mb-2">Máy in 3D</h6>
                <h4 class="fw-normal text-700 mb-0" id="stat-machines">0</h4>
              </div></div>
            </div>
            <div class="col-6 col-md-3">
              <div class="card h-100"><div class="card-body text-center">
                <h6 class="text-600 mb-2">Sắp hết hàng</h6>
                <h4 class="fw-normal text-warning mb-0" id="stat-low">0</h4>
              </div></div>
            </div>
            <div class="col-6 col-md-3">
              <div class="card h-100"><div class="card-body text-center">
                <h6 class="text-600 mb-2">Giá trị tồn kho</h6>
                <h4 class="fw-normal text-700 mb-0 fs-1" id="stat-value">0 ₫</h4>
              </div></div>
            </div>
          </div>

          <!-- Bảng sản phẩm -->
          <div class="card mb-3" id="productTable" data-list='{"valueNames":["name","sku","category","price","stock","sold"],"page":10,"pagination":true}'>
            <div class="card-header">
              <div class="row flex-between-center g-2">
                <div class="col-sm-auto">
                  <h6 class="mb-0 text-nowrap py-2 py-xl-0">Bảng sản phẩm</h6>
                </div>
                <div class="col-sm-auto">
                  <div class="row g-2">
                    <div class="col-auto">
                      <div class="input-group input-group-sm">
                        <span class="input-group-text"><span class="fas fa-search"></span></span>
                        <input class="form-control search" type="search" placeholder="Tìm theo tên, mã SKU..." aria-label="Tìm sản phẩm" />
                      </div>
                    </div>
                    <div class="col-auto">
                      <select class="form-select form-select-sm" id="filter-category" aria-label="Lọc theo danh mục">
                        <option value="">Tất cả danh mục</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive scrollbar">
                <table class="table table-sm table-striped fs--1 mb-0 overflow-hidden app3d-table">
                  <thead class="bg-200 text-900">
                    <tr>
                      <th class="sort" data-sort="name">Sản phẩm</th>
                      <th class="sort" data-sort="sku">Mã SKU</th>
                      <th class="sort" data-sort="category">Danh mục</th>
                      <th class="sort text-end" data-sort="price">Giá bán</th>
                      <th class="text-center">Lợi nhuận</th>
                      <th class="sort text-center" data-sort="stock">Tồn kho</th>
                      <th class="sort text-center" data-sort="sold">Đã bán</th>
                      <th class="text-center">Trạng thái</th>
                      <th class="text-end">Thao tác</th>
                    </tr>
                  </thead>
                  <tbody class="list"></tbody>
                </table>
              </div>
              <div class="text-center py-4 fallback d-none">
                <p class="fw-bold fs-1 mb-0">Không tìm thấy sản phẩm nào.</p>
              </div>
            </div>
            <div class="card-footer">
              <div class="d-flex justify-content-center">
                <ul class="pagination mb-0"></ul>
              </div>
            </div>
          </div>
          <script>
            App3D.fill('#productTable tbody.list', App3D.productRows());
          </script>

          <script>App3D.footer();</script>
        </div>
      </div>
    </main>

    <script src="vendors/popper/popper.min.js"></script>
    <script src="vendors/bootstrap/bootstrap.min.js"></script>
    <script src="vendors/is/is.min.js"></script>
    <script src="vendors/fontawesome/all.min.js"></script>
    <script src="vendors/lodash/lodash.min.js"></script>
    <script src="vendors/list.js/list.min.js"></script>
    <script src="assets/js/theme.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var products = App3D.products;
        var machines = products.filter(function (p) { return p.cat.indexOf('Máy in') === 0; });
        var low = products.filter(function (p) { return p.stock <= p.min; });
        var value = products.reduce(function (sum, p) { return sum + p.stock * p.cost; }, 0);

        document.getElementById('stat-total').textContent = App3D.number(products.length);
        document.getElementById('stat-machines').textContent = App3D.number(machines.length);
        document.getElementById('stat-low').textContent = App3D.number(low.length);
        document.getElementById('stat-value').textContent = App3D.money(value);

        // Bộ lọc danh mục
        var select = document.getElementById('filter-category');
        App3D.categories.forEach(function (c) {
          var opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          select.appendChild(opt);
        });
        // Lọc bằng chính ô tìm kiếm của list.js để không phá vỡ phân trang
        var searchInput = document.querySelector('#productTable .search');
        select.addEventListener('change', function () {
          searchInput.value = select.value;
          searchInput.dispatchEvent(new Event('keyup', { bubbles: true }));
        });
      });
    </script>
  </body>

</html>
