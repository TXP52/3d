<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sản phẩm</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/apex.css?v=30" rel="stylesheet">
  <script src="assets/js/cau-hinh.js"></script>
  <!-- Cổng chặn: chưa đăng nhập là chuyển thẳng sang trang đăng nhập, chạy trước apex.js -->
  <script src="assets/js/canh-cong.js?v=1"></script>
    <script src="assets/js/apex.js?v=36"></script>
  <style>
    /* Một sản phẩm in được bằng nhiều cuộn nhựa -> danh sách dòng thêm/bớt được */
    .dau-nhua, .dong-nhua {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 74px 84px 84px 34px;
      gap: 8px;
      align-items: center;
    }
    /* Nhiều màu: số lượng chung ở trên, từng dòng không có cột số cái */
    .khung-nhua.nhieu-mau .dau-nhua,
    .khung-nhua.nhieu-mau .dong-nhua { grid-template-columns: minmax(0, 1fr) 84px 84px 34px; }
    .khung-nhua.nhieu-mau .cot-sl { display: none; }

    .hang-kieu-mau { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 12px; }
    .o-nhap .o-tick {
      display: inline-flex; align-items: center; gap: 8px; margin: 0;
      font-weight: 600; font-size: 13.5px; cursor: pointer;
    }
    .o-nhap .o-tick input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); }
    .o-sl-chung { display: flex; align-items: center; gap: 8px; }
    .o-nhap .o-sl-chung label { display: inline; margin: 0; font-weight: 600; font-size: 13.5px; }
    .o-nhap .o-sl-chung input { width: 100px; margin: 0; }

    /* Điện thoại: ô chọn cuộn nằm một hàng riêng, các ô số xếp hàng dưới */
    @media (max-width: 560px) {
      .dau-nhua, .dong-nhua { grid-template-columns: 1fr 1fr 1fr 34px; }
      .khung-nhua.nhieu-mau .dau-nhua,
      .khung-nhua.nhieu-mau .dong-nhua { grid-template-columns: 1fr 1fr 34px; }
      .dong-nhua .nhua-cuon { grid-column: 1 / -1; }
      .dau-nhua .cot-cuon { display: none; }
      .dong-nhua { padding-bottom: 8px; border-bottom: 1px dashed var(--vien); }
    }
    .dau-nhua {
      font-size: 12px; font-weight: 600; color: var(--chu-mo);
      text-transform: uppercase; letter-spacing: .3px; margin-bottom: 6px;
    }
    .dong-nhua { margin-bottom: 8px; }
    .dong-nhua select, .dong-nhua input { margin: 0; }
    .nut-bo-dong {
      height: 34px; border: 1px solid var(--vien); border-radius: 8px;
      background: var(--the); color: var(--do); cursor: pointer; font-size: 15px;
    }
    .nut-bo-dong:hover { border-color: var(--do); }
    .nut-bo-dong:disabled { opacity: .35; cursor: not-allowed; border-color: var(--vien); }
    .mau-suy-ra { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }
    .tong-nhua { margin-top: 8px; font-size: 13.5px; color: var(--chu-mo); }
    .tong-nhua strong { color: var(--chu); }

    /* Số âm (tồn kho âm vì shop nhận đặt trước khi in) hiện đỏ */
    .so-am, .tom-tat-sua strong.so-am { color: var(--do); }
    .bang td .phu { color: var(--chu-mo); font-size: 12px; }
    .nhan-so-bt { margin-left: 4px; padding: 1px 8px; font-size: 11px; }

    /* Bộ sưu tập: mỗi bộ một chip bấm chọn / bỏ */
    .chon-bst { display: flex; flex-wrap: wrap; gap: 6px; }
    .o-nhap .chip-bst {
      display: inline-flex; align-items: center; gap: 6px; margin: 0;
      padding: 5px 11px; border: 1px solid var(--vien); border-radius: 999px;
      font-weight: 500; font-size: 13px; cursor: pointer; background: var(--the);
    }
    .o-nhap .chip-bst.dang-chon { border-color: var(--accent); background: var(--accent-nhat); color: var(--accent-dam); }
    .o-nhap .chip-bst input { width: 15px; height: 15px; margin: 0; padding: 0; accent-color: var(--accent); }
    .chip-bst .an { color: var(--chu-mo); font-size: 11.5px; }

    /* Phân loại / biến thể. Sản phẩm chưa chia phân loại: form y như cũ (.chi-mot);
       có biến thể: bảng biến thể rộng hết hộp (.chi-nhieu), mỗi biến thể một hàng */
    .ht-than:not(.co-bt) .chi-nhieu { display: none; }
    .ht-than.co-bt .chi-mot { display: none; }
    .hang-them-bt { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: -4px 0 14px; }
    .khoi-bt { border-top: 1px solid var(--vien); padding-top: 14px; margin-top: 4px; }
    .dau-khoi-bt { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .o-nhap .dau-khoi-bt label { margin: 0; font-size: 14px; }
    .dau-bt, .bt-dong {
      display: grid;
      grid-template-columns: 40px minmax(0, 1.5fr) minmax(0, 1.1fr) 96px 76px 104px minmax(0, 1.1fr) 116px 34px 34px;
      gap: 8px; align-items: center;
    }
    .dau-bt {
      font-size: 12px; font-weight: 600; color: var(--chu-mo);
      text-transform: uppercase; letter-spacing: .3px; margin: 10px 0 6px; padding: 0 9px;
    }
    .bt { border: 1px solid var(--vien); border-radius: 10px; padding: 8px; margin-bottom: 8px; }
    .bt.mo { border-color: var(--accent); }
    .o-nhap .bt-dong input, .o-nhap .bt-dong select { margin: 0; padding: 7px 8px; }
    .bt-anh {
      position: relative; width: 40px; height: 40px; padding: 0; overflow: hidden;
      border: 1px dashed var(--vien); border-radius: 8px; background: #f4f5f6;
      color: var(--chu-mo); cursor: pointer; font-size: 15px;
    }
    .bt-anh img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .bt-anh .so-anh {
      position: absolute; right: 2px; bottom: 2px; padding: 0 4px; border-radius: 4px;
      background: rgba(0, 0, 0, .6); color: #fff; font-size: 10px; line-height: 14px;
    }
    .bt-o-mau, .bt-o-so { display: flex; align-items: center; gap: 6px; min-width: 0; }
    /* Ô nhập nằm trong flex: không có min-width 0 thì ô số giữ bề ngang mặc định, tràn khỏi cột */
    .o-nhap .bt-o-mau select, .o-nhap .bt-o-so input { min-width: 0; flex: 1 1 auto; }
    .bt-cham-mau {
      width: 14px; height: 14px; flex-shrink: 0; border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, .18); background: #e4e6e9;
    }
    .nhan-nho { display: none; font-size: 11.5px; font-weight: 600; color: var(--chu-mo); white-space: nowrap; }
    .bt-nut-nhua, .bt-sao {
      height: 34px; border: 1px solid var(--vien); border-radius: 8px; background: var(--the);
      font-family: inherit; cursor: pointer;
    }
    .bt-nut-nhua {
      padding: 0 8px; font-size: 12.5px; color: var(--chu);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .bt-nut-nhua:hover, .bt-anh:hover, .bt-sao:hover { border-color: var(--accent); }
    .bt-sao { color: #c9ced6; font-size: 14px; }
    .bt-sao.dang-chon { color: var(--vang); border-color: var(--vang); background: var(--vang-nhat); }
    .bt-chi-tiet {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr); gap: 16px;
      margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--vien);
    }
    .bt-chi-tiet[hidden] { display: none; }
    .bt-chi-tiet .o-nhap { margin-bottom: 10px; }
    .bt-chi-tiet .bo-anh { margin-bottom: 10px; }
    .nhan-phu { font-weight: 600; font-size: 13px; margin-bottom: 6px; }

    /* Điện thoại: hàng biến thể gập thành vài dòng, mỗi ô số có nhãn nhỏ đứng trước */
    @media (max-width: 760px) {
      .dau-bt { display: none; }
      .bt-dong {
        grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 34px 34px;
        grid-template-areas: "anh ten ten sao xoa" "mau mau gia gia gia" "ton ton gio gio gio" "tt tt nhua nhua nhua";
      }
      .bt-dong .bt-anh { grid-area: anh; }
      .bt-dong .bt-ten { grid-area: ten; }
      .bt-dong .bt-o-mau { grid-area: mau; }
      .bt-dong .bt-o-gia { grid-area: gia; }
      .bt-dong .bt-o-ton { grid-area: ton; }
      .bt-dong .bt-o-gio { grid-area: gio; }
      .bt-dong .bt-tt { grid-area: tt; }
      .bt-dong .bt-nut-nhua { grid-area: nhua; }
      .bt-dong .bt-sao { grid-area: sao; }
      .bt-dong .bt-xoa { grid-area: xoa; }
      .nhan-nho { display: inline; }
      .bt-chi-tiet { grid-template-columns: minmax(0, 1fr); }
    }

    /* Tên + mã sản phẩm chung một hàng; điện thoại thì xếp chồng */
    .hang-ten-ma { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 0 16px; }
    @media (max-width: 560px) { .hang-ten-ma { grid-template-columns: minmax(0, 1fr); } }

    /* Thời gian in một cái = giờ + phút */
    .o-gio-phut { display: flex; align-items: center; gap: 6px; }
    .o-nhap .o-gio-phut input { flex: 1 1 0; min-width: 0; }
    .o-gio-phut span { font-size: 13px; color: var(--chu-mo); white-space: nowrap; }
    /* Cột "Giờ in" của bảng biến thể: hai ô nhỏ giờ | phút, bỏ nút tăng giảm cho đủ chỗ */
    .o-nhap .bt-o-gio input { flex: 1 1 0; padding-left: 6px; padding-right: 6px; -moz-appearance: textfield; }
    .bt-o-gio input::-webkit-outer-spin-button,
    .bt-o-gio input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    /* Bấm ảnh nhỏ nào thì ảnh to bên trái hiện ảnh đó */
    #than-form-sp .o-bo-anh img { cursor: zoom-in; }
    #than-form-sp .o-bo-anh.dang-xem { outline: 2px solid var(--accent-dam); outline-offset: 2px; }
    .dai-anh-bt { margin: -4px 0 14px; }
    .dai-anh-bt[hidden] { display: none; }
    .dai-anh-bt .dai-anh-nho { margin-top: 0; }
    .dai-anh-bt .dai-anh-nho img { cursor: zoom-in; }
  </style>
</head>
<body>
  <div class="apex-khung">
    <div id="apex-sidebar-cho"></div>
    <div class="apex-noi-dung">
      <div id="apex-topbar-cho"></div>
      <main class="apex-trang">

        <!-- KPI sản phẩm -->
        <div class="luoi-kpi" id="kpi"></div>

        <!-- Bảng sản phẩm -->
        <div class="the">
          <div class="the-dau">
            <div>
              <h3>Tất cả sản phẩm</h3>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
              <select id="loc-danh-muc" class="nut nut-vien" style="padding:7px 10px;" onchange="veBang()">
                <option value="">Tất cả danh mục</option>
              </select>
              <select id="loc-trang-thai" class="nut nut-vien" style="padding:7px 10px;" onchange="veBang()">
                <option value="">Tất cả trạng thái</option>
              </select>
              <button class="nut nut-chinh" type="button" onclick="moFormSanPham(null)">
                <i class="fa-solid fa-plus"></i> Thêm
              </button>
            </div>
          </div>
          <div class="the-than khong-dem bang-cuon">
            <table class="bang">
              <thead>
                <tr>
                  <th>Sản phẩm</th>
                  <th>Danh mục</th>
                  <th>Màu</th>
                  <th class="giua">Loại</th>
                  <th class="giua">Trạng thái</th>
                  <th class="giua">Hiển thị</th>
                  <th class="phai">Giá bán</th>
                  <th class="giua">SL in</th>
                  <th class="giua">Nhựa đã dùng</th>
                  <th class="giua">Tồn kho</th>
                  <th class="phai">Giá trị tồn</th>
                </tr>
              </thead>
              <tbody id="bang-san-pham"></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script>
    Apex.shell('san-pham', 'Danh sách sản phẩm');

    var SP = Apex.products;

    /* Số liệu tổng hợp backend tính sẵn (khoá tk-san-pham): KPI, số đếm của hai bộ lọc,
       giá trị tồn và mức tồn từng dòng. Trước đây trang tự đếm / cộng trên cả danh sách. */
    var TK = {};
    var TK_THEO_SP = {};   // id sản phẩm -> { giaTriTon, mucTon }

    function docThongKe() {
      TK = Apex.tk('tk-san-pham') || {};
      TK_THEO_SP = {};
      (TK.theoSanPham || []).forEach(function (x) { TK_THEO_SP[x.id] = x; });
    }

    /* Bản GỐC backend trả (khoá san-pham), tra theo id. Apex.products chỉ giữ các trường cũ;
       biến thể, khoảng giá giaTu–giaDen và bộ sưu tập của sản phẩm đọc ở đây. */
    var SP_GOC = {};
    var BO_SUU_TAP = [];        // mọi bộ sưu tập chưa xoá (kể cả đang ẩn) — cho ô chọn trong form
    var CO_BIEN_THE = true;     // backend có trả bienThe không; bản cũ thì form giữ y như trước

    function docDuLieuGoc() {
      var ds = Apex.tk('san-pham') || [];
      SP_GOC = {};
      ds.forEach(function (s) { SP_GOC[s.id] = s; });
      CO_BIEN_THE = !ds.length || Array.isArray(ds[0].bienThe);
      BO_SUU_TAP = Apex.tk('bo-suu-tap') || [];
    }

    /* Nhãn mức tồn theo mucTon backend suy sẵn (≤ 0 hết, ≤ 5 sắp hết) — cùng kiểu Apex.badgeTon */
    var NHAN_MUC_TON = {
      het_hang: '<span class="badge badge-do">Hết hàng</span>',
      sap_het: '<span class="badge badge-vang">Sắp hết</span>',
      con_hang: '<span class="badge badge-xanh">Còn hàng</span>'
    };
    function badgeMucTon(muc) { return NHAN_MUC_TON[muc] || NHAN_MUC_TON.con_hang; }

    /* Chuỗi JS an toàn khi nhét vào thuộc tính onclick="..." */
    function jsStr(s) { return JSON.stringify(String(s == null ? '' : s)).replace(/"/g, '&quot;'); }

    /* Nhựa cho một cái. Mấy dòng in khác gram nhau thì ghi thành khoảng. */
    function gramMoiCaiChu(p) {
      var a = p.gramMoiCaiMin || 0, b = p.gramMoiCaiMax || 0;
      if (!b) return '';
      return a === b ? Apex.number(a) + 'g' : Apex.number(a) + '–' + Apex.number(b) + 'g';
    }

    /* ---------------- Mã sản phẩm, thời gian in, tiền máy ---------------- */

    /** Tiền máy mỗi giờ in (khoá chi-phi-may, backend tính); backend cũ chưa có khoá này thì null. */
    function tienMayMoiGio() {
      var cp = Apex.tk('chi-phi-may');
      return cp && typeof cp.tongMoiGio === 'number' ? cp.tongMoiGio : null;
    }

    /** 90 -> "1 giờ 30 phút", 45 -> "45 phút", 120 -> "2 giờ". */
    function chuThoiGian(phut) {
      phut = Math.max(0, Math.round(phut || 0));
      var g = Math.floor(phut / 60), p = phut % 60;
      if (!g) return Apex.number(p) + ' phút';
      return Apex.number(g) + ' giờ' + (p ? ' ' + p + ' phút' : '');
    }

    /** Phần giờ / phần phút để điền vào hai ô; bằng 0 thì để trống (ô hiện chữ mờ). */
    function soGio(phut) { var g = Math.floor((phut || 0) / 60); return g ? g : ''; }
    function soPhut(phut) { var p = (phut || 0) % 60; return p ? p : ''; }

    /**
     * Hai ô giờ + phút -> số phút in MỘT cái (nguyên). Ô trống = 0; giờ lẻ (1,5) được.
     * Số âm hoặc gõ không ra số -> NaN để kiemTraBienThe báo lỗi trước khi gửi.
     */
    function phutTuHaiO(oGio, oPhut) {
      if (!oGio || !oPhut) return 0;
      if ((oGio.validity && oGio.validity.badInput) || (oPhut.validity && oPhut.validity.badInput)) return NaN;
      var g = oGio.value.trim(), p = oPhut.value.trim();
      var gio = g === '' ? 0 : parseFloat(g), phut = p === '' ? 0 : parseFloat(p);
      if (isNaN(gio) || isNaN(phut) || gio < 0 || phut < 0) return NaN;
      return Math.round(gio * 60 + phut);
    }

    /* ---------------- Biến thể: tiện ích dùng chung cho bảng và form ---------------- */

    /** Biến thể của sản phẩm (mặc định đứng đầu, backend xếp sẵn); rỗng nếu backend chưa có biến thể. */
    function bienTheCua(p) {
      var goc = p ? SP_GOC[p.dbId] : null;
      return (goc && goc.bienThe) || [];
    }

    /** Biến thể "trơn": không tên, không màu, không giá / trạng thái / ảnh / mã riêng. */
    function laBienTheTron(b) {
      return !b.ten && !b.mauSacId && (b.gia === null || b.gia === undefined) &&
        !b.trangThai && !b.maSku && !(b.danhSachAnh && b.danhSachAnh.length);
    }

    /** Chưa chia phân loại = nhiều nhất một biến thể và biến thể đó trơn -> form, bảng y như trước. */
    function chuaChiaPhanLoai(ds) {
      return ds.length === 0 || (ds.length === 1 && laBienTheTron(ds[0]));
    }

    function tenBienThe(b, i) {
      return b.ten || (b.macDinh ? 'Mặc định' : 'Biến thể ' + (i + 1));
    }

    /** Số tồn kho, âm thì đỏ. */
    function soTon(n, the) {
      the = the || 'strong';
      return '<' + the + (n < 0 ? ' class="so-am"' : '') + '>' + Apex.number(n) + '</' + the + '>';
    }

    /** Giá trên bảng: các biến thể cùng giá thì một số, khác nhau thì khoảng "50.000 – 100.000 ₫". */
    function giaBanChu(p) {
      var goc = SP_GOC[p.dbId];
      var tu = goc && goc.giaTu != null ? goc.giaTu : (p.price || 0);
      var den = goc && goc.giaDen != null ? goc.giaDen : tu;
      return tu === den ? Apex.money(tu) : Apex.number(tu) + ' – ' + Apex.money(den);
    }

    /** Dòng nhỏ dưới tổng tồn kho: tồn từng biến thể (tối đa 3), biến thể tồn âm đỏ. */
    function tonTungBienThe(ds) {
      if (chuaChiaPhanLoai(ds)) return '';
      var hien = ds.slice(0, 3).map(function (b, i) {
        return Apex.esc(tenBienThe(b, i)) + ' ' + soTon(b.tonKho || 0, 'span');
      });
      if (ds.length > 3) hien.push('…');
      return '<div class="phu">' + hien.join(' · ') + '</div>';
    }

    /* ---------------- KPI ---------------- */

    function veKpi() {
      Apex.fill('#kpi', [
        { nhan: 'Tổng sản phẩm', so: Apex.number(TK.tong) + ' sản phẩm', icon: 'fa-cubes', mau: 'bt-toi' },
        { nhan: 'Đang hiển thị', so: Apex.number(TK.dangHien) + ' sản phẩm', icon: 'fa-circle-check', mau: 'bt-xanh' },
        { nhan: 'Đang in', so: Apex.number(TK.dangIn) + ' sản phẩm', icon: 'fa-print', mau: TK.dangIn ? 'bt-vang' : 'bt-toi' },
        { nhan: 'Giá trị tồn kho', so: Apex.money(TK.giaTriTon), icon: 'fa-warehouse', mau: 'bt-vang' }
      ].map(function (k) {
        return '<div class="kpi"><div class="dong-dau"><span class="nhan">' + k.nhan + '</span>' +
          '<span class="bieu-tuong ' + k.mau + '"><i class="fa-solid ' + k.icon + '"></i></span></div>' +
          '<div class="so">' + k.so + '</div></div>';
      }).join(''));
    }

    /* ---------------- Bảng ---------------- */

    function veLocTrangThai() {
      var el = document.getElementById('loc-trang-thai');
      var dangChon = el.value;
      var dem = TK.theoTrangThai || {};
      el.innerHTML = '<option value="">Tất cả trạng thái</option>' +
        Object.keys(Apex.ttSanPham).map(function (k) {
          return '<option value="' + k + '">' + Apex.ttSanPham[k].ten + ' (' + (dem[k] || 0) + ')</option>';
        }).join('');
      el.value = dangChon;
    }

    function veLocDanhMuc() {
      var el = document.getElementById('loc-danh-muc');
      var dangChon = el.value;
      // theoDanhMuc = các danh mục sản phẩm theo đúng thứ tự bảng danh mục, kèm số sản phẩm
      el.innerHTML = '<option value="">Tất cả danh mục</option>' +
        (TK.theoDanhMuc || []).map(function (d) {
          return '<option value="' + d.danhMucId + '">' + Apex.esc(d.ten) + ' (' +
            (d.soSanPham || 0) + ')</option>';
        }).join('') +
        '<option value="chua">Chưa phân loại (' + (TK.chuaPhanLoai || 0) + ')</option>';
      el.value = dangChon;
    }

    function veBang() {
      var loc = document.getElementById('loc-trang-thai').value;
      var locDm = document.getElementById('loc-danh-muc').value;
      var html = SP.map(function (p, i) { return { p: p, i: i }; })
        .filter(function (x) { return !loc || x.p.trangThai === loc; })
        .filter(function (x) {
          if (!locDm) return true;
          if (locDm === 'chua') return !x.p.danhMucId;
          return String(x.p.danhMucId) === locDm;
        })
        .map(function (x) {
          var p = x.p;
          var tkDong = TK_THEO_SP[p.dbId] || {};
          var dsBt = bienTheCua(p);
          // Đã chia phân loại thì kèm nhãn "n biến thể" dưới mã sản phẩm
          var nhanBt = chuaChiaPhanLoai(dsBt) ? ''
            : ' <span class="badge badge-xam nhan-so-bt"><i class="fa-solid fa-layer-group"></i>' +
              dsBt.length + ' biến thể</span>';
          var hienThi = (p.cat === 'Đang bán')
            ? '<span class="badge badge-xanh"><span class="cham"></span> Đang bán</span>'
            : '<span class="badge badge-xam"><span class="cham"></span> Đang ẩn</span>';
          return '<tr class="hang-bam" onclick="moFormSanPham(' + x.i + ')">' +
            '<td><div class="o-ten"><img class="anh-sp" src="' + (Apex.anhDayDu(p.img) || Apex.anhSanPham(p.name)) + '" alt="" ' +
            'onerror="this.src=\'' + Apex.anhSanPham(p.name) + '\'" />' +
            '<div><div class="chinh">' + Apex.esc(p.name) + '</div>' +
            '<div class="phu">Mã: ' + Apex.esc(p.sku) + nhanBt + '</div></div></div></td>' +
            '<td>' + Apex.badgeDanhMuc(p.danhMucId) + '</td>' +
            // Màu = màu khai của các biến thể + màu cuộn nhựa đã in (backend gộp sẵn)
            '<td>' + Apex.mauSanPham(p, 13) + '</td>' +
            '<td class="giua">' + Apex.badgeLoaiSanPham(p.loaiSanPham) + '</td>' +
            '<td class="giua">' + Apex.badgeTtSanPham(p.trangThai) + '</td>' +
            '<td class="giua">' + hienThi + '</td>' +
            '<td class="phai"><strong>' + giaBanChu(p) + '</strong></td>' +
            '<td class="giua">' + (p.soLuong
              ? Apex.number(p.soLuong)
              : '<span style="color:var(--chu-mo)">—</span>') + '</td>' +
            '<td class="giua">' + (p.tongGramNhua
              ? '<strong>' + Apex.number(p.tongGramNhua) + 'g</strong>' +
                (p.soLuong > 1 ? '<div class="phu">' + gramMoiCaiChu(p) + '/cái</div>' : '')
              : '<span style="color:var(--chu-mo)">—</span>') + '</td>' +
            // Tồn kho = tổng các biến thể; có thể âm (nhận đặt trước khi in) -> số đỏ
            '<td class="giua">' + badgeMucTon(tkDong.mucTon) + ' ' + soTon(p.stock || 0) +
            tonTungBienThe(dsBt) + '</td>' +
            '<td class="phai">' + Apex.money(tkDong.giaTriTon) + '</td>' +
            '</tr>';
        }).join('');

      Apex.fill('#bang-san-pham', html ||
        '<tr><td colspan="11" style="text-align:center;color:var(--chu-mo);padding:28px;">' +
        ((loc || locDm) ? 'Không có sản phẩm nào khớp bộ lọc.' : 'Chưa có sản phẩm nào.') +
        '</td></tr>');
    }

    /* ---------------- Hộp thoại XEM + SỬA: bấm dòng nào mở dòng đó, sửa xong bấm Lưu ---------------- */

    var layAnh = null;
    /* Cuộn nhựa -> số gram sản phẩm ĐANG mở đã trừ ở cuộn đó (cộng mọi biến thể, xem moFormSanPham) */
    var GRAM_DA_TRU = {};

    /* Biến thể trên form theo đúng thứ tự đang hiện: { k, id, macDinh }. k là khoá riêng của form
       (biến thể mới chưa có id database); mọi số liệu khác đọc thẳng trên ô nhập lúc cần. */
    var BT = [];
    var SO_KHOA_BT = 0;
    var LAY_ANH_BT = {};        // k -> hàm lấy danh sách ảnh riêng của biến thể
    var TON_BAN_DAU = {};       // k -> tồn kho lúc mở form (tồn âm do đơn hàng thì lưu lại được)
    var CHE_DO_NHIEU = false;   // false = form một biến thể y như cũ; true = bảng biến thể
    /* Biến thể + bộ sưu tập đọc lại từ chính form ngay lúc mở: lúc lưu so với bản này để biết
       chủ shop có đụng vào không — không đụng thì KHỎI gửi (cùng mẹo với vatTus bên dưới). */
    var BT_BAN_DAU = [];
    var BST_BAN_DAU = '';
    /* Tiền máy / giá vốn backend đã tính cho sản phẩm đang mở. Chưa đụng vào số cái, nhựa hay
       giờ in thì dải tóm tắt hiện đúng số này (số của backend là số chuẩn); đụng vào thì tính
       thử bằng JS theo đúng công thức SanPhamDto.kemChiPhiMay, lưu xong backend tính lại. */
    var SO_MAY_GOC = null;
    var CHU_KY_MAY_GOC = null;   // chuKyMay lúc mở form; null = đang dựng form, chưa so được

    function khoiBt(k) { return document.querySelector('.bt[data-k="' + k + '"]'); }
    function khungNhuaCua(k) { return document.querySelector('.nhua-bt[data-k="' + k + '"]'); }
    function dsKhungNhua() { return Array.prototype.slice.call(document.querySelectorAll('.nhua-bt')); }

    function moFormSanPham(i) {
      var p = (i === null || i === undefined) ? null : SP[i];
      var moi = !p;

      var dsBt = bienTheCua(p);
      if (!dsBt.length) {
        // Sản phẩm mới (hoặc backend chưa có biến thể): một biến thể mặc định trơn mang đúng
        // số liệu cũ của sản phẩm — backend cũng tự dựng y như vậy khi nhận form kiểu cũ
        dsBt = [{
          id: null, ten: null, macDinh: true, gia: null, trangThai: null, mauSacId: null,
          tonKho: p ? (p.stock || 0) : 0, soLuong: p ? (p.soLuong || 1) : 1, thoiGianInPhut: 0,
          nhieuMau: p ? !!p.nhieuMau : false, vatTus: p ? (p.vatTus || []) : [], danhSachAnh: []
        }];
      }
      CHE_DO_NHIEU = !chuaChiaPhanLoai(dsBt);
      var tongTon = dsBt.reduce(function (s, b) { return s + (b.tonKho || 0); }, 0);
      var phutMot = dsBt[0].thoiGianInPhut || 0;   // giờ in của biến thể duy nhất (form một biến thể)

      var goc = p ? SP_GOC[p.dbId] : null;
      SO_MAY_GOC = goc && typeof goc.tienMay === 'number' ? goc : null;
      // Sản phẩm mới: ô mã trống = backend tự sinh; sản phẩm cũ: điền sẵn mã đang dùng (p.sku)
      var maDangCo = p ? p.sku : '';

      var chonTt = Object.keys(Apex.ttSanPham).map(function (k) {
        var macDinh = p ? p.trangThai : 'san_hang';
        return '<option value="' + k + '"' + (k === macDinh ? ' selected' : '') + '>' +
          Apex.ttSanPham[k].ten + '</option>';
      }).join('');

      var chonLoai = Object.keys(Apex.loaiSanPham).map(function (k) {
        var macDinh = p ? (p.loaiSanPham || 'ban') : 'ban';
        return '<option value="' + k + '"' + (k === macDinh ? ' selected' : '') + '>' +
          Apex.loaiSanPham[k].ten + '</option>';
      }).join('');

      var chonDm = '<option value="">— Chưa phân loại —</option>' + Apex.danhMucSanPham().map(function (d) {
        return '<option value="' + d.id + '"' + (p && p.danhMucId === d.id ? ' selected' : '') + '>' +
          Apex.esc(d.ten) + '</option>';
      }).join('');

      /* Nhựa: một sản phẩm in được bằng nhiều cuộn nên đây là danh sách dòng.
         GRAM_DA_TRU nhớ phần sản phẩm này ĐANG trừ ở mỗi cuộn (mọi biến thể cộng lại — backend
         cũng tính chênh lệch trên cả sản phẩm), để ô "còn ...g" cộng lại phần đó — nếu không
         thì sửa lại chính nó sẽ thấy thiếu nhựa. */
      GRAM_DA_TRU = {};
      (p ? p.vatTus || [] : []).forEach(function (v) {
        // tongGram đã nhân sẵn số lượng — đây mới là phần kho đang giữ cho sản phẩm này.
        // (Bản cũ đọc v.daTru, API không có trường đó nên luôn cộng 0 và ô "còn ...g" báo thiếu.)
        GRAM_DA_TRU[v.vatTuId] = (GRAM_DA_TRU[v.vatTuId] || 0) + (v.tongGram || 0);
      });

      var html =
        '<div class="ht-dau">' +
        '<div><h3>' + (moi ? 'Thêm sản phẩm mới' : Apex.esc(p.name)) + '</h3>' +
        (moi ? '' : '<div class="phu">Mã ' + Apex.esc(p.sku) + '</div>') + '</div>' +
        '<button class="nut-dong" type="button" onclick="Apex.dongHopThoai()" aria-label="Đóng">' +
        '<i class="fa-solid fa-xmark"></i></button></div>' +

        '<div class="ht-than" id="than-form-sp"><div class="ct-2cot">' +
        // Cột trái: ảnh to (bấm ảnh nhỏ nào hiện ảnh đó) + chỗ thêm / bỏ / đổi thứ tự ảnh,
        // ảnh riêng của các biến thể, rồi mô tả
        '<div class="cot-anh">' +
        '<img class="anh-chi-tiet" id="sp-anh-lon" alt="" src="' +
        Apex.esc((p && Apex.anhDayDu(p.img)) || Apex.anhSanPham()) + '" />' +
        Apex.htmlBoAnh('sp-anh') +
        '<div class="dai-anh-bt" id="dai-anh-bt" hidden><div class="nhan-phu">Ảnh biến thể</div>' +
        '<div class="dai-anh-nho" id="dai-anh-bt-ds"></div></div>' +
        '<div class="o-nhap"><label for="f-mota">Mô tả</label>' +
        '<textarea id="f-mota" rows="3">' +
        (p ? Apex.esc(p.moTa || '') : '') + '</textarea></div>' +
        '</div>' +
        // Cột phải: toàn bộ thông tin, sửa thẳng tại chỗ
        '<div>' +
        '<div class="hang-ten-ma">' +
        '<div class="o-nhap"><label for="f-ten">Tên sản phẩm *</label>' +
        '<input type="text" id="f-ten" value="' +
        (p ? Apex.esc(p.name) : '') + '" /></div>' +
        '<div class="o-nhap"><label for="f-ma">Mã sản phẩm</label>' +
        '<input type="text" id="f-ma" maxlength="40" autocomplete="off" spellcheck="false" value="' +
        Apex.esc(maDangCo) + '" /></div>' +
        '</div>' +
        '<div class="luoi-nhap-2">' +
        '<div class="o-nhap"><label for="f-gia">Giá bán (VNĐ)</label>' +
        '<input type="number" id="f-gia" min="0" step="1000" value="' + (p ? (p.price || 0) : 0) + '" /></div>' +
        // Có biến thể thì ô này chỉ hiện TỔNG tồn các biến thể (sửa ở từng hàng biến thể)
        '<div class="o-nhap"><label for="f-ton" id="nhan-f-ton">Tồn kho</label>' +
        '<input type="number" id="f-ton" step="1"' + (!CHE_DO_NHIEU && dsBt[0].tonKho >= 0 ? ' min="0"' : '') +
        ' value="' + (CHE_DO_NHIEU ? tongTon : (dsBt[0].tonKho || 0)) + '" /></div>' +
        // Chưa chia phân loại: giờ in của biến thể duy nhất; có biến thể thì mỗi hàng một cột "Giờ in"
        '<div class="o-nhap chi-mot"><label for="f-gio-in">Thời gian in / cái</label>' +
        '<div class="o-gio-phut">' +
        '<input type="number" id="f-gio-in" min="0" step="1" aria-label="Số giờ in một cái" value="' +
        soGio(phutMot) + '" /><span>giờ</span>' +
        '<input type="number" id="f-phut-in" min="0" step="1" aria-label="Số phút in một cái" value="' +
        soPhut(phutMot) + '" /><span>phút</span></div></div>' +
        '<div class="o-nhap"><label for="f-danh-muc">Danh mục</label>' +
        '<select id="f-danh-muc">' + chonDm + '</select>' +
        '</div>' +
        '<div class="o-nhap"><label for="f-loai">Loại sản phẩm</label>' +
        '<select id="f-loai">' + chonLoai + '</select>' +
        '</div>' +
        '<div class="o-nhap"><label for="f-tt">Trạng thái</label>' +
        '<select id="f-tt">' + chonTt + '</select></div>' +
        '<div class="o-nhap"><label for="f-ban">Hiển thị trên website</label>' +
        '<select id="f-ban">' +
        '<option value="true"' + (!p || p.dangBan ? ' selected' : '') + '>Đang bán</option>' +
        '<option value="false"' + (p && !p.dangBan ? ' selected' : '') + '>Đang ẩn</option>' +
        '</select></div>' +
        '</div>' +
        htmlChonBoSuuTap(p) +
        // Chưa chia phân loại: ô nhựa của biến thể duy nhất nằm đây, y như form cũ (datCheDo)
        '<div class="o-nhap chi-mot" id="o-nhua-mot"><label>Nhựa đã dùng</label>' +
        '<div id="cho-nhua-mot"></div></div>' +
        (CO_BIEN_THE
          ? '<div class="hang-them-bt chi-mot">' +
            '<button type="button" class="nut nut-vien nut-nho" onclick="themBienThe()">' +
            '<i class="fa-solid fa-layer-group"></i> Thêm biến thể</button></div>'
          : '') +
        '</div></div>' +

        // Bảng biến thể: rộng hết hộp, chỉ hiện khi sản phẩm đã chia phân loại
        '<div class="o-nhap khoi-bt chi-nhieu">' +
        '<div class="dau-khoi-bt"><label>Phân loại / Biến thể</label>' +
        '<button type="button" class="nut nut-vien nut-nho" onclick="themBienThe()">' +
        '<i class="fa-solid fa-plus"></i> Thêm biến thể</button></div>' +
        '<div class="dau-bt"><span>Ảnh</span><span>Tên</span><span>Màu</span><span>Giá</span><span>Tồn kho</span>' +
        '<span>Giờ in</span><span>Trạng thái</span><span>Nhựa</span><span title="Mặc định">★</span><span></span></div>' +
        '<div id="ds-bt"></div>' +
        '</div>' +

        '<div class="tom-tat-sua" id="tom-tat-sp"></div>' +
        '<div class="bao-loi" id="loi-form"></div>' +
        '</div>' +

        '<div class="ht-chan">' +
        (moi ? '' : '<button class="nut nut-do" type="button" onclick="Apex.dangLuu(this, Apex.xoaSanPham(' + p.dbId + ', ' +
          jsStr(p.name) + '))"><i class="fa-solid fa-trash"></i> Xoá</button>') +
        '<div class="day-phai">' +
        '<button class="nut nut-vien" type="button" onclick="Apex.dongHopThoai()">Huỷ</button>' +
        '<button class="nut nut-chinh" type="button" onclick="luuForm(' + (p && p.dbId ? p.dbId : 'null') + ', this)">' +
        '<i class="fa-solid fa-floppy-disk"></i> Lưu</button>' +
        '</div></div>';

      Apex.moHopThoai(html, 'rong-lon');
      // Xoá biến thể của lần mở trước TRƯỚC khi gắn bộ ảnh: hàm vẽ dải ảnh biến thể chạy ngay
      // trong lúc gắn, không được đọc nhầm khối của hộp cũ
      BT = [];
      LAY_ANH_BT = {};
      TON_BAN_DAU = {};
      CHU_KY_MAY_GOC = null;
      // Danh sách ảnh đổi (thêm, bỏ, đổi thứ tự) thì ảnh to bên trái quay về ảnh bìa
      layAnh = Apex.ganBoAnh('sp-anh', p ? p.dsAnh : [], function (ds) {
        xemAnhLon(ds.length ? Apex.anhDayDu(ds[0]) : '', null);
        veAnhBienThe(ds);
      });
      ['f-gia', 'f-ton', 'f-gio-in', 'f-phut-in'].forEach(function (id) {
        document.getElementById(id).addEventListener('input', veTomTatSp);
      });
      // Bấm ảnh nhỏ (ảnh sản phẩm, dải ảnh biến thể, ảnh trong phần chi tiết biến thể) -> xem to.
      // Nút đổi thứ tự / bỏ ảnh nằm đè trên ảnh nhỏ vẫn làm đúng việc của nó.
      document.getElementById('than-form-sp').addEventListener('click', function (e) {
        if (e.target.closest('button, a, input, label, select, textarea')) return;
        var o = e.target.closest('.o-bo-anh');
        var img = o ? o.querySelector('img') : e.target.closest('.dai-anh-nho img');
        if (img) xemAnhLon(img.src, o || img);
      });

      dsBt.forEach(function (b) { themKhoiBienThe(b); });
      datCheDo(CHE_DO_NHIEU);
      veSaoMacDinh();
      capNhatConLai();
      veAnhBienThe();

      BT_BAN_DAU = docBienTheTuForm();
      BST_BAN_DAU = docBoSuuTap().join(',');
      CHU_KY_MAY_GOC = chuKyMay(BT_BAN_DAU);
      veTomTatSp();
    }

    /* ---------------- Ảnh to bên trái ---------------- */

    /**
     * Hiện một ảnh ở khung to bên trái. nguon = ô ảnh nhỏ vừa bấm (được viền); null = đang hiện
     * ảnh bìa. Bấm ảnh của biến thể lúc khung to đã cuộn khuất (bảng biến thể nằm dưới) thì cuộn
     * khung to vào tầm nhìn.
     */
    function xemAnhLon(src, nguon) {
      var lon = document.getElementById('sp-anh-lon');
      if (!lon) return;
      lon.src = src || Apex.anhSanPham();
      Array.prototype.forEach.call(document.querySelectorAll('#than-form-sp .dang-xem'), function (x) {
        x.classList.remove('dang-xem');
      });
      if (!nguon) return;
      nguon.classList.add('dang-xem');
      var hop = lon.closest('.ht-than');
      if (hop) {
        var r = lon.getBoundingClientRect(), h = hop.getBoundingClientRect();
        if (r.bottom < h.top + 40 || r.top > h.bottom - 40) lon.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    /**
     * Dải ảnh riêng của các biến thể, ngay dưới ảnh sản phẩm (bấm để xem to). Ảnh trùng — kể cả
     * trùng ảnh sản phẩm — chỉ hiện một lần; không biến thể nào có ảnh riêng thì ẩn cả dải.
     * dsSp: danh sách ảnh sản phẩm khi được gọi từ chính bộ ảnh sản phẩm (lúc đó layAnh chưa gán).
     */
    function veAnhBienThe(dsSp) {
      var khung = document.getElementById('dai-anh-bt');
      if (!khung) return;
      var daCo = {};
      (dsSp || (layAnh ? layAnh() : [])).forEach(function (u) { daCo[u] = true; });
      var html = '';
      BT.forEach(function (b, i) {
        var lay = LAY_ANH_BT[b.k];
        if (!lay) return;
        var ten = tenHienCuaBt(b, i);
        lay().forEach(function (u) {
          if (daCo[u]) return;
          daCo[u] = true;
          html += '<img src="' + Apex.esc(Apex.anhDayDu(u)) + '" alt="" data-k="' + b.k + '" title="' +
            Apex.esc(ten) + '" onerror="this.style.opacity=\'.25\'" />';
        });
      });
      document.getElementById('dai-anh-bt-ds').innerHTML = html;
      khung.hidden = !html;
    }

    /** Tên biến thể đang gõ trên form (trống thì tên tạm "Mặc định" / "Biến thể n"). */
    function tenHienCuaBt(b, i) {
      var o = khoiBt(b.k);
      return (o && o.querySelector('.bt-ten').value.trim()) || tenBienThe(b, i);
    }

    /** Đổi tên biến thể thì ảnh của nó trong dải ảnh biến thể đổi chữ khi rê chuột theo. */
    function doiTenAnhBt(k) {
      var vt = -1;
      BT.forEach(function (b, i) { if (b.k === k) vt = i; });
      if (vt < 0) return;
      var ten = tenHienCuaBt(BT[vt], vt);
      Array.prototype.forEach.call(document.querySelectorAll('#dai-anh-bt-ds img[data-k="' + k + '"]'), function (x) {
        x.title = ten;
      });
    }

    /* ---------------- Bộ sưu tập (nhiều bộ cho một sản phẩm) ---------------- */

    function htmlChonBoSuuTap(p) {
      var dangCo = {};
      ((p && SP_GOC[p.dbId] && SP_GOC[p.dbId].boSuuTap) || []).forEach(function (b) { dangCo[b.id] = true; });
      var html = BO_SUU_TAP.map(function (b) {
        var chon = !!dangCo[b.id];
        return '<label class="chip-bst' + (chon ? ' dang-chon' : '') + '">' +
          '<input type="checkbox" value="' + b.id + '"' + (chon ? ' checked' : '') +
          ' onchange="this.parentNode.classList.toggle(\'dang-chon\', this.checked)" />' +
          Apex.esc(b.ten) + (b.hienThi === false ? ' <span class="an">(đang ẩn)</span>' : '') + '</label>';
      }).join('');
      return '<div class="o-nhap"><label>Bộ sưu tập</label>' +
        (html
          ? '<div class="chon-bst" id="f-bst">' + html + '</div>'
          : '<div class="goi-y">Chưa có bộ sưu tập nào.</div>') +
        '</div>';
    }

    /** id các bộ đang tích, theo thứ tự hiện trên form. */
    function docBoSuuTap() {
      return Array.prototype.map.call(document.querySelectorAll('#f-bst input:checked'), function (o) {
        return parseInt(o.value, 10);
      });
    }

    /* ---------------- Biến thể trên form ---------------- */

    function optionMauBt(chonId, tenCu) {
      var co = false;
      var html = Apex.mauSac.filter(function (m) { return !m.daXoa; }).map(function (m) {
        if (m.id === chonId) co = true;
        return '<option value="' + m.id + '"' + (m.id === chonId ? ' selected' : '') + '>' +
          Apex.esc(m.ten) + '</option>';
      }).join('');
      // Màu đã bị xoá khỏi bảng màu vẫn giữ trên biến thể đang dùng, khỏi rơi mất lúc lưu
      if (chonId && !co) {
        html += '<option value="' + chonId + '" selected>' + Apex.esc(tenCu || ('Màu #' + chonId)) + ' (đã xoá)</option>';
      }
      return '<option value="">— Không màu —</option>' + html;
    }

    function optionTtBt(chon) {
      return '<option value="">Theo sản phẩm</option>' + Object.keys(Apex.ttSanPham).map(function (k) {
        return '<option value="' + k + '"' + (k === chon ? ' selected' : '') + '>' + Apex.ttSanPham[k].ten + '</option>';
      }).join('');
    }

    /** Ô ảnh nhỏ đầu hàng biến thể: ảnh đầu của biến thể, kèm số ảnh khi có nhiều. */
    function htmlAnhNhoBt(ds) {
      if (!ds || !ds.length) return '<i class="fa-regular fa-image"></i>';
      return '<img src="' + Apex.esc(Apex.anhDayDu(ds[0])) + '" alt="" onerror="this.style.opacity=\'.25\'" />' +
        (ds.length > 1 ? '<span class="so-anh">' + ds.length + '</span>' : '');
    }

    /** Thêm khối một biến thể (hàng + phần chi tiết ảnh / SKU / nhựa) vào cuối bảng. */
    function themKhoiBienThe(b) {
      var k = 'b' + (++SO_KHOA_BT);
      BT.push({ k: k, id: b.id || null, macDinh: !!b.macDinh });
      // Biến thể mới mở ra với tồn 0, nên gõ số âm vẫn bị chặn như trước
      TON_BAN_DAU[k] = b.tonKho || 0;

      var o = document.createElement('div');
      o.className = 'bt';
      o.setAttribute('data-k', k);
      o.innerHTML =
        '<div class="bt-dong">' +
        '<button type="button" class="bt-anh" title="Ảnh riêng của biến thể" onclick="batChiTietBt(this)"></button>' +
        '<input type="text" class="bt-ten" aria-label="Tên biến thể" value="' + Apex.esc(b.ten || '') + '" ' +
        'oninput="this.removeAttribute(\'data-tu-mau\');doiTenAnhBt(\'' + k + '\')" />' +
        '<div class="bt-o-mau"><span class="bt-cham-mau"></span>' +
        '<select class="bt-mau" aria-label="Màu biến thể" onchange="doiMauBt(this)">' +
        optionMauBt(b.mauSacId || null, b.mau) + '</select></div>' +
        '<div class="bt-o-so bt-o-gia"><span class="nhan-nho">Giá</span>' +
        '<input type="number" class="bt-gia" min="0" step="1000" aria-label="Giá biến thể" ' +
        'value="' + (b.gia === null || b.gia === undefined ? '' : b.gia) + '" oninput="veTomTatSp()" /></div>' +
        '<div class="bt-o-so bt-o-ton"><span class="nhan-nho">Tồn kho</span>' +
        '<input type="number" class="bt-ton' + ((b.tonKho || 0) < 0 ? ' so-am' : '') + '" step="1" aria-label="Tồn kho biến thể" ' +
        'value="' + (b.tonKho || 0) + '" oninput="doiTonBt(this)" /></div>' +
        // Thời gian in MỘT cái của biến thể: giờ | phút (ô trống = 0)
        // Nhãn ghi rõ ô nào là giờ, ô nào là phút (hai ô số giống hệt nhau, không còn chữ mờ bên trong)
        '<div class="bt-o-so bt-o-gio"><span class="nhan-nho">Giờ · phút in</span>' +
        '<input type="number" class="bt-gio" min="0" step="1" aria-label="Số giờ in một cái" ' +
        'value="' + soGio(b.thoiGianInPhut) + '" oninput="veTomTatSp()" />' +
        '<input type="number" class="bt-phut" min="0" step="1" aria-label="Số phút in một cái" ' +
        'value="' + soPhut(b.thoiGianInPhut) + '" oninput="veTomTatSp()" /></div>' +
        '<select class="bt-tt" aria-label="Trạng thái biến thể">' + optionTtBt(b.trangThai || '') + '</select>' +
        '<button type="button" class="bt-nut-nhua" title="Cuộn nhựa của biến thể" onclick="batChiTietBt(this)"></button>' +
        '<button type="button" class="bt-sao" onclick="chonMacDinh(this)"><i class="fa-solid fa-star"></i></button>' +
        '<button type="button" class="nut-bo-dong bt-xoa" title="Bỏ biến thể này" onclick="xoaBienThe(this)">' +
        '<i class="fa-solid fa-xmark"></i></button>' +
        '</div>' +
        '<div class="bt-chi-tiet" hidden>' +
        '<div><div class="nhan-phu">Ảnh riêng của biến thể</div>' + Apex.htmlBoAnh('bt-anh-' + k) +
        '<div class="o-nhap"><label for="bt-sku-' + k + '">Mã SKU</label>' +
        '<input type="text" class="bt-sku" id="bt-sku-' + k + '" value="' + Apex.esc(b.maSku || '') + '" /></div></div>' +
        '<div class="o-nhap bt-cho-nhua"><label>Nhựa đã dùng</label></div>' +
        '</div>';
      document.getElementById('ds-bt').appendChild(o);
      veChamMau(o);

      LAY_ANH_BT[k] = Apex.ganBoAnh('bt-anh-' + k, b.danhSachAnh || [], function (ds) {
        var nut = o.querySelector('.bt-anh');
        if (nut) nut.innerHTML = htmlAnhNhoBt(ds);
        veAnhBienThe();   // lần vẽ đầu LAY_ANH_BT[k] chưa gán nên chưa có ảnh này; moFormSanPham vẽ lại sau
      });

      var kn = taoKhungNhua(k, b);
      o.querySelector('.bt-cho-nhua').appendChild(kn);
      var dsCu = b.vatTus || [];
      if (dsCu.length) dsCu.forEach(function (v) { themDongNhua(kn, v); });
      else themDongNhua(kn);
      return o;
    }

    /**
     * Đổi giữa form một biến thể (y như trước khi có biến thể) và bảng biến thể.
     * Ô nhựa của biến thể đầu CHUYỂN chỗ (giữ nguyên các dòng đang gõ dở), không dựng lại.
     */
    function datCheDo(nhieu) {
      CHE_DO_NHIEU = nhieu;
      document.getElementById('than-form-sp').classList.toggle('co-bt', nhieu);
      BT.forEach(function (b, i) {
        var kn = khungNhuaCua(b.k);
        var cho = (!nhieu && i === 0) ? document.getElementById('cho-nhua-mot')
          : khoiBt(b.k).querySelector('.bt-cho-nhua');
        if (kn && kn.parentNode !== cho) cho.appendChild(kn);
      });
      var ton = document.getElementById('f-ton');
      ton.disabled = nhieu;
      if (nhieu) ton.removeAttribute('min');   // tổng có thể âm khi một biến thể đang âm
      document.getElementById('nhan-f-ton').textContent = nhieu ? 'Tồn kho (tổng các biến thể)' : 'Tồn kho';
    }

    /**
     * Nút "Thêm biến thể". Lần đầu thì chuyển sang bảng: ô Tồn kho chung thành tồn của biến thể
     * đầu, hai ô "Thời gian in / cái" thành ô Giờ in của hàng đầu.
     */
    function themBienThe() {
      if (!CHE_DO_NHIEU) {
        var dau = khoiBt(BT[0].k);
        dau.querySelector('.bt-ton').value = parseInt(document.getElementById('f-ton').value, 10) || 0;
        doiTonBt(dau.querySelector('.bt-ton'));
        var phut = phutTuHaiO(document.getElementById('f-gio-in'), document.getElementById('f-phut-in'));
        if (!isNaN(phut)) {
          dau.querySelector('.bt-gio').value = soGio(phut);
          dau.querySelector('.bt-phut').value = soPhut(phut);
        }
        datCheDo(true);
      }
      var o = themKhoiBienThe({ id: null, ten: null, macDinh: false, gia: null, trangThai: null,
        tonKho: 0, soLuong: 1, thoiGianInPhut: 0, nhieuMau: false, vatTus: [], danhSachAnh: [] });
      veSaoMacDinh();
      capNhatConLai();
      veTomTatSp();
      o.querySelector('.bt-ten').focus();
    }

    /** Bỏ một biến thể khỏi form. Biến thể đã lưu thì hỏi lại: lưu xong nó bị xoá, nhựa được hoàn về cuộn. */
    function xoaBienThe(nut) {
      if (BT.length <= 1) return;
      var o = nut.closest('.bt'), k = o.getAttribute('data-k');
      var vt = -1;
      BT.forEach(function (b, i) { if (b.k === k) vt = i; });
      if (vt < 0) return;
      var ten = o.querySelector('.bt-ten').value.trim() || tenBienThe(BT[vt], vt);
      if (BT[vt].id && !confirm('Bỏ biến thể "' + ten + '"? Bấm Lưu xong biến thể này bị xoá, ' +
          'nhựa của nó được hoàn lại vào cuộn.')) return;
      var bo = BT.splice(vt, 1)[0];
      // Bỏ biến thể mặc định thì dòng đầu còn lại lên thay (backend cũng chọn y như vậy)
      if (bo.macDinh) BT[0].macDinh = true;
      delete LAY_ANH_BT[k];
      delete TON_BAN_DAU[k];
      o.parentNode.removeChild(o);
      veSaoMacDinh();
      capNhatConLai();
      veTomTatSp();
      veAnhBienThe();
    }

    /** ★: đúng một biến thể mặc định — hiện đầu tiên và được chọn sẵn trên web khách. */
    function chonMacDinh(nut) {
      var k = nut.closest('.bt').getAttribute('data-k');
      BT.forEach(function (b) { b.macDinh = b.k === k; });
      veSaoMacDinh();
    }

    function veSaoMacDinh() {
      var mot = BT.length <= 1;
      BT.forEach(function (b) {
        var o = khoiBt(b.k);
        var sao = o.querySelector('.bt-sao');
        sao.classList.toggle('dang-chon', b.macDinh);
        sao.title = b.macDinh ? 'Biến thể mặc định' : 'Đặt làm biến thể mặc định';
        // Sản phẩm phải còn ít nhất một biến thể
        var xoa = o.querySelector('.bt-xoa');
        xoa.disabled = mot;
        xoa.title = mot ? 'Sản phẩm phải có ít nhất một biến thể' : 'Bỏ biến thể này';
      });
    }

    /** Bấm ảnh nhỏ hoặc ô nhựa của một hàng: mở / gập phần ảnh riêng, mã SKU, cuộn nhựa. */
    function batChiTietBt(nut) {
      var o = nut.closest('.bt');
      var ct = o.querySelector('.bt-chi-tiet');
      ct.hidden = !ct.hidden;
      o.classList.toggle('mo', !ct.hidden);
    }

    function veChamMau(o) {
      var s = o.querySelector('.bt-mau');
      var m = s.value ? Apex.timMau(parseInt(s.value, 10)) : null;
      var tenMau = s.value ? s.options[s.selectedIndex].text : '';
      o.querySelector('.bt-cham-mau').style.background =
        (m ? Apex.maMauCua(m.maMau, m.ten) : Apex.maMauCua('', tenMau)) || '#e4e6e9';
    }

    /**
     * Đổi màu biến thể: ô tên đang trống (hoặc đang là tên màu tự điền lần trước) thì điền tên màu.
     * Biến thể một màu chỉ in được bằng cuộn đúng màu -> lọc lại ô chọn cuộn.
     */
    function doiMauBt(s) {
      var o = s.closest('.bt');
      veChamMau(o);
      var ten = o.querySelector('.bt-ten');
      var tenMau = s.value ? s.options[s.selectedIndex].text.replace(/ \(đã xoá\)$/, '') : '';
      if (!ten.value.trim() || ten.getAttribute('data-tu-mau') === ten.value) {
        ten.value = tenMau;
        ten.setAttribute('data-tu-mau', tenMau);
        doiTenAnhBt(o.getAttribute('data-k'));
      }
      capNhatConLai();
    }

    function doiTonBt(o) {
      o.classList.toggle('so-am', (parseInt(o.value, 10) || 0) < 0);
      veTomTatSp();
    }

    /** Tồn kho của một biến thể trên form: form một biến thể thì chính là ô Tồn kho chung. */
    function docTonBt(k) {
      var o = CHE_DO_NHIEU ? khoiBt(k).querySelector('.bt-ton') : document.getElementById('f-ton');
      return parseInt(o.value, 10);
    }

    /** Phút in một cái của biến thể: form một biến thể thì là hai ô "Thời gian in / cái". */
    function docPhutInBt(k) {
      if (!CHE_DO_NHIEU) return phutTuHaiO(document.getElementById('f-gio-in'), document.getElementById('f-phut-in'));
      var o = khoiBt(k);
      return phutTuHaiO(o.querySelector('.bt-gio'), o.querySelector('.bt-phut'));
    }

    /**
     * Đọc mọi biến thể trên form thành đúng dạng body bienThe của PUT /api/san-pham (thuTu =
     * thứ tự đang hiện). Nhiều màu: mọi dòng nhựa = số lượng chung (backend cũng tự chuẩn hoá).
     * Số chưa hợp lệ để NaN — luuForm báo lỗi trước khi gửi.
     */
    function docBienTheTuForm() {
      return BT.map(function (b, i) {
        var o = khoiBt(b.k), kn = khungNhuaCua(b.k);
        var nhieu = laNhieuMau(kn), sl = tongSoCaiTrenForm(kn);
        var nhua = docDongNhua(kn);
        if (nhieu) nhua.forEach(function (d) { d.soLuong = sl; });
        var gia = o.querySelector('.bt-gia').value.trim();
        return {
          k: b.k,           // khoá dòng trên form (không gửi lên), để tra TON_BAN_DAU
          id: b.id,
          ten: o.querySelector('.bt-ten').value.trim() || null,
          mauSacId: parseInt(o.querySelector('.bt-mau').value, 10) || null,
          maSku: o.querySelector('.bt-sku').value.trim() || null,
          gia: gia === '' ? null : parseInt(gia, 10),
          tonKho: docTonBt(b.k),
          soLuong: sl,
          thoiGianInPhut: docPhutInBt(b.k),
          nhieuMau: nhieu,
          trangThai: o.querySelector('.bt-tt').value || null,
          danhSachAnh: LAY_ANH_BT[b.k] ? LAY_ANH_BT[b.k]() : [],
          macDinh: b.macDinh,
          thuTu: i,
          vatTus: nhua
        };
      });
    }

    /* Hai phần của một biến thể: phần RIÊNG (chỉ gửi được qua bienThe) và phần ô form cũ
       chở được (tồn kho / số cái / giờ in / nhiều màu / nhựa — backend đổ vào biến thể MẶC ĐỊNH).
       Giờ in nằm ở phần chung: đổi giờ in của biến thể KHÔNG mặc định thì bienThe được gửi. */
    function chuKyRieng(b) {
      return JSON.stringify([b.id, b.ten, b.mauSacId, b.maSku, b.gia, b.trangThai, b.danhSachAnh, b.macDinh]);
    }
    function chuKyChung(b) {
      return JSON.stringify([b.tonKho, b.soLuong, b.nhieuMau, b.thoiGianInPhut]) + '|' + chuKyNhua(b.vatTus);
    }
    /** Những gì tiền máy / giá vốn phụ thuộc: số biến thể, số cái, giờ in, kiểu màu, dòng nhựa. */
    function chuKyMay(ds) {
      return JSON.stringify(ds.map(function (b) {
        return [b.soLuong, b.thoiGianInPhut, b.nhieuMau, chuKyNhua(b.vatTus)];
      }));
    }

    /* Danh sách nhựa rút gọn thành chuỗi, để lúc lưu biết có đụng vào nhựa hay không.
       Không đụng thì KHỎI gửi vatTus: backend khỏi đọc lại bảng san_pham_vat_tu,
       bớt một lượt đi-về Supabase (~250 ms) cho lượt sửa tên/giá/ảnh thông thường. */
    function chuKyNhua(ds) {
      return (ds || []).map(function (v) {
        return [v.vatTuId, v.soLuong, v.gramNhua, v.gramThua].join(':');
      }).join('|');
    }

    /* ---------------- Danh sách cuộn nhựa của từng biến thể ---------------- */

    /** Khung nhựa của một biến thể: tick nhiều màu, số lượng chung, các dòng cuộn, dòng tổng. */
    function taoKhungNhua(k, b) {
      var nhieu = !!b.nhieuMau;
      var kn = document.createElement('div');
      kn.className = 'nhua-bt';
      kn.setAttribute('data-k', k);
      kn.innerHTML =
        // Nhiều màu: một ô số lượng chung. Một màu: số cái nhập ở từng dòng cuộn.
        '<div class="hang-kieu-mau">' +
        '<label class="o-tick"><input type="checkbox" class="nhua-nhieu-mau"' + (nhieu ? ' checked' : '') +
        ' onchange="doiKieuMau(this)" /> Nhiều màu</label>' +
        '<div class="o-sl-chung"' + (nhieu ? '' : ' style="display:none"') + '>' +
        '<label for="sl-chung-' + k + '">Số lượng</label>' +
        '<input type="number" class="nhua-sl-chung" id="sl-chung-' + k + '" min="1" step="1" value="' +
        (b.soLuong || 1) + '" oninput="doiTongSoCai(this)" />' +
        '</div></div>' +
        '<div class="khung-nhua' + (nhieu ? ' nhieu-mau' : '') + '">' +
        '<div class="dau-nhua"><span class="cot-cuon">Cuộn nhựa</span><span class="cot-sl">Số cái</span>' +
        '<span>Gram/cái</span><span>Thừa/cái</span><span></span></div>' +
        '<div class="ds-nhua"></div>' +
        '</div>' +
        '<button type="button" class="nut nut-vien nut-nho" onclick="themDongNhua(this)">' +
        '<i class="fa-solid fa-plus"></i> Thêm cuộn nhựa</button>' +
        '<div class="mau-suy-ra"></div>' +
        '<div class="tong-nhua"></div>';
      return kn;
    }

    function laNhieuMau(kn) {
      var o = kn ? kn.querySelector('.nhua-nhieu-mau') : null;
      return !!(o && o.checked);
    }

    /** Tổng số cái của biến thể: nhiều màu = ô số lượng chung; một màu = cộng số cái từng cuộn. */
    function tongSoCaiTrenForm(kn) {
      if (laNhieuMau(kn)) {
        var o = kn.querySelector('.nhua-sl-chung');
        return Math.max(1, parseInt(o ? o.value : 1, 10) || 1);
      }
      var ds = docDongNhua(kn);
      return ds.length ? ds.reduce(function (s, d) { return s + d.soLuong; }, 0) : 1;
    }

    /** Nhiều màu: mọi dòng lấy đúng số lượng chung (ô số cái từng dòng đang giấu). */
    function doiTongSoCai(x) {
      var kn = x.closest('.nhua-bt');
      if (laNhieuMau(kn)) {
        var sl = tongSoCaiTrenForm(kn);
        Array.prototype.forEach.call(kn.querySelectorAll('.nhua-sl'), function (i) { i.value = sl; });
      }
      veTongNhua(kn);
    }

    /** Bật/tắt "Nhiều màu". Sang nhiều màu thì lấy số cái lớn nhất đang có làm số lượng chung. */
    function doiKieuMau(x) {
      var kn = x.closest('.nhua-bt');
      var nhieu = laNhieuMau(kn);
      kn.querySelector('.khung-nhua').classList.toggle('nhieu-mau', nhieu);
      kn.querySelector('.o-sl-chung').style.display = nhieu ? '' : 'none';
      if (nhieu) {
        var lonNhat = 1;
        Array.prototype.forEach.call(kn.querySelectorAll('.nhua-sl'), function (i) {
          lonNhat = Math.max(lonNhat, parseInt(i.value, 10) || 1);
        });
        kn.querySelector('.nhua-sl-chung').value = lonNhat;
      }
      doiTongSoCai(kn);
    }

    /** Gram mỗi biến thể trên form đang dùng ở từng cuộn: k -> { vatTuId: gram }. */
    function gramTheoBienThe() {
      var ra = {};
      dsKhungNhua().forEach(function (kn) {
        var m = {}, nhieu = laNhieuMau(kn), sl = tongSoCaiTrenForm(kn);
        docDongNhua(kn).forEach(function (d) {
          m[d.vatTuId] = (m[d.vatTuId] || 0) + (d.gramNhua + d.gramThua) * (nhieu ? sl : d.soLuong);
        });
        ra[kn.getAttribute('data-k')] = m;
      });
      return ra;
    }

    /** Gram các biến thể KHÁC k đang giữ ở từng cuộn. */
    function gramBienTheKhac(tatCa, k) {
      var ra = {};
      Object.keys(tatCa).forEach(function (kk) {
        if (kk === k) return;
        Object.keys(tatCa[kk]).forEach(function (id) { ra[id] = (ra[id] || 0) + tatCa[kk][id]; });
      });
      return ra;
    }

    /**
     * Biến thể này còn lấy được bao nhiêu gram ở cuộn: phần cuộn còn trống, cộng phần sản phẩm
     * đang giữ (trả lại khi sửa), trừ phần các biến thể khác trên form đang dùng.
     * Chưa chia phân loại thì không có biến thể khác -> y hệt con số trước đây.
     */
    function conLaiChoForm(v, dungNgoai) {
      return (v.conLaiGram || 0) + (GRAM_DA_TRU[v.id] || 0) - ((dungNgoai || {})[v.id] || 0);
    }

    /** Màu khai của biến thể (id) — null khi không chọn màu. */
    function mauCuaBienThe(k) {
      var o = khoiBt(k);
      var s = o ? o.querySelector('.bt-mau') : null;
      return s && s.value ? parseInt(s.value, 10) : null;
    }

    function optionCuonNhua(chonId, kn, dungNgoai) {
      var k = kn.getAttribute('data-k');
      var mauBt = mauCuaBienThe(k);
      // Biến thể một màu đã chọn màu chỉ in bằng cuộn đúng màu đó (cuộn chưa gán màu vẫn được).
      // Cuộn đang chọn sẵn thì giữ lại kèm chữ "khác màu", để khỏi rơi mất dòng nhựa đã lưu.
      var locMau = !!mauBt && !laNhieuMau(kn);
      if (dungNgoai === undefined) dungNgoai = gramBienTheKhac(gramTheoBienThe(), k);
      return '<option value="">— Chọn cuộn nhựa —</option>' + Apex.cuonNhua().filter(function (v) {
        return !locMau || !v.mauSacId || v.mauSacId === mauBt || v.id === chonId;
      }).map(function (v) {
        var khacMau = locMau && v.mauSacId && v.mauSacId !== mauBt;
        return '<option value="' + v.id + '"' + (v.id === chonId ? ' selected' : '') + '>' +
          Apex.esc(v.ten) + (v.mau ? ' · ' + Apex.esc(v.mau) : '') +
          ' — còn ' + Apex.number(conLaiChoForm(v, dungNgoai)) + 'g' + (khacMau ? ' (khác màu)' : '') + '</option>';
      }).join('');
    }

    /** Vẽ lại ô chọn cuộn của mọi biến thể: số "còn ...g" và bộ lọc màu đổi theo từng lần gõ. */
    function capNhatConLai() {
      var tatCa = gramTheoBienThe();
      dsKhungNhua().forEach(function (kn) {
        var dung = gramBienTheKhac(tatCa, kn.getAttribute('data-k'));
        Array.prototype.forEach.call(kn.querySelectorAll('.nhua-cuon'), function (s) {
          s.innerHTML = optionCuonNhua(parseInt(s.value, 10) || null, kn, dung);
        });
      });
    }

    /**
     * Tóm tắt cuối hộp, tính ngay khi gõ. Dòng 1: (số biến thể, tổng tồn), giá trị tồn.
     * Dòng 2: nhựa đã trừ kho, tiền nhựa, giờ máy, tiền máy, giá vốn một cái — cùng công thức
     * backend (SanPhamDto.kemChiPhiMay), từng biến thể:
     *   tiền nhựa    = Σ làm tròn(gram dòng × đơn giá/gram của cuộn)
     *   tiền máy/cái = làm tròn(phút in một cái × tiền máy mỗi giờ / 60)
     *   giá vốn/cái  = làm tròn(tiền nhựa / số cái) + tiền máy/cái
     * Chưa đụng vào số cái / nhựa / giờ in thì lấy thẳng số backend đã tính (SO_MAY_GOC).
     */
    function veTomTatSp() {
      var o = document.getElementById('tom-tat-sp');
      if (!o) return;
      var giaSp = parseInt(document.getElementById('f-gia').value, 10) || 0;
      var moiGio = tienMayMoiGio();
      var tongTon = 0, giaTri = 0, gram = 0, tien = 0;
      var tongPhut = 0, tienMay = 0, gvMin = null, gvMax = null;
      BT.forEach(function (b) {
        var khoi = khoiBt(b.k), kn = khungNhuaCua(b.k);
        if (!khoi || !kn) return;
        // Giá biến thể để trống = giá sản phẩm
        var giaBt = parseInt(khoi.querySelector('.bt-gia').value, 10);
        var ton = docTonBt(b.k) || 0;
        tongTon += ton;
        giaTri += (isNaN(giaBt) ? giaSp : giaBt) * ton;
        var nhieu = laNhieuMau(kn), sl = tongSoCaiTrenForm(kn);
        var nhuaBt = 0;
        docDongNhua(kn).forEach(function (d) {
          var v = Apex.timVatTu(d.vatTuId);
          var g = (d.gramNhua + d.gramThua) * (nhieu ? sl : d.soLuong);
          gram += g;
          nhuaBt += Math.round(g * (v ? (v.donGiaMoiGram || 0) : 0));   // backend làm tròn từng dòng
        });
        tien += nhuaBt;
        var soCai = Math.max(1, sl);
        var phut = docPhutInBt(b.k);
        if (isNaN(phut)) phut = 0;
        tongPhut += phut * soCai;
        var mayMoiCai = moiGio === null ? 0 : Math.round(phut * moiGio / 60);
        tienMay += mayMoiCai * soCai;
        var gv = Math.round(nhuaBt / soCai) + mayMoiCai;
        gvMin = gvMin === null ? gv : Math.min(gvMin, gv);
        gvMax = gvMax === null ? gv : Math.max(gvMax, gv);
      });
      if (CHE_DO_NHIEU) document.getElementById('f-ton').value = tongTon;

      var g = SO_MAY_GOC;
      if (g && CHU_KY_MAY_GOC !== null && chuKyMay(docBienTheTuForm()) === CHU_KY_MAY_GOC) {
        tongPhut = g.tongPhutIn || 0;
        tienMay = g.tienMay || 0;
        gvMin = g.giaVonMoiCaiMin || 0;
        gvMax = g.giaVonMoiCaiMax || 0;
      }

      var chiPhi = [];
      if (gram) {
        chiPhi.push('Nhựa đã trừ kho <strong>' + Apex.number(gram) + 'g</strong>');
        chiPhi.push('Tiền nhựa <strong>' + Apex.money(tien) + '</strong>');
      }
      chiPhi.push('Giờ máy <strong>' + chuThoiGian(tongPhut) + '</strong>');
      // Backend cũ chưa trả chi-phi-may: không có đơn giá giờ máy thì không đoán tiền máy
      if (moiGio !== null) {
        chiPhi.push('Tiền máy <strong>' + Apex.money(tienMay) + '</strong>');
        chiPhi.push('Giá vốn / cái <strong>' + (gvMin === gvMax
          ? Apex.money(gvMin || 0)
          : Apex.number(gvMin) + ' – ' + Apex.money(gvMax)) + '</strong>');
      }
      o.innerHTML = (CHE_DO_NHIEU
          ? '<strong>' + BT.length + '</strong> biến thể · Tồn kho ' + soTon(tongTon) + ' · ' : '') +
        'Giá trị tồn <strong>' + Apex.money(giaTri) + '</strong><br>' + chiPhi.join(' · ');
    }

    /** Chữ trên ô "Nhựa" ở hàng biến thể: số cuộn và số gram của riêng biến thể đó. */
    function veNutNhua(kn) {
      var o = khoiBt(kn.getAttribute('data-k'));
      var nut = o ? o.querySelector('.bt-nut-nhua') : null;
      if (!nut) return;
      var ds = docDongNhua(kn), nhieu = laNhieuMau(kn), sl = tongSoCaiTrenForm(kn);
      var gram = ds.reduce(function (s, d) { return s + (d.gramNhua + d.gramThua) * (nhieu ? sl : d.soLuong); }, 0);
      nut.innerHTML = ds.length
        ? '<i class="fa-solid fa-circle-half-stroke"></i> ' + ds.length + ' cuộn · ' + Apex.number(gram) + 'g'
        : '<i class="fa-solid fa-plus"></i> Nhựa';
    }

    /** Dòng tổng dưới danh sách nhựa của một biến thể. */
    function veTongNhua(x) {
      var kn = x.closest('.nhua-bt');
      veTomTatSp();
      veNutNhua(kn);
      capNhatConLai();
      var o = kn.querySelector('.tong-nhua');
      var ds = docDongNhua(kn);
      if (!ds.length) { o.innerHTML = ''; return; }
      var tong = 0, phep;
      if (laNhieuMau(kn)) {
        // Mỗi cái ăn tất cả các cuộn: cộng gram mọi cuộn rồi nhân số lượng chung
        var sl = tongSoCaiTrenForm(kn);
        var moiCai = ds.reduce(function (s, d) { return s + d.gramNhua + d.gramThua; }, 0);
        tong = moiCai * sl;
        phep = Apex.number(moiCai) + 'g/cái × ' + Apex.number(sl);
      } else {
        phep = ds.map(function (d) {
          var mc = d.gramNhua + d.gramThua;
          tong += mc * d.soLuong;
          return Apex.number(mc) + 'g × ' + Apex.number(d.soLuong);
        }).join(' + ');
      }
      o.innerHTML = 'Tổng <strong>' + Apex.number(tongSoCaiTrenForm(kn)) + ' cái</strong> · trừ vào kho: ' +
        Apex.esc(phep) + ' = <strong>' + Apex.number(tong) + 'g</strong>';
    }

    /** kn: khung nhựa của biến thể, hoặc nút "Thêm cuộn nhựa" nằm trong khung đó. */
    function themDongNhua(x, v) {
      var kn = x.closest('.nhua-bt');
      var o = document.createElement('div');
      o.className = 'dong-nhua';
      o.innerHTML =
        '<select class="nhua-cuon" onchange="veMauSuyRa(this)">' + optionCuonNhua(v ? v.vatTuId : null, kn) + '</select>' +
        '<input type="number" class="nhua-sl cot-sl" min="1" step="1" oninput="veTongNhua(this)" ' +
        // Nhiều màu: dòng mới theo số lượng chung (ô này đang giấu); một màu: mặc định 1 cái
        'value="' + (v ? (v.soLuong || 1) : (laNhieuMau(kn) ? tongSoCaiTrenForm(kn) : 1)) + '" />' +
        '<input type="number" class="nhua-gram" min="0" step="1" oninput="veTongNhua(this)" ' +
        'value="' + (v ? (v.gramNhua || 0) : 0) + '" />' +
        '<input type="number" class="nhua-thua" min="0" step="1" oninput="veTongNhua(this)" ' +
        'value="' + (v ? (v.gramThua || 0) : 0) + '" />' +
        '<button type="button" class="nut-bo-dong" title="Bỏ dòng này" onclick="boDongNhua(this)">' +
        '<i class="fa-solid fa-xmark"></i></button>';
      kn.querySelector('.ds-nhua').appendChild(o);
      veMauSuyRa(kn);
    }

    function boDongNhua(nut) {
      var kn = nut.closest('.nhua-bt');
      var dong = nut.closest('.dong-nhua');
      if (dong) dong.remove();
      veMauSuyRa(kn);
    }

    /** Màu suy từ các cuộn đang chọn của biến thể — không khai được màu khác với nhựa thật sự dùng. */
    function veMauSuyRa(x) {
      var kn = x.closest('.nhua-bt');
      var o = kn.querySelector('.mau-suy-ra');
      var daCo = {}, html = '';
      docDongNhua(kn).forEach(function (d) {
        var v = Apex.timVatTu(d.vatTuId);
        if (!v || !v.mau || daCo[v.mau]) return;
        daCo[v.mau] = true;
        html += '<span class="badge badge-xam">' + Apex.oMau(v.maMau, v.mau, 13) + Apex.esc(v.mau) + '</span>';
      });
      o.innerHTML = html;
      veTongNhua(kn);
    }

    /** Đọc các dòng nhựa của một biến thể; bỏ qua dòng chưa chọn cuộn. */
    function docDongNhua(kn) {
      if (!kn) return [];
      return Array.prototype.map.call(kn.querySelectorAll('.dong-nhua'), function (o) {
        return {
          vatTuId: parseInt(o.querySelector('.nhua-cuon').value, 10) || null,
          soLuong: Math.max(1, parseInt(o.querySelector('.nhua-sl').value, 10) || 1),
          gramNhua: parseInt(o.querySelector('.nhua-gram').value, 10) || 0,
          gramThua: parseInt(o.querySelector('.nhua-thua').value, 10) || 0
        };
      }).filter(function (d) { return d.vatTuId; });
    }

    /** Có dòng nào đã gõ gram mà quên chọn cuộn không. */
    function coDongBoSot(kn) {
      return Array.prototype.some.call(kn.querySelectorAll('.dong-nhua'), function (o) {
        return !o.querySelector('.nhua-cuon').value &&
               ((parseInt(o.querySelector('.nhua-gram').value, 10) || 0) > 0 ||
                (parseInt(o.querySelector('.nhua-thua').value, 10) || 0) > 0);
      });
    }

    /* ---------------- Lưu ---------------- */

    /**
     * Kiểm tra biến thể trên form. Trả câu lỗi, hoặc '' khi hợp lệ.
     * Tồn kho âm do đơn hàng trừ (shop nhận đặt trước khi in) vẫn lưu lại được; chỉ không cho GÕ số âm mới.
     */
    function kiemTraBienThe(ds) {
      var daCoTen = {};
      for (var i = 0; i < ds.length; i++) {
        var b = ds[i], k = BT[i].k;
        var ten = b.ten || '';
        var nhan = CHE_DO_NHIEU ? ' (biến thể "' + (ten || tenBienThe(b, i)) + '")' : '';
        if (!CHE_DO_NHIEU) {
          if (isNaN(b.tonKho) || (b.tonKho < 0 && b.tonKho !== TON_BAN_DAU[k])) return 'Tồn kho không hợp lệ.';
          if (isNaN(b.thoiGianInPhut)) return 'Thời gian in không hợp lệ.';
        } else {
          if (ds.length > 1 && !ten) {
            return 'Biến thể thứ ' + (i + 1) + ' chưa có tên — đặt tên (vd Đỏ, Size M) để khách phân biệt.';
          }
          var khoa = ten.toLowerCase();
          if (ten && daCoTen[khoa]) return 'Hai biến thể cùng tên "' + ten + '".';
          daCoTen[khoa] = true;
          if (b.gia !== null && (isNaN(b.gia) || b.gia < 0)) return 'Giá của biến thể "' + (ten || tenBienThe(b, i)) + '" không hợp lệ.';
          if (isNaN(b.tonKho) || (b.tonKho < 0 && b.tonKho !== TON_BAN_DAU[k])) {
            return 'Tồn kho của biến thể "' + (ten || tenBienThe(b, i)) + '" không hợp lệ.';
          }
          if (isNaN(b.thoiGianInPhut)) {
            return 'Thời gian in của biến thể "' + (ten || tenBienThe(b, i)) + '" không hợp lệ.';
          }
        }
        if (coDongBoSot(khungNhuaCua(k))) return 'Có dòng đã nhập gram nhưng chưa chọn cuộn nhựa.' + nhan;
      }
      return '';
    }

    function luuForm(dbId, nut) {
      var loi = document.getElementById('loi-form');
      var ten = document.getElementById('f-ten').value.trim();
      if (!ten) { loi.textContent = 'Vui lòng nhập tên sản phẩm.'; return; }

      var gia = parseInt(document.getElementById('f-gia').value, 10);
      if (isNaN(gia) || gia < 0) { loi.textContent = 'Giá bán không hợp lệ.'; return; }

      var dsBt = docBienTheTuForm();
      var loiBt = kiemTraBienThe(dsBt);
      if (loiBt) { loi.textContent = loiBt; return; }

      // Biến thể MẶC ĐỊNH: mấy ô form cũ (tonKho / soLuong / nhieuMau / vatTus) chở số của nó
      var vtMd = 0;
      dsBt.forEach(function (b, i) { if (b.macDinh) vtMd = i; });
      var md = dsBt[vtMd];

      /* bienThe CHỈ gửi khi chủ shop thật sự đụng vào phân loại: thêm / bỏ / đổi tên, màu, giá,
         trạng thái, ảnh, mã, mặc định — hay đổi tồn kho / nhựa của biến thể KHÔNG mặc định
         (ô form cũ chỉ chở được biến thể mặc định). Còn lại gửi y như form cũ: backend khỏi so
         từng biến thể, và sản phẩm chưa chia phân loại lưu đúng như trước khi có biến thể. */
      var goc = BT_BAN_DAU;
      var doiRieng = dsBt.length !== goc.length || dsBt.some(function (b, i) {
        return chuKyRieng(b) !== chuKyRieng(goc[i]);
      });
      var doiBtPhu = !doiRieng && dsBt.some(function (b, i) {
        return !b.macDinh && chuKyChung(b) !== chuKyChung(goc[i]);
      });
      var guiBienThe = CO_BIEN_THE && (dbId ? (doiRieng || doiBtPhu) : !chuaChiaPhanLoai(dsBt));

      loi.textContent = '';
      var duLieu = {
        // Luôn gửi: trống = backend tự sinh SP-<n>; sửa sản phẩm mà giữ nguyên mã thì backend khỏi kiểm tra
        maSanPham: document.getElementById('f-ma').value.trim(),
        soLuong: md.soLuong,
        nhieuMau: md.nhieuMau,
        // Phút in một cái của biến thể mặc định (ô form cũ, rẻ như tonKho / soLuong nên luôn gửi)
        thoiGianInPhut: md.thoiGianInPhut,
        ten: ten,
        gia: gia,
        tonKho: md.tonKho,
        // Số tồn LÚC MỞ FORM: backend chỉ cộng phần chủ shop vừa gõ thêm/bớt, nên hàng khách
        // mua trong lúc form đang mở không bị lượt lưu này "trả lại" kho
        tonKhoGoc: TON_BAN_DAU[md.k],
        trangThai: document.getElementById('f-tt').value,
        loaiSanPham: document.getElementById('f-loai').value,
        danhMucId: document.getElementById('f-danh-muc').value
          ? parseInt(document.getElementById('f-danh-muc').value, 10) : null,
        dangBan: document.getElementById('f-ban').value === 'true',
        moTa: document.getElementById('f-mota').value.trim(),
        // Tất cả ảnh theo thứ tự; backend lấy ảnh đầu làm ảnh bìa
        danhSachAnh: layAnh ? layAnh() : []
      };
      if (guiBienThe) {
        // TOÀN BỘ danh sách sau khi sửa: biến thể vắng mặt bị xoá, dòng không id là biến thể mới
        duLieu.bienThe = dsBt.map(function (b) {
          var d = {
            ten: b.ten, mauSacId: b.mauSacId, maSku: b.maSku, gia: b.gia, tonKho: b.tonKho,
            soLuong: b.soLuong, thoiGianInPhut: b.thoiGianInPhut, nhieuMau: b.nhieuMau, trangThai: b.trangThai,
            danhSachAnh: b.danhSachAnh, macDinh: b.macDinh, thuTu: b.thuTu, vatTus: b.vatTus
          };
          if (b.id) { d.id = b.id; d.tonKhoGoc = TON_BAN_DAU[b.k]; }
          return d;
        });
      } else if (!dbId || chuKyNhua(md.vatTus) !== chuKyNhua(goc[vtMd].vatTus)) {
        // Có sửa dòng nhựa (hoặc thêm sản phẩm mới) thì mới gửi vatTus lên
        duLieu.vatTus = md.vatTus;
      }
      // Bộ sưu tập: gửi là THAY cả bộ, nên chỉ gửi khi có tích / bỏ tích
      var bst = docBoSuuTap();
      if (document.getElementById('f-bst') && bst.join(',') !== BST_BAN_DAU) duLieu.boSuuTap = bst;

      // Lưu xong Apex tự đóng hộp, nạp lại các khoá của trang (có vat-tu vì số gram vừa bị
      // trừ khỏi cuộn nhựa) rồi hiện toast. Backend từ chối (vd "Cuộn X chỉ còn 120g") thì
      // câu đó hiện ngay trong ô lỗi, hộp vẫn mở để sửa.
      Apex.dangLuu(nut, function () { return Apex.luuSanPham(dbId, duLieu); }, loi);
    }

    function veLaiTrang() { docThongKe(); docDuLieuGoc(); veKpi(); veLocDanhMuc(); veLocTrangThai(); veBang(); }

    /* Một request cho cả trang: sản phẩm (kèm biến thể, tiền máy), danh mục (bộ lọc, huy hiệu,
       form), vật tư (ô chọn cuộn nhựa), bảng màu (màu biến thể), bộ sưu tập (ô chọn trong form),
       chi phí chạy máy mỗi giờ (tính thử tiền máy khi gõ giờ in) và số liệu tk-san-pham.
       Apex gọi veLaiTrang khi dữ liệu về và sau mỗi lần ghi. */
    Apex.trang({ bo: ['san-pham', 'danh-muc', 'vat-tu', 'mau-sac', 'bo-suu-tap', 'chi-phi-may', 'tk-san-pham'],
      ve: veLaiTrang });
  </script>
</body>
</html>
