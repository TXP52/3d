<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sản phẩm</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/apex.css?v=27" rel="stylesheet">
  <script src="assets/js/apex.js?v=25"></script>
  <style>
    /* Một sản phẩm in được bằng nhiều cuộn nhựa -> danh sách dòng thêm/bớt được */
    .dau-nhua, .dong-nhua {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 74px 84px 84px 34px;
      gap: 8px;
      align-items: center;
    }
    /* Nhiều màu: số lượng chung ở trên, từng dòng không có cột số cái */
    .khung-nhua.nhieu-mau .dau-nhua,
    .khung-nhua.nhieu-mau .dong-nhua { grid-template-columns: minmax(0, 1fr) 84px 84px 34px; }
    .khung-nhua.nhieu-mau .cot-sl { display: none; }

    .hang-kieu-mau { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 12px; }
    .o-nhap .o-tick {
      display: inline-flex; align-items: center; gap: 8px; margin: 0;
      font-weight: 600; font-size: 13.5px; cursor: pointer;
    }
    .o-nhap .o-tick input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); }
    .o-sl-chung { display: flex; align-items: center; gap: 8px; }
    .o-nhap .o-sl-chung label { display: inline; margin: 0; font-weight: 600; font-size: 13.5px; }
    .o-nhap .o-sl-chung input { width: 100px; margin: 0; }

    /* Điện thoại: ô chọn cuộn nằm một hàng riêng, các ô số xếp hàng dưới */
    @media (max-width: 560px) {
      .dau-nhua, .dong-nhua { grid-template-columns: 1fr 1fr 1fr 34px; }
      .khung-nhua.nhieu-mau .dau-nhua,
      .khung-nhua.nhieu-mau .dong-nhua { grid-template-columns: 1fr 1fr 34px; }
      .dong-nhua .nhua-cuon { grid-column: 1 / -1; }
      .dau-nhua .cot-cuon { display: none; }
      .dong-nhua { padding-bottom: 8px; border-bottom: 1px dashed var(--vien); }
    }
    .dau-nhua {
      font-size: 12px; font-weight: 600; color: var(--chu-mo);
      text-transform: uppercase; letter-spacing: .3px; margin-bottom: 6px;
    }
    .dong-nhua { margin-bottom: 8px; }
    .dong-nhua select, .dong-nhua input { margin: 0; }
    .nut-bo-dong {
      height: 34px; border: 1px solid var(--vien); border-radius: 8px;
      background: var(--the); color: var(--do); cursor: pointer; font-size: 15px;
    }
    .nut-bo-dong:hover { border-color: var(--do); }
    .mau-suy-ra { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }
    .tong-nhua { margin-top: 8px; font-size: 13.5px; color: var(--chu-mo); }
    .tong-nhua strong { color: var(--chu); }
  </style>
</head>
<body>
  <div class="apex-khung">
    <div id="apex-sidebar-cho"></div>
    <div class="apex-noi-dung">
      <div id="apex-topbar-cho"></div>
      <main class="apex-trang">

        <!-- KPI sản phẩm -->
        <div class="luoi-kpi" id="kpi"></div>

        <!-- Bảng sản phẩm -->
        <div class="the">
          <div class="the-dau">
            <div>
              <h3>Tất cả sản phẩm</h3>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
              <select id="loc-danh-muc" class="nut nut-vien" style="padding:7px 10px;" onchange="veBang()">
                <option value="">Tất cả danh mục</option>
              </select>
              <select id="loc-trang-thai" class="nut nut-vien" style="padding:7px 10px;" onchange="veBang()">
                <option value="">Tất cả trạng thái</option>
              </select>
              <button class="nut nut-chinh" type="button" onclick="moFormSanPham(null)">
                <i class="fa-solid fa-plus"></i> Thêm
              </button>
            </div>
          </div>
          <div class="the-than khong-dem bang-cuon">
            <table class="bang">
              <thead>
                <tr>
                  <th>Sản phẩm</th>
                  <th>Danh mục</th>
                  <th>Màu</th>
                  <th class="giua">Loại</th>
                  <th class="giua">Trạng thái</th>
                  <th class="giua">Hiển thị</th>
                  <th class="phai">Giá bán</th>
                  <th class="giua">SL in</th>
                  <th class="giua">Nhựa đã dùng</th>
                  <th class="giua">Tồn kho</th>
                  <th class="phai">Giá trị tồn</th>
                </tr>
              </thead>
              <tbody id="bang-san-pham"></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script>
    Apex.shell('san-pham', 'Danh sách sản phẩm');

    var SP = Apex.products;

    /* Chuỗi JS an toàn khi nhét vào thuộc tính onclick="..." */
    function jsStr(s) { return JSON.stringify(String(s == null ? '' : s)).replace(/"/g, '&quot;'); }

    /* Nhựa cho một cái. Mấy dòng in khác gram nhau thì ghi thành khoảng. */
    function gramMoiCaiChu(p) {
      var a = p.gramMoiCaiMin || 0, b = p.gramMoiCaiMax || 0;
      if (!b) return '';
      return a === b ? Apex.number(a) + 'g' : Apex.number(a) + '–' + Apex.number(b) + 'g';
    }

    /* ---------------- KPI ---------------- */

    function veKpi() {
      var dangBan = SP.filter(function (p) { return p.cat === 'Đang bán'; }).length;
      var dangIn = SP.filter(function (p) { return p.trangThai === 'dang_in'; }).length;
      var giaTriTon = SP.reduce(function (s, p) { return s + (p.price || 0) * (p.stock || 0); }, 0);

      Apex.fill('#kpi', [
        { nhan: 'Tổng sản phẩm', so: Apex.number(SP.length) + ' sản phẩm', icon: 'fa-cubes', mau: 'bt-toi' },
        { nhan: 'Đang hiển thị', so: Apex.number(dangBan) + ' sản phẩm', icon: 'fa-circle-check', mau: 'bt-xanh' },
        { nhan: 'Đang in', so: Apex.number(dangIn) + ' sản phẩm', icon: 'fa-print', mau: dangIn ? 'bt-vang' : 'bt-toi' },
        { nhan: 'Giá trị tồn kho', so: Apex.money(giaTriTon), icon: 'fa-warehouse', mau: 'bt-vang' }
      ].map(function (k) {
        return '<div class="kpi"><div class="dong-dau"><span class="nhan">' + k.nhan + '</span>' +
          '<span class="bieu-tuong ' + k.mau + '"><i class="fa-solid ' + k.icon + '"></i></span></div>' +
          '<div class="so">' + k.so + '</div></div>';
      }).join(''));
    }

    /* ---------------- Bảng ---------------- */

    function veLocTrangThai() {
      var el = document.getElementById('loc-trang-thai');
      var dangChon = el.value;
      el.innerHTML = '<option value="">Tất cả trạng thái</option>' +
        Object.keys(Apex.ttSanPham).map(function (k) {
          var so = SP.filter(function (p) { return p.trangThai === k; }).length;
          return '<option value="' + k + '">' + Apex.ttSanPham[k].ten + ' (' + so + ')</option>';
        }).join('');
      el.value = dangChon;
    }

    function veLocDanhMuc() {
      var el = document.getElementById('loc-danh-muc');
      var dangChon = el.value;
      var chuaXep = SP.filter(function (p) { return !p.danhMucId; }).length;
      el.innerHTML = '<option value="">Tất cả danh mục</option>' +
        Apex.danhMucSanPham().map(function (d) {
          return '<option value="' + d.id + '">' + Apex.esc(d.ten) + ' (' +
            Apex.soSanPhamTheoDanhMuc(d.id) + ')</option>';
        }).join('') +
        '<option value="chua">Chưa phân loại (' + chuaXep + ')</option>';
      el.value = dangChon;
    }

    function veBang() {
      var loc = document.getElementById('loc-trang-thai').value;
      var locDm = document.getElementById('loc-danh-muc').value;
      var html = SP.map(function (p, i) { return { p: p, i: i }; })
        .filter(function (x) { return !loc || x.p.trangThai === loc; })
        .filter(function (x) {
          if (!locDm) return true;
          if (locDm === 'chua') return !x.p.danhMucId;
          return String(x.p.danhMucId) === locDm;
        })
        .map(function (x) {
          var p = x.p;
          var hienThi = (p.cat === 'Đang bán')
            ? '<span class="badge badge-xanh"><span class="cham"></span> Đang bán</span>'
            : '<span class="badge badge-xam"><span class="cham"></span> Đang ẩn</span>';
          return '<tr class="hang-bam" onclick="moChiTiet(' + x.i + ')" title="Bấm để xem chi tiết">' +
            '<td><div class="o-ten"><img class="anh-sp" src="' + (Apex.anhDayDu(p.img) || Apex.anhSanPham(p.name)) + '" alt="" ' +
            'onerror="this.src=\'' + Apex.anhSanPham(p.name) + '\'" />' +
            '<div><div class="chinh">' + Apex.esc(p.name) + '</div>' +
            '<div class="phu">Mã: ' + Apex.esc(p.sku) + '</div></div></div></td>' +
            '<td>' + Apex.badgeDanhMuc(p.danhMucId) + '</td>' +
            '<td>' + Apex.mauSanPham(p, 13) + '</td>' +
            '<td class="giua">' + Apex.badgeLoaiSanPham(p.loaiSanPham) + '</td>' +
            '<td class="giua">' + Apex.badgeTtSanPham(p.trangThai) + '</td>' +
            '<td class="giua">' + hienThi + '</td>' +
            '<td class="phai"><strong>' + Apex.money(p.price || 0) + '</strong></td>' +
            '<td class="giua">' + (p.soLuong
              ? Apex.number(p.soLuong)
              : '<span style="color:var(--chu-mo)">—</span>') + '</td>' +
            '<td class="giua">' + (p.tongGramNhua
              ? '<strong>' + Apex.number(p.tongGramNhua) + 'g</strong>' +
                (p.soLuong > 1 ? '<div class="phu">' + gramMoiCaiChu(p) + '/cái</div>' : '')
              : '<span style="color:var(--chu-mo)">—</span>') + '</td>' +
            '<td class="giua">' + Apex.badgeTon(p.stock) + ' <strong>' + Apex.number(p.stock || 0) + '</strong></td>' +
            '<td class="phai">' + Apex.money((p.price || 0) * (p.stock || 0)) + '</td>' +
            '</tr>';
        }).join('');

      Apex.fill('#bang-san-pham', html ||
        '<tr><td colspan="11" style="text-align:center;color:var(--chu-mo);padding:28px;">' +
        ((loc || locDm) ? 'Không có sản phẩm nào khớp bộ lọc.' : 'Chưa có sản phẩm nào.') +
        '</td></tr>');
    }

    /* ---------------- Hộp thoại CHI TIẾT ---------------- */

    function moChiTiet(i) {
      var p = SP[i];
      if (!p) return;
      var anh = Apex.anhDayDu(p.img) || Apex.anhSanPham(p.name);
      var dsNhua = p.vatTus || [];
      var dsAnh = p.dsAnh || [];

      var dong = function (nhan, giaTri) {
        return '<div class="dong-tt"><span class="nhan-tt">' + nhan + '</span>' +
          '<span class="gia-tri">' + giaTri + '</span></div>';
      };

      var chonTt = Object.keys(Apex.ttSanPham).map(function (k) {
        return '<option value="' + k + '"' + (k === p.trangThai ? ' selected' : '') + '>' +
          Apex.ttSanPham[k].ten + '</option>';
      }).join('');

      var html =
        '<div class="ht-dau">' +
        '<div><h3>' + Apex.esc(p.name) + '</h3><div class="phu">Mã sản phẩm: ' + Apex.esc(p.sku) + '</div></div>' +
        '<button class="nut-dong" type="button" onclick="Apex.dongHopThoai()" aria-label="Đóng">' +
        '<i class="fa-solid fa-xmark"></i></button></div>' +

        '<div class="ht-than"><div class="ct-2cot">' +
        '<div class="cot-anh">' +
        '<img class="anh-chi-tiet" id="ct-anh-lon" src="' + anh + '" alt="" onerror="this.src=\'' + Apex.anhSanPham(p.name) + '\'" />' +
        (dsAnh.length > 1
          ? '<div class="dai-anh-nho">' + dsAnh.map(function (u, k) {
              return '<img src="' + Apex.esc(Apex.anhDayDu(u)) + '" alt=""' + (k === 0 ? ' class="dang-xem"' : '') +
                ' onclick="xemAnhChiTiet(this)" />';
            }).join('') + '</div>'
          : '') +
        '</div>' +
        '<div>' +
        dong('Danh mục', Apex.badgeDanhMuc(p.danhMucId)) +
        dong('Loại sản phẩm', Apex.badgeLoaiSanPham(p.loaiSanPham)) +
        dong('Trạng thái', Apex.badgeTtSanPham(p.trangThai)) +
        dong('Hiển thị trên web', p.cat === 'Đang bán'
          ? '<span class="badge badge-xanh"><span class="cham"></span> Đang bán</span>'
          : '<span class="badge badge-xam"><span class="cham"></span> Đang ẩn</span>') +
        dong('Giá bán', Apex.money(p.price || 0)) +
        dong('Tồn kho', Apex.number(p.stock || 0) + ' — ' + Apex.badgeTon(p.stock)) +
        dong('Giá trị tồn', Apex.money((p.price || 0) * (p.stock || 0))) +
        // Dòng màu có nhiều thẻ nên được xếp xuống hàng, các dòng khác thì không
        '<div class="dong-tt cho-xuong-dong"><span class="nhan-tt">Màu</span>' +
        '<span class="gia-tri">' + Apex.mauSanPham(p, 14) + '</span></div>' +
        (p.soLuong ? dong('Đã in', '<strong>' + Apex.number(p.soLuong) + '</strong> cái' +
          (p.nhieuMau ? ' · nhiều màu' : '')) : '') +
        dsNhua.map(function (v) {
          // Tên cuộn dài thì cắt "…", để title cho rê chuột thấy đủ
          return '<div class="dong-tt"><span class="nhan-tt" title="' + Apex.esc(v.ten) + '">' +
            Apex.oMau(v.maMau, v.mau, 13) + Apex.esc(v.ten) + '</span>' +
            '<span class="gia-tri"><strong>' + Apex.number(v.tongGram || 0) + 'g</strong>' +
            '<span style="color:var(--chu-mo);font-weight:400;"> = ' + Apex.number(v.soLuong || 1) + ' × (' +
            Apex.number(v.gramNhua || 0) + (v.gramThua ? '+' + Apex.number(v.gramThua) : '') + 'g)</span>' +
            '</span></div>';
        }).join('') +
        (p.tongGramNhua
          ? dong('Nhựa đã trừ kho', '<strong>' + Apex.number(p.tongGramNhua) + 'g</strong>')
          : '') +
        (p.tienNhua ? dong('Tiền nhựa', Apex.money(p.tienNhua)) : '') +
        (p.moTa
          ? '<div style="margin-top:14px;"><div style="font-weight:600;margin-bottom:5px;">Mô tả</div>' +
            '<div style="color:var(--chu-mo);font-size:13.5px;white-space:pre-wrap;">' + Apex.esc(p.moTa) + '</div></div>'
          : '') +
        '<div class="o-nhap" style="margin-top:16px;margin-bottom:0;">' +
        '<label for="ct-trang-thai">Đổi nhanh trạng thái</label>' +
        '<select id="ct-trang-thai" onchange="Apex.doiTrangThaiSanPham(' + p.dbId + ', this.value)">' +
        chonTt + '</select></div>' +
        '</div></div></div>' +

        '<div class="ht-chan">' +
        '<button class="nut nut-do" type="button" onclick="Apex.xoaSanPham(' + p.dbId + ', ' +
        jsStr(p.name) + ')"><i class="fa-solid fa-trash"></i> Xoá</button>' +
        '<div class="day-phai">' +
        '<button class="nut nut-vien" type="button" onclick="Apex.anHienSanPham(' + p.dbId + ', ' +
        (p.dangBan ? 'true' : 'false') + ')">' +
        '<i class="fa-solid fa-' + (p.dangBan ? 'eye-slash' : 'eye') + '"></i> ' +
        (p.dangBan ? 'Ẩn' : 'Hiện') + '</button>' +
        '<button class="nut nut-chinh" type="button" onclick="moFormSanPham(' + i + ')">' +
        '<i class="fa-solid fa-pen-to-square"></i> Sửa</button></div>' +
        '</div>';

      Apex.moHopThoai(html, 'rong-lon');
    }

    /** Bấm ảnh nhỏ trong hộp chi tiết thì ảnh lớn đổi theo. */
    function xemAnhChiTiet(el) {
      var lon = document.getElementById('ct-anh-lon');
      if (lon) lon.src = el.src;
      Array.prototype.forEach.call(el.parentNode.children, function (c) {
        c.classList.toggle('dang-xem', c === el);
      });
    }

    /* ---------------- Hộp thoại THÊM / SỬA ---------------- */

    var layAnh = null;
    /* Cuộn nhựa -> số gram sản phẩm ĐANG mở đã trừ ở cuộn đó (xem moFormSanPham) */
    var GRAM_DA_TRU = {};

    function moFormSanPham(i) {
      var p = (i === null || i === undefined) ? null : SP[i];
      var moi = !p;
      var tongSl = p ? (p.soLuong || 1) : 1;
      var nhieuMau = p ? !!p.nhieuMau : false;

      var chonTt = Object.keys(Apex.ttSanPham).map(function (k) {
        var macDinh = p ? p.trangThai : 'san_hang';
        return '<option value="' + k + '"' + (k === macDinh ? ' selected' : '') + '>' +
          Apex.ttSanPham[k].ten + '</option>';
      }).join('');

      var chonLoai = Object.keys(Apex.loaiSanPham).map(function (k) {
        var macDinh = p ? (p.loaiSanPham || 'ban') : 'ban';
        return '<option value="' + k + '"' + (k === macDinh ? ' selected' : '') + '>' +
          Apex.loaiSanPham[k].ten + '</option>';
      }).join('');

      var chonDm = '<option value="">— Chưa phân loại —</option>' + Apex.danhMucSanPham().map(function (d) {
        return '<option value="' + d.id + '"' + (p && p.danhMucId === d.id ? ' selected' : '') + '>' +
          Apex.esc(d.ten) + '</option>';
      }).join('');

      /* Nhựa: một sản phẩm in được bằng nhiều cuộn nên đây là danh sách dòng.
         GRAM_DA_TRU nhớ phần sản phẩm này ĐANG trừ ở mỗi cuộn, để ô "còn ...g"
         cộng lại phần đó — nếu không thì sửa lại chính nó sẽ thấy thiếu nhựa. */
      GRAM_DA_TRU = {};
      (p ? p.vatTus || [] : []).forEach(function (v) {
        // daTru đã nhân sẵn số lượng — đây mới là phần kho đang giữ cho sản phẩm này
        GRAM_DA_TRU[v.vatTuId] = (GRAM_DA_TRU[v.vatTuId] || 0) + (v.daTru || 0);
      });

      var html =
        '<div class="ht-dau">' +
        '<div><h3>' + (moi ? 'Thêm sản phẩm mới' : 'Sửa sản phẩm') + '</h3>' +
        (moi ? '' : '<div class="phu">' + Apex.esc(p.name) + '</div>') + '</div>' +
        '<button class="nut-dong" type="button" onclick="Apex.dongHopThoai()" aria-label="Đóng">' +
        '<i class="fa-solid fa-xmark"></i></button></div>' +

        '<div class="ht-than">' +
        Apex.htmlBoAnh('sp-anh') +
        '<div class="o-nhap"><label for="f-ten">Tên sản phẩm *</label>' +
        '<input type="text" id="f-ten" value="' +
        (p ? Apex.esc(p.name) : '') + '" /></div>' +
        '<div class="luoi-nhap-2">' +
        '<div class="o-nhap"><label for="f-gia">Giá bán (VNĐ)</label>' +
        '<input type="number" id="f-gia" min="0" step="1000" value="' + (p ? (p.price || 0) : 0) + '" /></div>' +
        '<div class="o-nhap"><label for="f-ton">Tồn kho</label>' +
        '<input type="number" id="f-ton" min="0" step="1" value="' + (p ? (p.stock || 0) : 0) + '" /></div>' +
        '<div class="o-nhap"><label for="f-danh-muc">Danh mục</label>' +
        '<select id="f-danh-muc">' + chonDm + '</select>' +
        '</div>' +
        '<div class="o-nhap"><label for="f-loai">Loại sản phẩm</label>' +
        '<select id="f-loai">' + chonLoai + '</select>' +
        '</div>' +
        '<div class="o-nhap"><label for="f-tt">Trạng thái</label>' +
        '<select id="f-tt">' + chonTt + '</select></div>' +
        '<div class="o-nhap"><label for="f-ban">Hiển thị trên website</label>' +
        '<select id="f-ban">' +
        '<option value="true"' + (!p || p.dangBan ? ' selected' : '') + '>Đang bán</option>' +
        '<option value="false"' + (p && !p.dangBan ? ' selected' : '') + '>Đang ẩn</option>' +
        '</select></div>' +
        '</div>' +
        '<div class="o-nhap"><label>Nhựa đã dùng</label>' +
        // Nhiều màu: một ô số lượng chung. Một màu: số cái nhập ở từng dòng cuộn.
        '<div class="hang-kieu-mau">' +
        '<label class="o-tick"><input type="checkbox" id="f-nhieu-mau"' + (nhieuMau ? ' checked' : '') +
        ' onchange="doiKieuMau()" /> Nhiều màu</label>' +
        '<div class="o-sl-chung" id="o-sl-chung"' + (nhieuMau ? '' : ' style="display:none"') + '>' +
        '<label for="f-so-luong">Số lượng</label>' +
        '<input type="number" id="f-so-luong" min="1" step="1" value="' + tongSl + '" oninput="doiTongSoCai()" />' +
        '</div></div>' +
        '<div class="khung-nhua' + (nhieuMau ? ' nhieu-mau' : '') + '" id="khung-nhua">' +
        '<div class="dau-nhua"><span class="cot-cuon">Cuộn nhựa</span><span class="cot-sl">Số cái</span>' +
        '<span>Gram/cái</span><span>Thừa/cái</span><span></span></div>' +
        '<div id="ds-nhua"></div>' +
        '</div>' +
        '<button type="button" class="nut nut-vien nut-nho" onclick="themDongNhua()">' +
        '<i class="fa-solid fa-plus"></i> Thêm cuộn nhựa</button>' +
        '<div class="mau-suy-ra" id="mau-suy-ra"></div>' +
        '<div class="tong-nhua" id="tong-nhua"></div>' +
        '</div>' +
        '<div class="o-nhap"><label for="f-mota">Mô tả</label>' +
        '<textarea id="f-mota" rows="3">' +
        (p ? Apex.esc(p.moTa || '') : '') + '</textarea></div>' +
        '<div class="bao-loi" id="loi-form"></div>' +
        '</div>' +

        '<div class="ht-chan"><div class="day-phai">' +
        '<button class="nut nut-vien" type="button" onclick="Apex.dongHopThoai()">Huỷ</button>' +
        '<button class="nut nut-chinh" type="button" onclick="luuForm(' + (p && p.dbId ? p.dbId : 'null') + ')">' +
        '<i class="fa-solid fa-floppy-disk"></i> Lưu</button>' +
        '</div></div>';

      Apex.moHopThoai(html);
      layAnh = Apex.ganBoAnh('sp-anh', p ? p.dsAnh : []);

      var dsCu = p ? (p.vatTus || []) : [];
      if (dsCu.length) dsCu.forEach(function (v) { themDongNhua(v); });
      else themDongNhua();
    }

    /* ---------------- Danh sách cuộn nhựa trong form ---------------- */

    /** Cuộn này còn bao nhiêu gram nếu trả lại phần sản phẩm đang sửa đã trừ. */
    function conLaiChoForm(v) {
      return (v.conLaiGram || 0) + (GRAM_DA_TRU[v.id] || 0);
    }

    function laNhieuMau() {
      var o = document.getElementById('f-nhieu-mau');
      return !!(o && o.checked);
    }

    /** Tổng số cái: nhiều màu = ô số lượng chung; một màu = cộng số cái từng cuộn. */
    function tongSoCaiTrenForm() {
      if (laNhieuMau()) {
        var o = document.getElementById('f-so-luong');
        return Math.max(1, parseInt(o ? o.value : 1, 10) || 1);
      }
      var ds = docDongNhua();
      return ds.length ? ds.reduce(function (s, d) { return s + d.soLuong; }, 0) : 1;
    }

    /** Nhiều màu: mọi dòng lấy đúng số lượng chung (ô số cái từng dòng đang giấu). */
    function doiTongSoCai() {
      if (laNhieuMau()) {
        var sl = tongSoCaiTrenForm();
        Array.prototype.forEach.call(document.querySelectorAll('#ds-nhua .nhua-sl'), function (i) {
          i.value = sl;
        });
      }
      veTongNhua();
    }

    /** Bật/tắt "Nhiều màu". Sang nhiều màu thì lấy số cái lớn nhất đang có làm số lượng chung. */
    function doiKieuMau() {
      var nhieu = laNhieuMau();
      document.getElementById('khung-nhua').classList.toggle('nhieu-mau', nhieu);
      document.getElementById('o-sl-chung').style.display = nhieu ? '' : 'none';
      if (nhieu) {
        var lonNhat = 1;
        Array.prototype.forEach.call(document.querySelectorAll('#ds-nhua .nhua-sl'), function (i) {
          lonNhat = Math.max(lonNhat, parseInt(i.value, 10) || 1);
        });
        document.getElementById('f-so-luong').value = lonNhat;
      }
      doiTongSoCai();
    }

    /** Dòng tổng dưới danh sách nhựa. */
    function veTongNhua() {
      var o = document.getElementById('tong-nhua');
      if (!o) return;
      var ds = docDongNhua();
      if (!ds.length) { o.innerHTML = ''; return; }
      var tong = 0, phep;
      if (laNhieuMau()) {
        // Mỗi cái ăn tất cả các cuộn: cộng gram mọi cuộn rồi nhân số lượng chung
        var sl = tongSoCaiTrenForm();
        var moiCai = ds.reduce(function (s, d) { return s + d.gramNhua + d.gramThua; }, 0);
        tong = moiCai * sl;
        phep = Apex.number(moiCai) + 'g/cái × ' + Apex.number(sl);
      } else {
        phep = ds.map(function (d) {
          var mc = d.gramNhua + d.gramThua;
          tong += mc * d.soLuong;
          return Apex.number(mc) + 'g × ' + Apex.number(d.soLuong);
        }).join(' + ');
      }
      o.innerHTML = 'Tổng <strong>' + Apex.number(tongSoCaiTrenForm()) + ' cái</strong> · trừ vào kho: ' +
        Apex.esc(phep) + ' = <strong>' + Apex.number(tong) + 'g</strong>';
    }

    function optionCuonNhua(chonId) {
      return '<option value="">— Chọn cuộn nhựa —</option>' + Apex.cuonNhua().map(function (v) {
        return '<option value="' + v.id + '"' + (v.id === chonId ? ' selected' : '') + '>' +
          Apex.esc(v.ten) + (v.mau ? ' · ' + Apex.esc(v.mau) : '') +
          ' — còn ' + Apex.number(conLaiChoForm(v)) + 'g</option>';
      }).join('');
    }

    function themDongNhua(v) {
      var o = document.createElement('div');
      o.className = 'dong-nhua';
      o.innerHTML =
        '<select class="nhua-cuon" onchange="veMauSuyRa()">' + optionCuonNhua(v ? v.vatTuId : null) + '</select>' +
        '<input type="number" class="nhua-sl cot-sl" min="1" step="1" oninput="veTongNhua()" ' +
        // Nhiều màu: dòng mới theo số lượng chung (ô này đang giấu); một màu: mặc định 1 cái
        'value="' + (v ? (v.soLuong || 1) : (laNhieuMau() ? tongSoCaiTrenForm() : 1)) + '" />' +
        '<input type="number" class="nhua-gram" min="0" step="1" oninput="veTongNhua()" ' +
        'value="' + (v ? (v.gramNhua || 0) : 0) + '" />' +
        '<input type="number" class="nhua-thua" min="0" step="1" oninput="veTongNhua()" ' +
        'value="' + (v ? (v.gramThua || 0) : 0) + '" />' +
        '<button type="button" class="nut-bo-dong" title="Bỏ dòng này" onclick="boDongNhua(this)">' +
        '<i class="fa-solid fa-xmark"></i></button>';
      document.getElementById('ds-nhua').appendChild(o);
      veMauSuyRa();
    }

    function boDongNhua(nut) {
      var dong = nut.closest('.dong-nhua');
      if (dong) dong.remove();
      veMauSuyRa();
    }

    /** Màu sản phẩm = màu của các cuộn đang chọn. Không có ô chọn màu riêng nên
        không thể khai màu khác với nhựa thật sự dùng. */
    function veMauSuyRa() {
      var o = document.getElementById('mau-suy-ra');
      if (!o) return;
      var daCo = {}, html = '';
      docDongNhua().forEach(function (d) {
        var v = Apex.timVatTu(d.vatTuId);
        if (!v || !v.mau || daCo[v.mau]) return;
        daCo[v.mau] = true;
        html += '<span class="badge badge-xam">' + Apex.oMau(v.maMau, v.mau, 13) + Apex.esc(v.mau) + '</span>';
      });
      o.innerHTML = html;
      veTongNhua();
    }

    /** Đọc các dòng nhựa trên form; bỏ qua dòng chưa chọn cuộn. */
    function docDongNhua() {
      return Array.prototype.map.call(document.querySelectorAll('#ds-nhua .dong-nhua'), function (o) {
        return {
          vatTuId: parseInt(o.querySelector('.nhua-cuon').value, 10) || null,
          soLuong: Math.max(1, parseInt(o.querySelector('.nhua-sl').value, 10) || 1),
          gramNhua: parseInt(o.querySelector('.nhua-gram').value, 10) || 0,
          gramThua: parseInt(o.querySelector('.nhua-thua').value, 10) || 0
        };
      }).filter(function (d) { return d.vatTuId; });
    }

    function luuForm(dbId) {
      var loi = document.getElementById('loi-form');
      var ten = document.getElementById('f-ten').value.trim();
      if (!ten) { loi.textContent = 'Vui lòng nhập tên sản phẩm.'; return; }

      var gia = parseInt(document.getElementById('f-gia').value, 10);
      var ton = parseInt(document.getElementById('f-ton').value, 10);
      if (isNaN(gia) || gia < 0) { loi.textContent = 'Giá bán không hợp lệ.'; return; }
      if (isNaN(ton) || ton < 0) { loi.textContent = 'Tồn kho không hợp lệ.'; return; }

      var dsNhua = docDongNhua();
      var boSot = Array.prototype.some.call(document.querySelectorAll('#ds-nhua .dong-nhua'), function (o) {
        return !o.querySelector('.nhua-cuon').value &&
               ((parseInt(o.querySelector('.nhua-gram').value, 10) || 0) > 0 ||
                (parseInt(o.querySelector('.nhua-thua').value, 10) || 0) > 0);
      });
      if (boSot) { loi.textContent = 'Có dòng đã nhập gram nhưng chưa chọn cuộn nhựa.'; return; }

      var nhieuMau = laNhieuMau();
      var tongSl = tongSoCaiTrenForm();
      // Nhiều màu: mọi dòng đúng bằng số lượng chung (backend cũng tự chuẩn hoá lại)
      if (nhieuMau) dsNhua.forEach(function (d) { d.soLuong = tongSl; });

      loi.textContent = '';
      var duLieu = {
        soLuong: tongSl,
        nhieuMau: nhieuMau,
        vatTus: dsNhua,
        ten: ten,
        gia: gia,
        tonKho: ton,
        trangThai: document.getElementById('f-tt').value,
        loaiSanPham: document.getElementById('f-loai').value,
        danhMucId: document.getElementById('f-danh-muc').value
          ? parseInt(document.getElementById('f-danh-muc').value, 10) : null,
        dangBan: document.getElementById('f-ban').value === 'true',
        moTa: document.getElementById('f-mota').value.trim(),
        // Tất cả ảnh theo thứ tự; backend lấy ảnh đầu làm ảnh bìa
        danhSachAnh: layAnh ? layAnh() : []
      };

      // nạp lại cả vat-tu vì số gram vừa bị trừ khỏi cuộn nhựa
      if (Apex.luuSanPham(dbId, duLieu)) Apex.capNhatXong(['san-pham', 'danh-muc', 'vat-tu'], dbId ? 'Đã lưu sản phẩm' : 'Đã thêm sản phẩm');
      else loi.textContent = 'Không lưu được. Kiểm tra lại backend Java (cổng 8090) rồi thử lại.';
    }

    function veLaiTrang() { veKpi(); veLocDanhMuc(); veLocTrangThai(); veBang(); }
    Apex.datVeLai(veLaiTrang);   // Apex gọi ngay khi dữ liệu về, và sau mỗi lần ghi
  </script>
</body>
</html>
